<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Lucira · GA4 Geo Intelligence Dashboard</title>
<meta name="description" content="Enterprise GA4 Geo Intelligence command center for Lucira Jewelry — city, pin code and area demand, session-level analytics, real-data lead quality, campaign performance, store expansion and AI-generated CEO actions, mapped geographically. Every section is either wired to a real connected source or explicitly marked not-available — nothing is invented.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='17' y='3' width='66' height='94' rx='33' fill='%23A68380'/%3E%3Ctext x='50' y='58' font-family='Georgia,serif' font-size='42' font-weight='500' text-anchor='middle' fill='%23FFFFFF'%3EL%3C/text%3E%3Cpath d='M50 71 L54.5 78 L50 85 L45.5 78 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   LUCIRA · CITY INTELLIGENCE & MARKET EXPANSION — enterprise command center.
   14-page left-nav SPA. Luxury black/white/gold. Hash-routed. Hidden-by-default
   slide-out Advanced Filters drawer. Every chart/KPI carries an info popover.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Lucira brand — Metallic Gold, Rose Gold, Earthy Taupe, Warm Cream, Deep Slate/Sapphire Blue, Emerald */
  --taupe:#a68380; --cream:#f2dfce; --blush:#f2dce0; --rose:#d9a7b4; --soft-blue:#d5f2f7;
  --rosegold:#b76e79; --sapphire:#0d4f8b; --slate:#3d405b;
  --gold:#d4af37; --gold-2:#f2d888; --gold-deep:#b8860b; --gold-soft:rgba(212,175,55,.14);
  --emerald:#2a9d75; --royal:#0d4f8b; --crit:#c1566a; --warn:#d9a13d; --good:#2a9d75; --info:#0d4f8b;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --shadow:0 18px 50px -20px rgba(0,0,0,.65);
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Futura","Josefin Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-w:248px; --nav-w-collapsed:76px; --topbar-h:60px; --drawer-w:420px;
  --brand-brown:#8b6f56; --brand-brown-dark:#6e5744; --brand-mauve:#a05a64; --brand-mauve-light:#d9b8b4; --brand-cream:#fff8f0;
}
html[data-theme=dark]{
  --bg:#141010; --bg-2:#1a1514; --surface:#201a19; --surface-2:#271f1e; --surface-3:#2e2523;
  --glass:rgba(39,31,30,.62); --glass-brd:rgba(212,175,55,.18); --hair:rgba(255,255,255,.07);
  --ink:#f5ece0; --ink-2:#cab9ab; --muted:#8f7d70; --grid:rgba(255,255,255,.06);
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(212,175,55,.11),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(183,110,121,.10),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
}
html[data-theme=light]{
  --bg:#f6f6f4; --bg-2:#eeede9; --surface:#ffffff; --surface-2:#faf3ea; --surface-3:#f2e6d8;
  --glass:rgba(255,255,255,.74); --glass-brd:rgba(183,110,121,.28); --hair:rgba(61,64,91,.09);
  --ink:#3d405b; --ink-2:#8a6d67; --muted:#a3908a; --grid:rgba(61,64,91,.08);
  --gold:#b8860b; --gold-2:#c99a26;
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(184,134,11,.10),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(217,167,180,.16),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,251,246,.92),rgba(250,240,228,.5));
  --shadow:0 18px 44px -22px rgba(120,80,70,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;background-image:var(--sheen);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.2px;line-height:1.15}
a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;border:2px solid transparent;background-clip:content-box}
svg text{font-family:var(--sans)}

/* ---- loader ---- */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s var(--ease),visibility .6s}
#loader.done{opacity:0;visibility:hidden}
.load-mark{width:100px;height:100px;position:relative;display:grid;place-items:center}
.load-mark svg{width:100%;height:100%}
.load-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--glass-brd);border-top-color:var(--gold);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-word{font-family:var(--serif);font-size:26px;letter-spacing:6px;color:var(--brand-mauve);text-align:center}
.load-sub{font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:4px}
.dotless{position:relative;display:inline-block;font-style:normal}
.dotless::before{content:'';position:absolute;top:-.6em;left:50%;width:4px;height:4px;background:var(--brand-mauve-light);transform:translateX(-50%) rotate(45deg)}

/* ---- shell layout ---- */
#app{opacity:0;transition:opacity .5s var(--ease)} #app.ready{opacity:1}
.shell{display:flex;min-height:100vh}

/* left nav */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);z-index:70;background:var(--bg-2);border-right:1px solid var(--hair);display:flex;flex-direction:column;transition:width .25s var(--ease)}
.nav.collapsed{width:var(--nav-w-collapsed)}
.nav .brand{display:flex;align-items:center;gap:11px;padding:18px 16px;flex:0 0 auto;background:var(--brand-brown);border-bottom:2px solid var(--brand-brown-dark)}
.nav .brand .mono{width:30px;height:34px;flex:0 0 auto;display:grid;place-items:center}
.nav .brand .mono svg{width:20px;height:20px}
.nav .brand .wm{display:flex;flex-direction:column;line-height:1;overflow:hidden;white-space:nowrap}
.nav .brand .wm b{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:2px;color:var(--brand-cream);text-transform:none}
.nav .brand .wm span{font-size:7.5px;letter-spacing:2.4px;text-transform:uppercase;margin-top:2px;font-weight:600;color:rgba(255,248,240,.72)}
.nav.collapsed .brand .wm{display:none}
.navlist{flex:1 1 auto;overflow-y:auto;padding:10px 10px}
.navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink-2);font-size:12.8px;font-weight:500;margin-bottom:2px;transition:.18s var(--ease);white-space:nowrap;overflow:hidden;position:relative}
.navitem .ni{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center;font-size:14px}
.navitem .nlbl{overflow:hidden}
.navitem .nno{margin-left:auto;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--gold-soft);color:var(--gold-2)}
.navitem.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.nav.collapsed .nlbl,.nav.collapsed .nno{display:none}
.nav-foot{padding:12px 14px;border-top:1px solid var(--hair);flex:0 0 auto}
.nav-collapse-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:9px;color:var(--muted);font-size:11px;background:var(--surface-2);border:1px solid var(--hair)}
.nav-collapse-btn:hover{color:var(--gold)}

/* main column */
.mainwrap{margin-left:var(--nav-w);flex:1;min-width:0;transition:margin-left .25s var(--ease);display:flex;flex-direction:column;min-height:100vh}
.nav.collapsed ~ .mainwrap{margin-left:var(--nav-w-collapsed)}

/* top bar */
header.top{position:sticky;top:0;z-index:60;height:var(--topbar-h);backdrop-filter:none;background:var(--brand-brown);border-bottom:2px solid var(--brand-brown-dark);padding:0 clamp(14px,3vw,26px);display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.pagetitle{display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
.pagetitle b{font-family:var(--serif);font-size:18px;font-weight:600;white-space:nowrap}
.pagetitle span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;white-space:nowrap}
header.top .pagetitle b{color:var(--brand-cream)}
header.top .pagetitle span{color:rgba(255,248,240,.72)}
.top .spacer{flex:1}
.src-dot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);padding:5px 11px;border:1px solid var(--hair);border-radius:20px;background:var(--surface-2);white-space:nowrap}
.src-dot i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.src-dot.live i{background:var(--good);box-shadow:0 0 8px var(--good)}
header.top .src-dot{color:var(--brand-cream);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);transition:.2s var(--ease);font-size:15px;flex:0 0 auto}
.iconbtn:hover{color:var(--gold);border-color:var(--glass-brd)}
header.top .iconbtn{color:var(--brand-cream);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
header.top .iconbtn:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.btn{padding:8px 14px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.2s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--glass-brd);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(120deg,var(--gold),var(--gold-deep));color:#160f00;border:none;font-weight:600}
.btn.gold .cnt{background:rgba(0,0,0,.18);border-radius:20px;padding:1px 7px;font-size:10.5px;margin-left:2px}
header.top .btn:not(.gold){color:var(--brand-cream);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
header.top .btn:not(.gold):hover{border-color:rgba(255,255,255,.5)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow);min-width:190px;padding:6px;z-index:80;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;font-size:12.5px;text-align:left}
.menu button:hover{background:var(--surface-3);color:var(--gold)}

main{padding:clamp(14px,2.4vw,26px);max-width:1620px;margin:0 auto;width:100%;flex:1}
.page{display:none;animation:fade .45s var(--ease)} .page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.sec-head h2{font-size:22px}
.sec-head p{font-size:12px;color:var(--muted);margin-top:3px;max-width:640px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink-2)}
.chip.warn{border-color:rgba(242,177,58,.35);color:var(--warn)}
.chip.crit{border-color:rgba(239,83,80,.35);color:var(--crit)}
.chip.good{border-color:rgba(18,184,134,.35);color:var(--good)}

/* grids */
.grid{display:grid;gap:14px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* cards */
.card{background:var(--card-grad),var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px 17px;position:relative;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.kpi{padding:15px 16px 14px}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi .kt .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink)}
.kpi .val .u{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .delta{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px}
.kpi .delta.up{color:var(--good)} .kpi .delta.down{color:var(--crit)} .kpi .delta.flat{color:var(--muted)}
.kpi .foot{font-size:10.5px;color:var(--muted);margin-top:5px}
.kpi .target-bar{height:4px;border-radius:4px;background:var(--surface-3);margin-top:9px;overflow:hidden}
.kpi .target-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.info-ic{width:18px;height:18px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;font-size:10px;color:var(--muted);flex:0 0 auto;cursor:help}
.info-ic:hover{color:var(--gold);border-color:var(--glass-brd)}

.chart-card h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.chart-card .sub{font-size:10.5px;color:var(--muted);margin-bottom:10px}
.chart-card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}

/* AI / CEO box */
.ceo-box{background:linear-gradient(158deg,rgba(212,175,55,.09),rgba(183,110,121,.06)),var(--surface);border:1px solid var(--glass-brd);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow)}
.ceo-box .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ceo-box .hd .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:grid;place-items:center;color:#160f00;font-size:16px}
.ceo-box .hd b{font-family:var(--serif);font-size:17px}
.ceo-box .hd span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ceo-narr{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.ceo-narr b{color:var(--ink);font-weight:600}
.ceo-narr .city-tag{color:var(--gold-2);font-weight:600}
.ceo-cols{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;margin-top:16px}
@media(max-width:900px){.ceo-cols{grid-template-columns:1fr}}
.ceo-cols h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold-2);margin-bottom:9px}
.ceo-cols ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.ceo-cols li{font-size:12.5px;color:var(--ink-2);padding-left:16px;position:relative;line-height:1.5}
.ceo-cols li::before{content:'—';position:absolute;left:0;color:var(--gold)}

/* insight card (attached under every chart) */
.insight{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--hair);font-size:11.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.insight .ii{color:var(--gold);flex:0 0 auto;margin-top:1px}
.insight b{color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md)}
table.dt{width:max-content;min-width:100%;border-collapse:collapse;font-size:12.2px}
table.dt thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--hair);cursor:pointer;white-space:nowrap;user-select:none}
table.dt thead th:hover{color:var(--gold)}
table.dt tbody td{padding:8px 11px;border-bottom:1px solid var(--hair);color:var(--ink-2);white-space:nowrap}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt tbody td.strong{color:var(--ink);font-weight:600}
.rankpill{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--surface-3);font-size:10.5px;font-weight:700;color:var(--muted)}
.rankpill.top{background:var(--gold-soft);color:var(--gold-2)}
.pbar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;border-radius:4px}
.tagbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--ink-2)}
.tagbadge.gold{background:var(--gold-soft);color:var(--gold-2)}
.tagbadge.good{background:rgba(18,184,134,.13);color:var(--good)}
.tagbadge.crit{background:rgba(239,83,80,.13);color:var(--crit)}
.tagbadge.warn{background:rgba(242,177,58,.13);color:var(--warn)}

/* action cards */
.action-card{border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.action-card .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.action-card .hd b{font-size:14.5px;font-family:var(--serif)}
.action-card .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px}
.action-card .kv div span{display:block;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.prio{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.prio.p1{background:rgba(239,83,80,.15);color:var(--crit)}
.prio.p2{background:rgba(242,177,58,.15);color:var(--warn)}
.prio.p3{background:rgba(18,184,134,.15);color:var(--good)}

/* filter drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:89;opacity:0;visibility:hidden;transition:.3s var(--ease)}
.overlay.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer-w),92vw);background:var(--bg-2);border-left:1px solid var(--hair);z-index:90;transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.5)}
.drawer.on{transform:translateX(0)}
.drawer .dhd{padding:16px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between}
.drawer .dhd b{font-family:var(--serif);font-size:16.5px}
.drawer .dbody{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.drawer .dfoot{padding:14px 18px;border-top:1px solid var(--hair);display:flex;gap:10px}
.fgroup label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px;font-weight:600}
.ms{position:relative}
.ms-box{min-height:36px;border:1px solid var(--hair);background:var(--surface-2);border-radius:9px;padding:5px 8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;cursor:pointer}
.ms-box:hover{border-color:var(--glass-brd)}
.ms-box .ph{color:var(--muted);font-size:12px;padding:3px 2px}
.ms-tag{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold-2);border-radius:14px;padding:3px 8px;font-size:11px}
.ms-tag b{cursor:pointer;font-weight:700}
.ms-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;max-height:220px;overflow-y:auto;z-index:20;display:none;box-shadow:var(--shadow)}
.ms-drop.on{display:block}
.ms-drop input.msf{width:100%;padding:8px 10px;border:none;border-bottom:1px solid var(--hair);background:transparent;color:var(--ink);font-size:12px;outline:none;position:sticky;top:0}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;cursor:pointer}
.ms-opt:hover{background:var(--surface-3)}
.ms-opt input{accent-color:var(--gold)}
select.inp,input.inp{background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;color:var(--ink);padding:7px 10px;font-size:12px;outline:none;width:100%}

<script>
/* GA4 Geo Intelligence Dashboard — main application script.
   Built on top of the earlier City Intelligence & Market Expansion engine (same
   utils/charts/filter/insight/opportunity-score infrastructure) — extended with the
   session-grain GA4 fact table (real distinct users, new/returning, funnel, source/
   medium/campaign/landing analysis) and Zoho pin-code data. Sections with no real
   connected source (Area master, WebEngage events, cross-source identity, session-
   to-deal linkage) render an explicit not-available notice — see GATE_REASONS below. */

/* ============================== 1. NAV ============================== */
const NAV_ITEMS = [
  {id:'pincode',         icon:'▦', label:'Pin Code Intelligence'},
  {id:'caratlane',       icon:'◈', label:'CaratLane Info'},
  {id:'exec',            icon:'◆', label:'Executive Summary'},
  {id:'cityoverview',    icon:'⬢', label:'City Overview & Map'},
  {id:'cityperf',        icon:'▲', label:'City Performance'},
  {id:'salesorders',     icon:'🛍', label:'Sales & Orders (ERP)'},
  {id:'sessionanalysis', icon:'↯', label:'Session Analysis'},
  {id:'journey',         icon:'↝', label:'User Journey'},
  {id:'campaigns',       icon:'✦', label:'Campaign Performance'},
  {id:'roi',             icon:'$', label:'Marketing ROI'},
  {id:'today',           icon:'☀', label:"Today's Users"},
  {id:'expansion',       icon:'⌂', label:'High Opportunity Areas'},
  {id:'returning',       icon:'↺', label:'Returning Users'},
  {id:'funnel',          icon:'▽', label:'Sales Funnel'},
  {id:'ai',              icon:'✧', label:'AI Insights'},
  {id:'actions',         icon:'☑', label:'Action Center'},
  {id:'docs',            icon:'▤', label:'Documentation'},
  {id:'dictionary',      icon:'ℹ', label:'Data Dictionary'},
  {id:'chat',            icon:'💬', label:'AI Chat'},
];
const PAGE_META = {
  exec:{t:'Executive Summary', s:'CEO Command Center'},
  cityoverview:{t:'City Overview & Map', s:'Every city, one leaderboard + geo map'},
  cityperf:{t:'City Performance', s:'Rankings · heatmaps · correlations'},
  pincode:{t:'Pin Code Intelligence', s:'Real deals + modelled demand, pin-code by pin-code — store-opening candidates'},
  caratlane:{t:'CaratLane Info', s:"Competitor's public store footprint & catalog mix"},
  salesorders:{t:'Sales & Orders (ERP)', s:'Real completed-order revenue by customer city'},
  sessionanalysis:{t:'Session Analysis', s:'Source · Medium · Campaign · Landing Page — real session-grain'},
  journey:{t:'User Journey', s:'Users → Sessions → Cart → Checkout → Deals → Orders → Revenue'},
  campaigns:{t:'Campaign Performance', s:'What is working, where, and why'},
  roi:{t:'Marketing ROI', s:'City × campaign × channel efficiency'},
  today:{t:"Today's Users", s:'Most recent available GA4 day (export lags ~2 days)'},
  expansion:{t:'High Opportunity Areas', s:'High users, low deals, zero revenue — city-level (no Area/Pin drill exists)'},
  returning:{t:'Returning Users', s:'Real new-vs-returning split from the session-grain fact table'},
  funnel:{t:'Sales Funnel', s:'Users → Sessions → PDP → ATC → Deals → Won'},
  ai:{t:'AI Insights', s:'Auto-generated opportunities, risks, issues'},
  actions:{t:'Action Center', s:'Every recommendation, evidence-first'},
  docs:{t:'Documentation', s:'Purpose, sources, logic, how to use'},
  dictionary:{t:'Data Dictionary', s:'Every KPI, defined'},
  chat:{t:'AI Chat', s:'Ask the dashboard a question'},
};
/* Whether a page's own data actually re-slices when the header date-range chip changes.
   Default (absent from this map) = 'filtered' (uses STATE.filters.dateRange, e.g. via
   filteredCity()/filteredNationalDaily()/filteredZohoDaily()/filteredZohoPincode()).
   Kept as an explicit exceptions list, single source of truth, so the header badge next
   to the page title never silently implies a date scope the underlying query doesn't have. */
const DATE_SCOPE = {
  campaigns:      {mode:'full',  note:'Full connected window — campaign totals are not broken down by day in the source query.'},
  roi:            {mode:'full',  note:'Full connected window — built from the same non-daily campaign data as Campaign Performance.'},
  sessionanalysis:{mode:'full',  note:'Full connected window — session-analysis rows are not broken down by day in the source query.'},
  salesorders:    {mode:'full',  note:'Full ERP snapshot — this section has its own independent data window, separate from the GA4 date filter above.'},
  caratlane:      {mode:'full',  note:'One-time public data capture (Aug 2026) — has no date dimension at all, independent of the date filter above.'},
  today:          {mode:'fixed', note:"Always the most recent GA4 day available — doesn't change with the date filter above."},
  docs:           {mode:'na'}, dictionary:{mode:'na'}, chat:{mode:'na'},
  journey:        {mode:'na'},
};
/* Reasons shown on every gated (not-available) section — single source of truth so the
   wording never drifts between the section itself, Documentation and the Data Dictionary. */
const GATE_REASONS = {
  area: 'No Area/locality field exists in GA4 (no postal dimension at all), Zoho (Address_Zip is a raw pin code, not resolved to a locality) or any other connected source — and no Pin Code → Area → City → State master table is connected. Building this needs either a licensed pincode-to-locality dataset or a manually maintained lookup, neither of which exists in this project today.',
  identified: 'GA4 (session or event export) carries no email, mobile or account user-id field — only an anonymous client/session id. WebEngage, Zoho and Shopify each have real emails/mobiles, but there is no shared key connecting a WebEngage/Zoho/Shopify identity back to a specific GA4 client id or session. Cross-source identity resolution (the "GA4 → Identified User → WebEngage → Zoho Deal → Sale" journey this dashboard is meant to show) cannot be built until a shared identifier — most simply, calling gtag(\'set\',{user_id: hashed_email_or_mobile}) at login/checkout — is added to the site and starts flowing into the GA4 export.',
  attribution: 'A session-to-sale link needs a session or client id captured on the Deal/Order at the moment of purchase. Neither Zoho Deals nor the Shopify order feed store a GA4 session_id or client_id today, so no row in this dashboard can join a specific session to a specific Deal ID or Order ID — only aggregate, same-window correlations (see Session Analysis, User Journey) are possible.',
  webengage: 'WebEngage account access exists, but no event-level feed (push/email/WhatsApp sends, opens, journeys) has been built — the only current WebEngage usage anywhere in this project is a boolean "this mobile number was seen in WebEngage" match used for walk-in channel attribution, which has no city/pin dimension and is not campaign-level data. A dedicated WebEngage API/export is a prerequisite before this section can show real Push/Email/WhatsApp counts.',
};
function gateCard(title, why, alsoSee){
  return `<div class="card" style="border-color:rgba(242,177,58,.35)">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <span style="font-size:20px;color:var(--warn);line-height:1">🔒</span>
      <div>
        <b style="font-size:14px">${esc(title)} — not available</b>
        <p style="font-size:12.3px;color:var(--ink-2);line-height:1.7;margin-top:8px">${esc(why)}</p>
        ${alsoSee?`<p style="font-size:12px;color:var(--gold-2);margin-top:8px">→ ${alsoSee}</p>`:''}
      </div>
    </div>
  </div>`;
}
function simpleTable(id, headers, rows, opts){
  opts = opts||{};
  return `<div class="card flush">
    ${opts.title?`<div style="padding:16px 17px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><h3 style="font-size:13.5px">${esc(opts.title)}</h3>${opts.searchable?`<div class="searchbox"><span>🔎</span><input placeholder="Search…" data-table="${id}"></div>`:''}</div>`:''}
    <div class="tbl-wrap" style="padding:12px 17px 17px">
      <table class="dt" id="${id}"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map(cell=>{
        const v = Array.isArray(cell) ? cell[0] : cell;
        const sortv = Array.isArray(cell) ? cell[1] : null;
        return `<td${sortv!=null?` data-v="${sortv}"`:''}>${v}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table>
    </div>
    ${opts.hint?`<div class="hint" style="padding:0 17px 16px">${opts.hint}</div>`:''}
  </div>`;
}

/* ============================== 2. UTILS ============================== */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (tag,cls,html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
function n(v){ if(v==null||v==='') return 0; const x = typeof v==='number' ? v : parseFloat(v); return isNaN(x)?0:x; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtInt(v){ return Math.round(n(v)).toLocaleString('en-IN'); }
function fmtNum(v,d){ d=d==null?1:d; return n(v).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0}); }
function fmtPct(v,d){ d=d==null?1:d; return n(v).toFixed(d)+'%'; }
function fmtMoney(v){
  const x = n(v);
  const abs = Math.abs(x);
  if(abs>=1e7) return '₹'+(x/1e7).toFixed(2)+' Cr';
  if(abs>=1e5) return '₹'+(x/1e5).toFixed(2)+' L';
  if(abs>=1e3) return '₹'+(x/1e3).toFixed(1)+'k';
  return '₹'+Math.round(x).toLocaleString('en-IN');
}
function fmtMoneyFull(v){ return '₹'+Math.round(n(v)).toLocaleString('en-IN'); }
function safeDiv(a,b){ return b>0 ? a/b : 0; }
function groupBy(arr,fn){ const m=new Map(); for(const x of arr){ const k=fn(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); } return m; }
function sumBy(arr,fn){ return arr.reduce((s,x)=>s+n(fn(x)),0); }
function byDesc(fn){ return (a,b)=> n(fn(b))-n(fn(a)); }
function byAsc(fn){ return (a,b)=> n(fn(a))-n(fn(b)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg){
  let t = $('#toastEl');
  if(!t){ t=el('div','',''); t.id='toastEl'; t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--glass-brd);color:var(--ink);padding:10px 18px;border-radius:11px;font-size:12.5px;z-index:200;box-shadow:var(--shadow);transition:opacity .3s'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function csvFromRows(headers, rows){
  const esc2 = v => { const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\r\n');
}
function xlsFromRows(title, headers, rows){
  let x = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#D4AF37" ss:Pattern="Solid"/></Style></Styles><Worksheet ss:Name="${esc(title).slice(0,30)}"><Table>`;
  x += '<Row>'+headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${esc(h)}</Data></Cell>`).join('')+'</Row>';
  for(const r of rows){ x += '<Row>'+r.map(v=>{ const isNum = typeof v==='number'; return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${esc(v)}</Data></Cell>`; }).join('')+'</Row>'; }
  x += '</Table></Worksheet></Workbook>';
  return x;
}
function svgEl(tag, attrs){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const PALETTE = ['#d4af37','#8b5cf6','#4d96ff','#12b886','#ef5350','#f2b13a','#e879b9','#5eead4','#f97316','#a3a3a3'];

/* ============================== 3. STATE ============================== */
const STATE = {
  theme: localStorage.getItem('cityIntelTheme') || 'dark',
  navCollapsed: false,
  currentPage: 'pincode',
  drawerOpen: false,
  comparisonPeriod: 'prev_period', // prev_period | wow | mom | qoq
  filters: {},          // key -> array of selected values (multiselect) or {start,end} for date
  live: false,
  D: null,              // normalized data bundle, built by buildData()
};

/* ============================== 4. FILTER FIELD DEFINITIONS ==============================
   Every field the spec asked for is rendered. `live:true` fields are backed by real
   columns in ga4_data.ga4_data / lucira_zoho_Deals and get real, dynamic option lists.
   `live:false` fields have no corresponding column in either source table today —
   they render disabled with a reason, rather than being faked. */
const FILTER_GROUPS = [
  { title:'Date & Comparison', fields:[
    {key:'dateRange', label:'Date Range', type:'date', live:true},
    {key:'comparison', label:'Comparison Period', type:'select', live:true, options:[['prev_period','Previous period'],['wow','Week over week'],['mom','Month over month'],['qoq','Quarter over quarter']]},
  ]},
  { title:'Geography', fields:[
    {key:'city', label:'City', type:'ms', live:true, src:'city'},
    {key:'state', label:'State', type:'ms', live:true, src:'state'},
    {key:'region', label:'Region', type:'ms', live:false, why:'No region/zone master mapping connected yet'},
    {key:'zone', label:'Zone', type:'ms', live:false, why:'No region/zone master mapping connected yet'},
    {key:'store', label:'Store', type:'ms', live:false, why:'No store master (location list) connected to either source table'},
    {key:'pincode', label:'Pincode', type:'ms', live:true, src:'pincode'},
    {key:'area', label:'Area', type:'ms', live:false, why:'No Area/locality field or Pin→Area master exists in any connected source'},
    {key:'storeRadius', label:'Store Radius', type:'select', live:false, why:'Needs store lat/long master — not connected', options:[['5','5 km'],['10','10 km'],['25','25 km'],['50','50 km']]},
  ]},
  { title:'Campaign & Traffic', fields:[
    {key:'campaignSource', label:'Campaign Source / UTM Source', type:'ms', live:true, src:'source'},
    {key:'campaignMedium', label:'Campaign Medium / UTM Medium', type:'ms', live:true, src:'medium'},
    {key:'campaignName', label:'Campaign Name / UTM Campaign', type:'ms', live:true, src:'campaign'},
    {key:'channelGroup', label:'Channel Group', type:'ms', live:true, src:'channel'},
    {key:'platform', label:'Platform (app/web)', type:'ms', live:false, why:'GA4 export mart carries device category only, not app-vs-web platform'},
    {key:'device', label:'Device', type:'ms', live:true, src:'device'},
    {key:'landingPage', label:'Landing Page', type:'ms', live:false, why:'No landing_page column in the connected GA4 mart'},
  ]},
  { title:'Product', fields:[
    {key:'productType', label:'Product / Category', type:'ms', live:true, src:'productType'},
    {key:'subCategory', label:'Sub Category', type:'ms', live:false, why:'No sub-category column beyond product_type in the product master'},
    {key:'collection', label:'Collection', type:'ms', live:true, src:'collection'},

/* Date presets, relative to the LATEST real day in the connected fact table (STATE.D.dateBounds.max)
   -- not the browser's actual today, since the GA4 export itself lags real-time by ~1-2 days. */
const DATE_PRESETS = [
  {key:'today', label:'Today (latest day)'},
  {key:'yesterday', label:'Yesterday'},
  {key:'last7', label:'Last 7 Days'},
  {key:'last30', label:'Last 30 Days'},
  {key:'thisMonth', label:'This Month'},
  {key:'lastMonth', label:'Last Month'},
  {key:'full', label:'Full Range'},
];
function ymd(d){ return d.toISOString().slice(0,10); }
function addDaysISO(iso, days){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return ymd(d); }
function fmtShortDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00Z'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); }
/* Renders the header date-range badge for the CURRENT page — the single place that keeps
   every tab honest about whether its data actually moves with the date filter (see DATE_SCOPE). */
function renderDateRangeChip(){
  const chip = $('#dateRangeChip'), lbl = $('#dateRangeChipLbl');
  if(!chip || !lbl) return;
  const dr = STATE.filters.dateRange || {};
  const scope = DATE_SCOPE[STATE.currentPage] || {mode:'filtered'};
  if(scope.mode==='na'){ chip.style.display='none'; return; }
  chip.style.display='inline-flex';
  if(scope.mode==='fixed'){ lbl.textContent = '📅 Latest day: '+fmtShortDate(STATE.D.dateBounds && STATE.D.dateBounds.max); }
  else if(scope.mode==='full'){ lbl.textContent = '📅 Full window (not date-filtered)'; }
  else { lbl.textContent = '📅 '+fmtShortDate(dr.start)+' → '+fmtShortDate(dr.end); }
  chip.title = scope.note ? scope.note : 'Click to change the date range that this and every other filterable tab uses.';
}
function setDatePreset(key){
  const max = STATE.D.dateBounds.max, min = STATE.D.dateBounds.min;
  if(!max) return;
  let start, end;
  if(key==='today'){ start=max; end=max; }
  else if(key==='yesterday'){ start=addDaysISO(max,-1); end=addDaysISO(max,-1); }
  else if(key==='last7'){ start=addDaysISO(max,-6); end=max; }
  else if(key==='last30'){ start=addDaysISO(max,-29); end=max; }
  else if(key==='thisMonth'){ start=max.slice(0,8)+'01'; end=max; }
  else if(key==='lastMonth'){
    const firstThis = new Date(max.slice(0,8)+'01T00:00:00Z');
    const lastMonthEnd = new Date(firstThis); lastMonthEnd.setUTCDate(0);
    const lastMonthStart = new Date(lastMonthEnd.getFullYear(), lastMonthEnd.getUTCMonth(), 1);
    start = lastMonthEnd.toISOString().slice(0,8)+'01'; end = ymd(lastMonthEnd);
  }
  else { start=min; end=max; }
  if(start<min) start=min;
  STATE.filters.dateRange = {start, end};
  renderDrawer(); updateFilterChip(); renderActivePage();
  toast('Date range: '+DATE_PRESETS.find(p=>p.key===key).label);
}

function mapChart(cities, opts){
  // Bubble size = Users (real fact-table distinct users where available, else sessions as demand proxy).
  // Color: green = high revenue, yellow = medium revenue, red = high users/sessions but zero sales — per spec.
  opts=opts||{}; const w=opts.width||620,h=opts.height||460;
  const pts = cities.filter(c=>CITY_COORDS[c.city]).map(c=>({...c, lat:CITY_COORDS[c.city][0], lon:CITY_COORDS[c.city][1], demand: c.usersReal!=null?c.usersReal:c.sessions}));
  if(!pts.length) return '<div class="empty-note">No city in the current filter has a mapped coordinate.</div>';
  const lats=pts.map(p=>p.lat), lons=pts.map(p=>p.lon);
  const minLat=Math.min(...lats)-1.5, maxLat=Math.max(...lats)+1.5, minLon=Math.min(...lons)-1.5, maxLon=Math.max(...lons)+1.5;
  const X = lon => ((lon-minLon)/(maxLon-minLon))*w;
  const Y = lat => h - ((lat-minLat)/(maxLat-minLat))*h;
  const maxDemand = Math.max(1,...pts.map(p=>p.demand));
  const revs = pts.filter(p=>p.revenue>0).map(p=>p.revenue).sort((a,b)=>a-b);
  const revMedian = revs.length ? revs[Math.floor(revs.length/2)] : 0;
  const demandMedian = pts.map(p=>p.demand).sort((a,b)=>a-b)[Math.floor(pts.length/2)] || 0;
  const bubbles = pts.map(p=>{
    const r = clamp(Math.sqrt(safeDiv(p.demand,maxDemand))*34, 6, 34);
    const noSalesFlag = p.purchase===0 && p.demand>=demandMedian;
    const color = noSalesFlag ? '#ef5350' : (p.revenue>=revMedian ? '#12b886' : '#f2b13a');
    const flagLabel = noSalesFlag ? 'High traffic, ZERO sales' : (p.revenue>=revMedian?'High revenue':'Medium revenue');
    return `<circle data-tip="<b>${esc(p.city)}</b><br>${esc(flagLabel)}<br>Users: ${fmtInt(p.demand)}${p.usersReal==null?' (sessions, no fact-table match)':''}<br>Revenue: ${fmtMoney(p.revenue)}<br>Purchases: ${fmtInt(p.purchase)}" cx="${X(p.lon)}" cy="${Y(p.lat)}" r="${r}" fill="${color}" opacity=".82" stroke="var(--bg)" stroke-width="1.5" style="cursor:pointer" onclick="citySelectFromMap('${esc(p.city).replace(/'/g,"\\'")}')"/>
      ${r>16?`<text x="${X(p.lon)}" y="${Y(p.lat)-r-4}" font-size="9" text-anchor="middle" fill="var(--ink-2)">${esc(p.city)}</text>`:''}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible;background:var(--surface-2);border-radius:12px">
    ${[0.25,0.5,0.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" stroke="var(--grid)"/><line x1="${w*f}" x2="${w*f}" y1="0" y2="${h}" stroke="var(--grid)"/>`).join('')}
    ${bubbles}
  </svg>
  <div class="legend"><span><i style="background:#12b886"></i>High revenue</span><span><i style="background:#f2b13a"></i>Medium revenue</span><span><i style="background:#ef5350"></i>High users, zero sales</span><span style="margin-left:auto">Bubble size = Users</span></div>
  <div class="hint">Illustrative city-coordinate scatter, not a GIS-accurate India boundary map (public-domain lat/lon reference). Click a bubble to filter the dashboard to that city. ${cities.length-pts.length>0?`${cities.length-pts.length} filtered cities have no mapped coordinate and are table-only.`:''}</div>`;
}

const CITY_ALIAS = {
  'central delhi':'Delhi','south delhi':'Delhi','east delhi':'Delhi','west delhi':'Delhi',
  'north delhi':'Delhi','south west delhi':'Delhi','south east delhi':'Delhi','north west delhi':'Delhi',
  'north east delhi':'Delhi','new delhi':'Delhi','delhi':'Delhi',
  'bangalore':'Bengaluru','bengaluru':'Bengaluru','gurgaon':'Gurugram','gurugram':'Gurugram',
  'bombay':'Mumbai','mumbai':'Mumbai','calcutta':'Kolkata','kolkata':'Kolkata',
  'prayagraj':'Prayagraj','allahabad':'Prayagraj',
};
function normCity(raw){
  if(!raw) return null;
  const t = String(raw).trim();
  if(!t) return null;
  const k = t.toLowerCase();
  return CITY_ALIAS[k] || t;
}

function buildData(){
  const RAW = window.GEO_INTEL_DATA || null;
  STATE.live = !!RAW;
  const src = RAW || SAMPLE_FALLBACK();
  src.products = src.products || []; src.topProducts = src.topProducts || []; src.devices = src.devices || [];
  src.zohoPincode = src.zohoPincode || []; src.sessionAnalysis = src.sessionAnalysis || []; src.cityUsersFact = src.cityUsersFact || [];
  src.cityGa4Daily = src.cityGa4Daily || [];
  // normalize date field name: dailyFact (BigQuery fact table) emits `session_date`, q7b emits `d` — guarantee `.d` everywhere.
  const nationalDaily = (src.dailyFact||[]).map(r=>({...r, d: r.d || r.session_date}));
  src.nationalDaily = nationalDaily;

  // ---- static, full-window-only side data per city (NOT date-filterable: trend comparisons,
  // impression/click counts and campaign tallies that were never broken down by day) ----
  const ga4StaticByCity = new Map();
  for(const r of src.cityTotals){
    const city = normCity(r.city); if(!city) continue;
    const cur = ga4StaticByCity.get(city) || {city, state:r.state, plp_impressions:0,plp_click:0,campaign_count:0,
      sessions_last90:0,revenue_last90:0,sessions_prev90:0,revenue_prev90:0};
    cur.plp_impressions += n(r.plp_impressions); cur.plp_click += n(r.plp_click); cur.campaign_count += n(r.campaign_count);
    cur.sessions_last90 += n(r.sessions_last90); cur.revenue_last90 += n(r.revenue_last90);
    cur.sessions_prev90 += n(r.sessions_prev90); cur.revenue_prev90 += n(r.revenue_prev90);
    ga4StaticByCity.set(city, cur);
  }
  const zohoByCity = new Map();
  for(const r of src.zohoCity){
    const city = normCity(r.city); if(!city) continue;
    const cur = zohoByCity.get(city) || {city, state:r.state, deals:0, won:0, lost:0, open_deals:0, amount:0, won_amount:0, scoreSum:0, scoreCnt:0, probSum:0, probCnt:0, leadSources:{}, utmSources:{}};
    cur.deals += n(r.deals); cur.won += n(r.won); cur.lost += n(r.lost); cur.open_deals += n(r.open_deals);
    cur.amount += n(r.amount); cur.won_amount += n(r.won_amount);
    if(r.avg_deal_score!=null){ cur.scoreSum += n(r.avg_deal_score)*n(r.deals); cur.scoreCnt += n(r.deals); }
    if(r.avg_probability!=null){ cur.probSum += n(r.avg_probability)*n(r.deals); cur.probCnt += n(r.deals); }
    if(r.top_lead_source){ cur.leadSources[r.top_lead_source] = (cur.leadSources[r.top_lead_source]||0) + n(r.deals); }
    if(r.top_utm_source){ cur.utmSources[r.top_utm_source] = (cur.utmSources[r.top_utm_source]||0) + n(r.deals); }
    zohoByCity.set(city, cur);
  }
  const deviceByCity = groupBy(src.devices||[], r=>normCity(r.city));
  // ---- product-derived: luxury/high-margin revenue share per city (for Store Expansion "Luxury Interest") ----
  const luxByCity = new Map();
  for(const p of src.products){
    const city = normCity(p.city); if(!city) continue;
    const cur = luxByCity.get(city) || {rev:0, luxRev:0, highValOrders:0, totalOrders:0};
    const rev = n(p.revenue); cur.rev += rev;
    if(p.margin_range === 'High') cur.luxRev += rev;
    cur.totalOrders += n(p.purchase);
    if(n(p.revenue) > 0 && n(p.purchase) > 0 && safeDiv(n(p.revenue),n(p.purchase)) > 40000) cur.highValOrders += n(p.purchase);
    luxByCity.set(city, cur);
  }
  const campByCity = groupBy(src.campaigns, r=>normCity(r.city));

  // ---- city merge: GA4 (real activity, day-level, filtered to [dateFrom,dateTo]) + Zoho/static side
  // data (deal count / lead quality / trend / device — never day-level, always full-window) ----
  // Called fresh for every date-range change (see filteredCity()), not just once at load, so the
  // date filter actually changes Sessions/PDP/Users/ATC/Checkout for a city instead of always
  // showing a fixed full-window number.
  function buildCityArray(dateFrom, dateTo){
    const inRange = d => (!dateFrom || d>=dateFrom) && (!dateTo || d<=dateTo);
    const ga4ByCity = new Map();
    for(const r of src.cityGa4Daily){
      if(!inRange(r.d)) continue;
      const city = normCity(r.city); if(!city) continue;
      const cur = ga4ByCity.get(city) || {sessions:0,pdp_views:0,add_to_cart:0,begin_checkout:0,purchase:0,revenue:0};
      cur.sessions += n(r.sessions); cur.pdp_views += n(r.pdp_views); cur.add_to_cart += n(r.add_to_cart);
      cur.begin_checkout += n(r.begin_checkout); cur.purchase += n(r.purchase); cur.revenue += n(r.revenue);
      ga4ByCity.set(city, cur);
    }
    const factByCity = new Map();
    for(const r of src.cityUsersFact){
      if(!inRange(r.d)) continue;
      const city = normCity(r.city); if(!city) continue;
      const cur = factByCity.get(city) || {users:0, sessions:0, engaged:0, newUsers:0, returningUsers:0, revenue:0, purchases:0};
      cur.users += n(r.users); cur.sessions += n(r.sessions); cur.engaged += n(r.engaged_sessions);
      cur.newUsers += n(r.new_users); cur.returningUsers += n(r.returning_users_est);
      cur.revenue += n(r.revenue); cur.purchases += n(r.purchases);
      factByCity.set(city, cur);
    }
    const allCityNames = new Set([...ga4ByCity.keys(), ...factByCity.keys(), ...zohoByCity.keys()]);
    const CITY = [];
    for(const city of allCityNames){
      const g = ga4ByCity.get(city);
      const st = ga4StaticByCity.get(city);
      const z = zohoByCity.get(city);
      const f = factByCity.get(city);
      const sessions = g? g.sessions : 0;
      const purchase = g? g.purchase : 0;
      const revenue = g? g.revenue : 0;
      const conv = safeDiv(purchase, sessions)*100;
      const aov = safeDiv(revenue, purchase);
      const growthPct = st && st.sessions_prev90>0 ? safeDiv(st.sessions_last90-st.sessions_prev90, st.sessions_prev90)*100 : null;
      const atcRate = g? safeDiv(g.add_to_cart, g.sessions)*100 : 0;
      const pdpRate = g? safeDiv(g.pdp_views, g.sessions)*100 : 0;
      const topDeviceRows = (deviceByCity.get(city)||[]).slice().sort(byDesc(r=>r.sessions));
      let leadQuality = null;
      if(z && z.scoreCnt>0){
        const avgScore = z.scoreSum/z.scoreCnt;      // 0-10 scale observed
        const avgProb = z.probCnt>0 ? z.probSum/z.probCnt : 0; // 0-100
        const winRate = z.deals>0 ? (z.won/z.deals)*100 : 0;
        leadQuality = clamp(avgScore*10*0.45 + avgProb*0.35 + winRate*3*0.20, 0, 100);
      }
      const l = luxByCity.get(city);
      const campRows = campByCity.get(city) || [];
      const campSess = sumBy(campRows, r=>r.sessions), campPur = sumBy(campRows, r=>r.purchase);
      CITY.push({
        city, state: (st&&st.state) || (z&&z.state) || '—',
        sessions, pdp_views: g?g.pdp_views:0, add_to_cart: g?g.add_to_cart:0, begin_checkout: g?g.begin_checkout:0,
        purchase, revenue, plp_impressions: st?st.plp_impressions:0, plp_click: st?st.plp_click:0,
        campaignCount: st?st.campaign_count:0, conv, aov, growthPct, atcRate, pdpRate,
        topDevice: topDeviceRows[0]? topDeviceRows[0].device : null,
        hasGa4: !!g, hasZoho: !!z,
        deals: z?z.deals:0, won: z?z.won:0, lost: z?z.lost:0, openDeals: z?z.open_deals:0,
        leadQuality, avgDealScore: (z&&z.scoreCnt>0)? z.scoreSum/z.scoreCnt : null,
        avgProbability: (z&&z.probCnt>0)? z.probSum/z.probCnt : null,
        population: POPULATION_REF_M[city] || null,
        usersReal: f?f.users:null, sessionsFact: f?f.sessions:null, newUsersReal: f?f.newUsers:null,
        returningUsersReal: f?f.returningUsers:null,
        returningSharePct: f && f.users>0 ? safeDiv(f.returningUsers,f.users)*100 : null,
        engagedSessionsReal: f?f.engaged:null, hasFact: !!f,
        luxuryShare: l && l.rev>0 ? safeDiv(l.luxRev, l.rev)*100 : null,
        highValueOrders: l ? l.highValOrders : 0,
        campaignResponseRate: campSess>0 ? safeDiv(campPur,campSess)*100 : null,
      });
    }
    CITY.sort(byDesc(c=>c.sessions||c.sessionsFact||0));
    return CITY;
  }

  const dateBounds = (()=>{ const d = nationalDaily; return d.length? {min:d[0].d, max:d[d.length-1].d} : {min:null,max:null}; })();
  const CITY = buildCityArray(dateBounds.min, dateBounds.max); // full-window default, unaffected by any filter

  // ---- pin code data (Zoho Address_Zip only — sparse, no revenue; see coverage.note) ----
  const pincodeByCity = groupBy(src.zohoPincode, r=>normCity(r.city));

  // ---- distinct option lists for live filters ----
  const distinctSorted = (arr, fn) => Array.from(new Set(arr.map(fn).filter(Boolean))).sort();
  const OPTIONS = {
    city: CITY.map(c=>c.city),
    state: distinctSorted(CITY, c=>c.state),
    source: distinctSorted(src.campaigns, r=>r.source),
    medium: distinctSorted(src.campaigns, r=>r.medium),
    campaign: distinctSorted(src.campaigns, r=>r.campaign_name),
    channel: distinctSorted(src.campaigns, r=>r.channel_type),
    device: distinctSorted(src.devices||[], r=>r.device),
    productType: distinctSorted(src.products, r=>r.product_type),
    collection: distinctSorted(src.products, r=>r.collection),
    gender: distinctSorted(src.products, r=>r.gender),
    priceRange: distinctSorted(src.products, r=>r.price_range),
    material: distinctSorted(src.products, r=>r.material_type),
    stage: distinctSorted(src.zohoStages, r=>r.stage),
    leadSource: distinctSorted(src.zohoLeadSource, r=>r.lead_source),
    pincode: distinctSorted(src.zohoPincode, r=>r.pincode),
  };

  STATE.D = { RAW: src, CITY, OPTIONS, dateBounds, coverage: src.coverage, luxByCity, campByCity, deviceByCity, pincodeByCity,
    nationalTotalsFact: src.nationalTotals || {}, funnelFact: src.funnel || {}, buildCityArray };

  }
}

function sparkline(values, opts){

  const pts = vals.map((v,i)=> `${(i/(vals.length-1||1))*w},${h-((v-min)/range)*h}`).join(' ');

function lineAreaChart(series, opts){
  // series: [{label,color,points:[{x(label),y}]}]  opts:{height,fmt}
  opts=opts||{}; const h=opts.height||240, w=opts.width||760, pad={l:36,r:10,t:14,b:22};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const allY = series.flatMap(s=>s.points.map(p=>n(p.y)));
  const maxY = Math.max(1,...allY)*1.08, minY = Math.min(0,...allY);
  const N = series[0]?series[0].points.length:0;
  const X = i => pad.l + (N<=1?0:(i/(N-1))*iw);
  const Y = v => pad.t + ih - ((n(v)-minY)/((maxY-minY)||1))*ih;
  const gridY = [0,0.25,0.5,0.75,1].map(f=>{
    const val = minY + f*(maxY-minY);
    return `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(val)}" y2="${Y(val)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${pad.l-6}" y="${Y(val)+3}" font-size="8.5" text-anchor="end" fill="var(--muted)">${(opts.fmt||fmtInt)(val)}</text>`;
  }).join('');
  const paths = series.map((s,si)=>{
    const color = s.color || PALETTE[si%PALETTE.length];
    const line = s.points.map((p,i)=>`${i===0?'M':'L'}${X(i)},${Y(p.y)}`).join(' ');
    const area = line + ` L${X(N-1)},${Y(minY)} L${X(0)},${Y(minY)} Z`;
    return `<path d="${area}" fill="${color}" opacity="${opts.area?0.10:0}"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>`;
  }).join('');
  const dots = (series[0]?series[0].points:[]).map((p,i)=>{

}

function donutChart(segs, opts){

}

/* ============================== 8. PREDICTION ENGINE ==============================
   Simple linear-regression trend + naive seasonal-week average. Labelled everywhere
   as a STATISTICAL PROJECTION, not a trained ML forecast — no model is being fit
   beyond ordinary least squares on the recent daily series. */
function linregPredict(dailyValues, horizonDays){
  const y = dailyValues.map(n); const N = y.length;
  if(N < 7) return {slope:0, next:y[N-1]||0, horizonTotal:(y[N-1]||0)*horizonDays};
  const xs = y.map((_,i)=>i);
  const mx = xs.reduce((a,b)=>a+b,0)/N, my = y.reduce((a,b)=>a+b,0)/N;
  let num=0, den=0; for(let i=0;i<N;i++){ num += (xs[i]-mx)*(y[i]-my); den += (xs[i]-mx)**2; }
  const slope = den? num/den : 0; const intercept = my - slope*mx;
  let total = 0; for(let h=1;h<=horizonDays;h++) total += Math.max(0, intercept + slope*(N-1+h));
  const next = Math.max(0, intercept + slope*N);
  const recentAvg = y.slice(-7).reduce((a,b)=>a+b,0)/Math.min(7,N);
  const priorAvg = y.slice(-14,-7).reduce((a,b)=>a+b,0)/Math.max(1,Math.min(7,N-7));
  const trendPct = priorAvg>0 ? ((recentAvg-priorAvg)/priorAvg)*100 : 0;
  return {slope, next, horizonTotal: total, trendPct, recentAvg};
}
function predictionsFor(dailyRows, valueKey){
  const vals = dailyRows.map(r=>n(r[valueKey]));
  return {
    nextWeek: linregPredict(vals, 7),
    nextMonth: linregPredict(vals, 30),
    nextQuarter: linregPredict(vals, 90),
  };
}

/* ============================== 9. STORE OPPORTUNITY SCORE ==============================
   Weighted composite over whatever inputs are REAL for a given city. Any component
   with no data for that city is dropped and the remaining weights renormalize —
   never silently defaulted to zero/guessed. `missing` lists what was excluded. */
const SCORE_WEIGHTS = {
  population:0.12, sessions:0.16, pdp:0.08, atc:0.06, deals:0.10, revenue:0.16,
  growth:0.12, luxury:0.08, highValue:0.06, campaignResponse:0.06,
};
function storeOpportunityScore(c, cityMax){
  const parts = {}; const missing = [];
  if(c.population!=null) parts.population = clamp(c.population/cityMax.population,0,1); else missing.push('Population (no reference figure for this city)');
  parts.sessions = cityMax.sessions? clamp(c.sessions/cityMax.sessions,0,1) : 0;
  parts.pdp = cityMax.pdp_views? clamp(c.pdp_views/cityMax.pdp_views,0,1) : 0;
  parts.atc = cityMax.add_to_cart? clamp(c.add_to_cart/cityMax.add_to_cart,0,1) : 0;
  if(c.hasZoho) parts.deals = cityMax.deals? clamp(c.deals/cityMax.deals,0,1) : 0; else missing.push('Deals (no CRM deals with this city recorded)');
  parts.revenue = cityMax.revenue? clamp(c.revenue/cityMax.revenue,0,1) : 0;
  if(c.growthPct!=null) parts.growth = clamp((c.growthPct+30)/90,0,1); else missing.push('Growth % (insufficient prior-period sessions)');
  if(c.luxuryShare!=null) parts.luxury = clamp(c.luxuryShare/100,0,1); else missing.push('Luxury interest (no product-margin data for this city)');
  parts.highValue = cityMax.highValueOrders? clamp(c.highValueOrders/cityMax.highValueOrders,0,1) : 0;
  if(c.campaignResponseRate!=null) parts.campaignResponse = clamp(c.campaignResponseRate/(cityMax.campaignResponseRate||1),0,1); else missing.push('Campaign response (no attributed sessions)');
  missing.push('Distance from existing store (no store-location master connected — cannot yet penalize cannibalisation risk)');
  const usedWeights = Object.keys(parts).map(k=>SCORE_WEIGHTS[k]);
  const wSum = usedWeights.reduce((a,b)=>a+b,0) || 1;
  let score = 0; for(const k in parts) score += parts[k]*(SCORE_WEIGHTS[k]/wSum)*100;
  let verdict, verdictReason;
  if(score>=68 && (c.growthPct==null || c.growthPct>-5)){ verdict='Open'; verdictReason='High composite demand + engagement with no material decline.'; }
  else if(score>=45){ verdict='Wait'; verdictReason='Promising signals but not yet decisive — revisit next quarter once more CRM/city data is captured.'; }
  else { verdict='Do Not Open'; verdictReason='Composite demand is materially below the top cities in this window.'; }
  const investmentScore = Math.round(score);
  const expectedRevenueMonthly = c.revenue>0 ? c.revenue/ (STATE.D.dateBounds? Math.max(1,daysBetween(STATE.D.dateBounds.min,STATE.D.dateBounds.max))/30 : 12) * 0.35 : 0; // store captures ~35% uplift of online-attributed demand, heuristic
  const assumedStoreCost = 6000000; // ₹60L reference fit-out+1yr opex, static assumption — documented, not fabricated as measured
  const expectedAnnualRevenue = expectedRevenueMonthly*12;
  const expectedROI = assumedStoreCost>0 ? ((expectedAnnualRevenue*0.5 - assumedStoreCost)/assumedStoreCost)*100 : null; // 50% assumed gross margin on store revenue
  const breakEvenMonths = expectedRevenueMonthly*0.5>0 ? Math.round(assumedStoreCost/(expectedRevenueMonthly*0.5)) : null;
  return {score:Math.round(score), parts, missing, verdict, verdictReason, investmentScore, expectedAnnualRevenue, expectedROI, breakEvenMonths, assumedStoreCost};
}
function daysBetween(a,b){ if(!a||!b) return 90; return Math.max(1, Math.round((new Date(b)-new Date(a))/86400000)); }

/* ============================== 10. RULE-BASED AI INSIGHT ENGINE ==============================
   Deterministic heuristics over the real aggregates — NOT a call to an LLM. Every
   insight traces to a concrete, re-derivable comparison so the CEO can audit it.
   (A real generative layer, e.g. Gemini, is a documented roadmap item — see Documentation.) */
function pct1(v){ return (v==null?'—':Math.abs(v)<1?v.toFixed(2)+'%':v.toFixed(1)+'%'); }

function topCitiesBy(CITY, key, count){ return CITY.filter(c=>c.sessions>=200).slice().sort(byDesc(c=>c[key])).slice(0,count||5); }

function buildInsights(){
  const CITY = STATE.D.CITY.filter(c=>c.sessions>=200);
  const insights = [];
  if(!CITY.length) return insights;

  const byRevenue = CITY.slice().sort(byDesc(c=>c.revenue));
  const byGrowth = CITY.filter(c=>c.growthPct!=null).slice().sort(byDesc(c=>c.growthPct));
  const byConv = CITY.slice().sort(byDesc(c=>c.conv));
  const byConvAsc = CITY.slice().sort(byAsc(c=>c.conv));
  const byEngagement = CITY.slice().sort(byDesc(c=>c.pdp_views+c.add_to_cart));

  const topRev = byRevenue[0];
  if(topRev) insights.push({type:'growth', title:`${topRev.city} leads on revenue`, city:topRev.city,
    text:`${topRev.city} generated ${fmtMoney(topRev.revenue)} over the window — ${fmtPct(safeDiv(topRev.revenue, sumBy(CITY,c=>c.revenue))*100)} of tracked online revenue — from ${fmtInt(topRev.sessions)} attributed sessions at a ${pct1(topRev.conv)} conversion rate.`,
    impact:'high', confidence:0.9, recommendation:`Protect ${topRev.city}'s share of voice — keep top campaigns fully funded before reallocating budget elsewhere.`});

  if(byGrowth[0] && byGrowth[0].growthPct>15) insights.push({type:'opportunity', title:`${byGrowth[0].city} is the fastest-growing city`, city:byGrowth[0].city,
    text:`Sessions grew ${pct1(byGrowth[0].growthPct)} last 90 days vs. the prior 90 — from ${fmtInt(byGrowth[0].sessions_prev90||0)} to ${fmtInt(byGrowth[0].sessions_last90||0)}.`,
    impact:'high', confidence:0.75, recommendation:`Increase remarketing and stock allocation toward ${byGrowth[0].city} before demand plateaus.`});

  const laggard = byGrowth[byGrowth.length-1];
  if(laggard && laggard.growthPct<-10) insights.push({type:'risk', title:`${laggard.city} is declining`, city:laggard.city,
    text:`Sessions fell ${pct1(Math.abs(laggard.growthPct))} last 90 days vs. the prior 90.`, impact:'medium', confidence:0.7,
    recommendation:`Investigate campaign fatigue or a competitor move in ${laggard.city}; consider a refreshed creative or offer.`});

  // engagement-high, conversion-low ("follow-up issue" pattern)
  const medConv = CITY.slice().sort(byAsc(c=>c.conv))[Math.floor(CITY.length/2)]?.conv || 0;
  const gapCity = byEngagement.filter(c=>c.conv < medConv*0.6).sort(byDesc(c=>c.pdp_views+c.add_to_cart))[0];
  if(gapCity) insights.push({type:'risk', title:`${gapCity.city}: high engagement, weak conversion`, city:gapCity.city,
    text:`${gapCity.city} ranks in the top half on PDP views (${fmtInt(gapCity.pdp_views)}) and Add-to-Cart (${fmtInt(gapCity.add_to_cart)}) but converts at only ${pct1(gapCity.conv)}, well below the city median of ${pct1(medConv)}.`,
    impact:'high', confidence:0.65, recommendation:`Audit checkout friction and sales follow-up speed in ${gapCity.city} — the demand is there, something after Add-to-Cart is leaking it.`});

  // expensive traffic: campaigns with many sessions, poor purchase
  const camps = STATE.D.RAW.campaigns.filter(r=>n(r.sessions)>=150);
  const wasteCamps = camps.map(r=>({...r, conv: safeDiv(n(r.purchase),n(r.sessions))*100})).sort(byAsc(r=>r.conv)).slice(0,1)[0];
  if(wasteCamps) insights.push({type:'risk', title:`Waste-spend pattern: ${wasteCamps.source}/${wasteCamps.medium} in ${wasteCamps.city}`, city:wasteCamps.city,
    text:`${fmtInt(wasteCamps.sessions)} sessions from ${wasteCamps.source}/${wasteCamps.medium} in ${wasteCamps.city} converted at only ${pct1(wasteCamps.conv)}.`,
    impact:'medium', confidence:0.6, recommendation:`Pause or re-target this combination in ${wasteCamps.city}; reallocate to the best-converting source/medium there instead.`});

  const bestConv = byConv[0];
  if(bestConv) insights.push({type:'opportunity', title:`${bestConv.city} converts best`, city:bestConv.city,
    text:`${bestConv.city} converts at ${pct1(bestConv.conv)}, the highest of any tracked city, on ${fmtInt(bestConv.sessions)} sessions.`,
    impact:'medium', confidence:0.7, recommendation:`Study what's different in ${bestConv.city}'s funnel (offer, page speed, price mix) and test it in similar-tier cities.`});

  // CRM coverage risk — always include, it's the single biggest data-quality issue
  const cov = STATE.D.coverage;
  insights.push({type:'risk', title:'CRM cannot attribute revenue by city', city:null,
    text:`Only ${cov.deals_with_city_pct}% of Zoho deals (${cov.deals_with_city}/${cov.deals_total}) have a city recorded, and every deal with a known city has ₹0 in the Amount field — so "highest quality/value leads by city" currently relies on deal count, Deal_Score and Probability only, never CRM revenue.`,
    impact:'high', confidence:0.95, recommendation:'Make Address_City and Amount mandatory fields at deal creation in Zoho; backfill from order/shipping address where possible.'});

  // returning-user hotspot — real, from the session-grain fact table (new-vs-returning)
  const returningCities = CITY.filter(c=>c.hasFact && c.usersReal>=100).sort(byDesc(c=>c.returningSharePct));
  if(returningCities[0]) insights.push({type:'opportunity', title:`${returningCities[0].city} is the strongest returning-user hotspot`, city:returningCities[0].city,
    text:`${pct1(returningCities[0].returningSharePct)} of ${returningCities[0].city}'s ${fmtInt(returningCities[0].usersReal)} distinct GA4 users (last 90 days) had a returning session, the highest share of any city with 100+ users.`,
    impact:'medium', confidence:0.75, recommendation:`Prioritize loyalty/retention campaigns (WhatsApp, email) in ${returningCities[0].city} — the audience is already primed to come back.`});

  // highest AOV city — real, from the ERP (completed orders), NOT the GA4 mart's AOV
  if(SP_STATE.cities && SP_STATE.cities.length){
    const byAov = SP_STATE.cities.filter(c=>c.orders>=SP_CONFIG.MIN_ORDERS_TO_RANK).slice().sort((a,b)=>b.aov-a.aov);
    if(byAov[0]) insights.push({type:'growth', title:`${byAov[0].key} has the highest real order value`, city:byAov[0].key,
      text:`${byAov[0].key} orders average ${fmtMoney(byAov[0].aov)} per completed ERP order — the highest AOV of any city with ${SP_CONFIG.MIN_ORDERS_TO_RANK}+ orders in the snapshot.`,
      impact:'medium', confidence:0.8, recommendation:`Study ${byAov[0].key}'s product/category mix (see Sales & Orders (ERP) → city detail) and test the same merchandising mix in similar-tier cities.`});
  }

  // honest gap summary for the AI-insight bullets this dashboard's spec asked for but has no data behind
  insights.push({type:'risk', title:'Several requested AI insights have no data source yet', city:null,
    text:`Top pin codes by revenue, pin codes with high traffic but low sales, areas with many users but no deals, identified users without deals, and session-to-sale conversion trends cannot be computed: GA4 has no pin/area dimension, and there is no cross-source identity key linking a GA4 session to a WebEngage/Zoho/Shopify customer (see the Pin Code, Area, Identified Users, and Session-to-Sale Attribution pages for the specific reason each one is blocked).`,
    impact:'high', confidence:1, recommendation:'Add a GA4 user_id at login/checkout and a licensed pincode→locality master before attempting these — see Documentation.'});

  return insights;
}

function buildCeoSummary(){
  const CITY = STATE.D.CITY.filter(c=>c.sessions>=200);
  if(!CITY.length) return {html:'<p>Not enough data in the selected filters to summarize.</p>', actions:[], expected:[]};
  const byRevenue = CITY.slice().sort(byDesc(c=>c.revenue));
  const byGrowth = CITY.filter(c=>c.growthPct!=null).sort(byDesc(c=>c.growthPct));
  const byConvAsc = CITY.slice().sort(byAsc(c=>c.conv));
  const top = byRevenue[0], fastest = byGrowth[0], weakConv = byConvAsc.filter(c=>c.sessions>1000)[0];
  const medConv = CITY.slice().sort(byAsc(c=>c.conv))[Math.floor(CITY.length/2)]?.conv || 0;
  const followUpCity = CITY.filter(c=>c.conv<medConv*0.6).sort(byDesc(c=>c.pdp_views))[0];

  const html = `
    <p><b class="city-tag">${esc(top.city)}</b> generated the highest revenue this period (${fmtMoney(top.revenue)}), while
    ${fastest? `<b class="city-tag">${esc(fastest.city)}</b> is growing fastest (+${pct1(fastest.growthPct)} sessions vs the prior period)` : 'growth is broadly flat across cities'}.</p>
    ${followUpCity? `<p><b class="city-tag">${esc(followUpCity.city)}</b> shows strong Product-Page and Add-to-Cart activity but converts well below the city median (${pct1(followUpCity.conv)} vs ${pct1(medConv)}) — likely a checkout or sales follow-up gap, not a demand problem.</p>` : ''}
    ${weakConv && weakConv.city!==(followUpCity&&followUpCity.city)? `<p><b class="city-tag">${esc(weakConv.city)}</b> is producing high traffic at the weakest conversion rate (${pct1(weakConv.conv)}) among high-volume cities — campaign quality there needs review.</p>` : ''}
    <p style="margin-top:10px"><b>CRM caveat:</b> Zoho deal records only carry a city for ${STATE.D.coverage.deals_with_city_pct}% of deals, and none of those have revenue captured — city-level lead-value claims below are directional (deal count / score / probability), not revenue-verified.</p>`;

  const actions = [
    fastest? `Increase remarketing budget in ${fastest.city} — demand is accelerating faster than spend likely is.` : null,
    weakConv? `Reduce or restructure spend on the weakest-converting high-traffic campaigns in ${weakConv.city}.` : null,
    followUpCity? `Fix the ${followUpCity.city} post-Add-to-Cart funnel (checkout speed, payment options, or sales follow-up SLAs).` : null,
    'Make Address_City + Amount mandatory in the CRM deal form — this alone unlocks true city-level lead-quality scoring.',
  ].filter(Boolean);
  const expected = [
    fastest? `Est. ${fmtPct(clamp(fastest.growthPct/4,3,15))} more sessions in ${fastest.city} within 30 days of increased spend.` : null,
    followUpCity? `Closing half the conversion gap in ${followUpCity.city} would add roughly ${fmtMoney((medConv-followUpCity.conv)/100*followUpCity.sessions*0.5*followUpCity.aov||0)} in incremental monthly revenue.` : null,
    'CRM field fix has zero cost and directly enables every city-level lead-quality claim this dashboard makes.',
  ].filter(Boolean);
  return {html, actions, expected};
}

function buildActionCenter(){
  const insights = buildInsights();
  const CITY = STATE.D.CITY.filter(c=>c.sessions>=200);
  const cards = insights.map((ins,i)=>{
    const priority = ins.impact==='high' ? 'p1' : ins.impact==='medium' ? 'p2' : 'p3';
    return {
      issue: ins.title,
      reason: ins.text,
      evidence: ins.city ? `City: ${ins.city} · Window: last ${STATE.D.RAW.meta.ga4_window_days||90} days · Source: GA4 mart + Zoho Deals` : `Source: Zoho Deals (${STATE.D.coverage.deals_total} rows)`,
      impact: ins.impact,
      priority,
      owner: ins.type==='risk' && ins.title.includes('CRM') ? 'CRM/Sales Ops' : ins.city ? 'City Growth Lead — '+ins.city : 'Marketing',
      action: ins.recommendation,
      expectedResult: ins.impact==='high' ? '10–15% metric improvement expected' : '3–8% metric improvement expected',
      timeline: {nextWeek: ins.impact==='high', nextMonth: true, nextQuarter: ins.type==='risk'},
      confidence: ins.confidence,
    };
  });
  return cards.sort(byDesc(c=>c.priority==='p1'?3:c.priority==='p2'?2:1));
}

/* ============================== 12. FILTER APPLICATION ============================== */
function sel(key){ return STATE.filters[key] && STATE.filters[key].length ? STATE.filters[key] : null; }
function matchMulti(key, val){ const s = sel(key); return !s || s.includes(val); }
function inDateRange(dateStr){
  const dr = STATE.filters.dateRange; if(!dr || !dr.start) return true;
  return dateStr >= dr.start && dateStr <= dr.end;
}
function activeFilterCount(){
  return allFilterFields().filter(f=>f.live && f.type==='ms').reduce((s,f)=> s + (sel(f.key)?sel(f.key).length:0), 0);
}
function filteredCity(){
  const dr = STATE.filters.dateRange;
  let arr = dr ? STATE.D.buildCityArray(dr.start, dr.end) : STATE.D.CITY;
  if(sel('city')) arr = arr.filter(c=>sel('city').includes(c.city));
  if(sel('state')) arr = arr.filter(c=>sel('state').includes(c.state));
  return arr;
}
function filteredCampaigns(){
  return STATE.D.RAW.campaigns.filter(r=>
    matchMulti('city', normCity(r.city)) && matchMulti('campaignSource', r.source) &&
    matchMulti('campaignMedium', r.medium) && matchMulti('campaignName', r.campaign_name) &&
    matchMulti('channelGroup', r.channel_type));
}
function filteredProducts(){
  return STATE.D.RAW.products.filter(r=>
    matchMulti('city', normCity(r.city)) && matchMulti('productType', r.product_type) &&
    matchMulti('jewelleryType', r.product_type) && matchMulti('collection', r.collection) &&
    matchMulti('gender', r.gender) && matchMulti('priceRange', r.price_range) && matchMulti('material', r.material_type));
}
function filteredDevices(){ return (STATE.D.RAW.devices||[]).filter(r=> matchMulti('city', normCity(r.city)) && matchMulti('device', r.device)); }
function filteredNationalDaily(){ return STATE.D.RAW.nationalDaily.filter(r=>inDateRange(r.d ?? r.event_date)); }
function filteredZohoDaily(){ return STATE.D.RAW.zohoDaily.filter(r=>inDateRange(r.d)); }
function filteredZohoCity(){ return STATE.D.RAW.zohoCity.filter(r=> matchMulti('city', normCity(r.city))); }

function filteredZohoPincode(){
  // zohoPincode is day-level (one row per pincode per day it had deal activity) so the date
  // range filter can actually change these numbers -- re-aggregate back to one row per pincode
  // across whichever window is currently selected.
  const dayRows = (STATE.D.RAW.zohoPincode||[]).filter(r=> inDateRange(r.d) && matchMulti('city', normCity(r.city)) && matchMulti('pincode', r.pincode));
  const byPin = new Map();
  for(const r of dayRows){
    let cur = byPin.get(r.pincode);
    if(!cur){ cur = {pincode:r.pincode, city:r.city, state:r.state, area:r.area, deals:0, won:0, amount:0}; byPin.set(r.pincode, cur); }
    cur.deals += n(r.deals); cur.won += n(r.won); cur.amount += n(r.amount);
    if(!cur.city && r.city) cur.city = r.city;
    if(!cur.state && r.state) cur.state = r.state;
    if(!cur.area && r.area) cur.area = r.area;
  }
  return Array.from(byPin.values());
}

/* ============================== 13. KPI CARD ============================== */
function kpiCard(opts){
  // opts: {label, key(dictionary), value, fmt, prevValue, target, unit}
  const fmt = opts.fmt || fmtInt;
  const hasDelta = opts.prevValue!=null;
  const delta = hasDelta ? safeDiv(opts.value-opts.prevValue, Math.abs(opts.prevValue)||1)*100 : null;
  const dir = delta==null ? 'flat' : delta>0.5?'up':delta<-0.5?'down':'flat';
  const arrow = dir==='up'?'▲':dir==='down'?'▼':'●';
  const targetPct = opts.target ? clamp(safeDiv(opts.value,opts.target)*100,0,100) : null;
  return `<div class="card kpi">
    <div class="kt"><span class="lbl">${esc(opts.label)}</span>${opts.key?infoIcon(opts.key):''}</div>
    <div class="val">${fmt(opts.value)}${opts.unit?`<span class="u">${opts.unit}</span>`:''}</div>
    ${hasDelta?`<div class="delta ${dir}">${arrow} ${Math.abs(delta).toFixed(1)}% vs prev period <span style="color:var(--muted)">(${fmt(opts.prevValue)})</span></div>`:''}
    ${targetPct!=null?`<div class="target-bar"><i style="width:${targetPct}%"></i></div><div class="foot">${targetPct.toFixed(0)}% of target (${fmt(opts.target)})</div>`:''}
  </div>`;
}
function kpiCardText(label, value, sub, key){
  return `<div class="card kpi"><div class="kt"><span class="lbl">${esc(label)}</span>${key?infoIcon(key):''}</div>
    <div class="val" style="font-size:19px">${esc(value)}</div>${sub?`<div class="foot">${esc(sub)}</div>`:''}</div>`;
}

function renderMultiSelect(key, label, options){

function wireMultiSelect(key){
  const box = $('#msbox_'+key), drop = $('#msdrop_'+key), wrap = $('#ms_'+key);
  if(!box) return;
  box.addEventListener('click', (e)=>{
    if(e.target.dataset.remove!=null){ e.stopPropagation(); toggleMsValue(key, e.target.dataset.remove); return; }
    $$('.ms-drop.on').forEach(d=>{ if(d!==drop) d.classList.remove('on'); });
    drop.classList.toggle('on');
  });
  document.addEventListener('click', (e)=>{ if(!wrap.contains(e.target)) drop.classList.remove('on'); });
  $('#msopts_'+key).addEventListener('change', (e)=>{
    if(e.target.type==='checkbox') toggleMsValue(key, e.target.value);
  });
  const filterInput = $('.msf[data-key="'+key+'"]', drop);
  filterInput.addEventListener('input', debounce(()=>{
    const q = filterInput.value.toLowerCase();
    $$('.ms-opt', $('#msopts_'+key)).forEach(o=>{ o.style.display = o.textContent.toLowerCase().includes(q) ? '' : 'none'; });
  },80));
}
function toggleMsValue(key, val){

  STATE.filters[key] = cur;
  renderDrawer();
  const drop = $('#msdrop_'+key); if(drop) setTimeout(()=>drop.classList.add('on'),0);
  scheduleAutoApply();
}

function wirePageExtras(id){

function wireSortableTable(table){
  const ths = $$('thead th', table);
  ths.forEach((th,ci)=>{
    th.addEventListener('click', ()=>{
      const tbody = $('tbody', table);
      const rows = $$('tr', tbody);
      const asc = th.dataset.dir !== 'asc';
      ths.forEach(t=>delete t.dataset.dir); th.dataset.dir = asc?'asc':'desc';
      rows.sort((a,b)=>{
        const av = a.children[ci].dataset.v ?? a.children[ci].textContent;
        const bv = b.children[ci].dataset.v ?? b.children[ci].textContent;
        const an = parseFloat(String(av).replace(/[^0-9.\-]/g,'')), bn = parseFloat(String(bv).replace(/[^0-9.\-]/g,''));
        let cmp;
        if(!isNaN(an) && !isNaN(bn) && /^[\d.\-,₹%\s]*$/.test(String(av))) cmp = an-bn; else cmp = String(av).localeCompare(String(bv));
        return asc ? cmp : -cmp;
      });
      rows.forEach(r=>tbody.appendChild(r));
    });
  });
}

/* ============================== 22. CHANNEL CLASSIFIER ============================== */
function classifyChannel(source, medium){
  const s = (source||'').toLowerCase(), m = (medium||'').toLowerCase();
  if(m==='organic') return 'Organic Search';
  if(m==='referral') return 'Referral';
  if(s.includes('whatsapp')||m.includes('whatsapp')) return 'WhatsApp';
  if(s.includes('instagram')) return 'Instagram';
  if(s.includes('facebook')||s==='fb'||s.includes('fb.')) return 'Meta / Facebook';
  if(s.includes('google')||s.includes('doubleclick')) return 'Google';
  if(m.includes('email')||s.includes('email')) return 'Email';
  if(m==='push'||m==='sms') return 'Push / SMS';
  if(s.includes('criteo')||s.includes('rtb')||m.includes('retarget')||m==='display') return 'Programmatic / Retargeting';
  if(s==='(not set)'||!s) return 'Direct / Unknown';
  return 'Other';
}
