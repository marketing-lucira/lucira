/* Maps this file's normCity() spelling to SP_STATE (ERP)'s own SP_canonicalCity spelling —
   the two dashboards-merged-into-one use different alias schemes (Bengaluru vs Bangalore,
   Gurugram vs Gurgaon), so a pin code's modelled Orders can find the right ERP city row. */
const ERP_CITY_LOOKUP = { 'bengaluru':'bangalore', 'gurugram':'gurgaon' };
function erpCityRowFor(cityNorm){
  if(!cityNorm) return null;
  const key = cityNorm.toLowerCase();
  const target = ERP_CITY_LOOKUP[key] || key;
  return (SP_STATE.cities||[]).find(c=>c.key.toLowerCase()===target) || null;
}

/* Competitor layer — CaratLane real store presence, matched by EXACT pin code string
   (GEO_INTEL_DATA.caratlaneStores, sourced from etl/caratlane_stores.json — 206 of an
   estimated 230+ CaratLane stores nationwide, collected from CaratLane's own public
   store-catalog pages, not a licensed dataset).
   "Catalog items" = CaratLane's own ONLINE CATALOG LISTING count for that store — a public
   proxy for local assortment depth, NOT audited stock (no retailer publishes real per-store
   inventory, ours included). A pin code showing no CaratLane store here means none was FOUND
   in our 112-store capture — not a confirmed absence; CaratLane may have a store we didn't
   capture, or one sitting in a neighbouring pin code of the same locality. */
const CARATLANE_CAT_KEYS = ['Rings','Earrings','Necklaces','Pendants','Bracelets','Bangles','Nose pin'];
const CARATLANE_PB_BANDS = [
  {key:'u5k',label:'<₹5k',full:'Under ₹5,000'},
  {key:'b5_10',label:'₹5-10k',full:'₹5,001–₹10,000'},
  {key:'b10_15',label:'₹10-15k',full:'₹10,001–₹15,000'},
  {key:'b15_20',label:'₹15-20k',full:'₹15,001–₹20,000'},
  {key:'b20_30',label:'₹20-30k',full:'₹20,001–₹30,000'},
  {key:'b30_40',label:'₹30-40k',full:'₹30,001–₹40,000'}
];
const CARATLANE_BY_PINCODE = (() => {
  const m = new Map();
  ((window.GEO_INTEL_DATA && window.GEO_INTEL_DATA.caratlaneStores) || []).forEach(s=>{
    if(!s.pincode) return;
    let total = 0; CARATLANE_CAT_KEYS.forEach(k=>{ if(s.cat && s.cat[k]) total += s.cat[k]; });
    const key = String(s.pincode).trim();
    if(!m.has(key)) m.set(key, []);
    m.get(key).push({...s, total});
  });
  return m;
})();
function caratlaneAt(pincode){ return pincode ? (CARATLANE_BY_PINCODE.get(String(pincode).trim())||[]) : []; }

/* ---- CaratLane STORE MASTER (2026-08-10) — separate, richer dataset (name/address/city/
   state/status/phone/rating), one row per pincode already deduped at build time (see
   etl/caratlane_store_master.json + build_geo_intel.ps1). Powers the Pin Code Intelligence
   full-outer-join below. Pincode normalized (digits-only, zero-padded to 6) on BOTH sides so
   whitespace/formatting differences between the Zoho export and this master can't silently
   drop a real match — kept as its OWN normalizer rather than changed inside caratlaneAt()
   above, so the existing (already-verified) catalog-listing matching is untouched. */
function normPincode(v){ if(v==null) return null; const s=String(v).replace(/\D/g,''); if(!s) return null; return s.length<6 ? s.padStart(6,'0') : s; }
const CARATLANE_MASTER_BY_PINCODE = (() => {
  const m = new Map();
  ((window.GEO_INTEL_DATA && window.GEO_INTEL_DATA.caratlaneStoreMaster) || []).forEach(r=>{
    const key = normPincode(r.pincode); if(!key) return;
    m.set(key, r);
  });
  return m;
})();
function caratlaneMasterAt(pincode){ const key = normPincode(pincode); return key ? (CARATLANE_MASTER_BY_PINCODE.get(key)||null) : null; }

/* ---- WebEngage by pin code (2026-08-11) — REAL, but only reachable indirectly: WebEngage's
   own export has no location field at all (checked against its full schema), so this comes
   from etl/geo_intel_sql/q8_webengage_pincode.sql, which matches WebEngage's cuid (actually
   the contact's +91 mobile number, same fact walkin-source-api already relies on) against
   Zoho Deals' Mobile field and uses THAT deal's real Address_Zip. Real counts, not modelled —
   but small, honest coverage: only ~340 of ~180K WebEngage mobiles land on a Zoho deal with a
   pin code, reaching ~133 pin codes total. */
const WEBENGAGE_BY_PINCODE = (() => {
  const m = new Map();
  ((window.GEO_INTEL_DATA && window.GEO_INTEL_DATA.webengagePincode) || []).forEach(r=>{
    const key = normPincode(r.pincode); if(!key) return;
    m.set(key, r);
  });
  return m;
})();
function webengageAt(pincode){ const key = normPincode(pincode); return key ? (WEBENGAGE_BY_PINCODE.get(key)||null) : null; }

/* ---- Tanishq by pin code (2026-08-11) — same shape/methodology as CaratLane: official
   Tanishq store-locator export (Tanishq_Master_Sheet.xlsx, 541 stores / 509 pincodes),
   grouped per pincode. The sheet's SKU_Product_Inventory_Data column is 100% "Not Available"
   (source WAF-blocked at collection) — intentionally NOT surfaced anywhere here, per
   instruction ("inventory is not showing so ignore Inventory"). Real store presence/rating/
   status/type only. */
const TANISHQ_BY_PINCODE = (() => {
  const m = new Map();
  ((window.GEO_INTEL_DATA && window.GEO_INTEL_DATA.tanishqStoreMaster) || []).forEach(r=>{
    const key = normPincode(r.pincode); if(!key) return;
    m.set(key, r);
  });
  return m;
})();
function tanishqAt(pincode){ const key = normPincode(pincode); return key ? (TANISHQ_BY_PINCODE.get(key)||null) : null; }

/* ---- MERGED CaratLane view (2026-08-10, user: "merge both table … overall caratlane
   pincode wise data") — combines the two separate captures (old catalog-listing dataset +
   new GBP store-master) into ONE result per pincode instead of two parallel column groups.
   Store presence/name is the UNION of both sources (a pincode counts as "present" if EITHER
   has it); catalog counts (cat/pb/total) only exist in the old dataset; status/rating only
   exist in the new master — each field is simply absent (not guessed) where its source
   doesn't cover that pincode. */
function mergeCaratlane(pincode){
  const oldStores = caratlaneAt(pincode);
  const master = caratlaneMasterAt(pincode);
  const names = new Set();
  oldStores.forEach(s=>{ if(s.store) names.add(s.store); });
  if(master) master.stores.forEach(s=>{ if(s.name) names.add(s.name); });
  const cat = {}; CARATLANE_CAT_KEYS.forEach(k=>{ cat[k] = oldStores.reduce((a,s)=>a+((s.cat&&s.cat[k])||0),0); });
  const pb = {}; CARATLANE_PB_BANDS.forEach(b=>{ pb[b.key] = oldStores.reduce((a,s)=>a+((s.pb&&s.pb[b.key])||0),0); });
  const statuses = master ? Array.from(new Set(master.stores.map(s=>s.status).filter(Boolean))) : [];
  const ratings = master ? master.stores.map(s=>s.rating).filter(v=>v!=null) : [];
  return {
    available: names.size>0,
    storeNames: Array.from(names), storeCount: names.size,
    status: statuses.length ? statuses.join(', ') : null,
    rating: ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : null,
    catalogTotal: oldStores.reduce((a,s)=>a+s.total,0), cat, pb,
    city: (master && master.city) || (oldStores[0] && oldStores[0].city) || null,
  };
}

/* AI Store-Opening Insight — turns fields that already exist on an `enriched` pincode row
   (real Zoho deals/won, GA4-modelled sessions/pdp/users/atc/chk, ERP-modelled orders, merged
   CaratLane presence, and the city's real GA4 session growthPct) into a plain-English retail
   analyst write-up. No new metric, score or formula is computed here beyond simple ratios for
   narrative color (e.g. checkout÷ATC) — the FINAL recommendation is a transparent, ordered
   if-chain over already-existing fields, not a hidden weighted score. Anything with no
   connected source (nearby Lucira store distance — no store-location master exists anywhere
   in this project) is stated as "Data unavailable", never estimated. */
function aiStoreOpeningInsight(c){
  const cityObj = c.cityObj, cl = c.caratlane, tq = c.tanishq;
  const cityState = esc(c.city||'—') + (c.state && c.state!=='—' ? ', '+esc(c.state) : '');
  const sessionsTxt = c.sessions!=null ? '~'+fmtInt(c.sessions) : null;
  const usersTxt = c.users!=null ? '~'+fmtInt(c.users) : null;
  const ordersTxt = c.orders!=null ? fmtInt(c.orders) : '0';
  const hasStore = cl.available;
  const hasTanishq = !!tq;
  const anyCompetitor = hasStore || hasTanishq;
  const heavyCaratlane = hasStore && cl.storeCount>=3;
  const heavyTanishq = hasTanishq && tq.storeCount>=3;
  const heavyCompetition = heavyCaratlane || heavyTanishq;
  const checkoutLeak = c.atc>50 && c.chk!=null && safeDiv(c.chk,c.atc) < 0.15;
  const demandFulfilGap = c.sessions!=null && c.sessions>0 && (c.orders==null || c.orders < c.sessions*0.01);
  const declining = cityObj && cityObj.growthPct!=null && cityObj.growthPct < -10;

  let growthLine;
  if (cityObj && cityObj.growthPct!=null){
    if (cityObj.growthPct > 5) growthLine = `${esc(c.city)} — the city this pin code sits in — is <b>growing</b>: sessions are up ${pct1(cityObj.growthPct)} vs. the prior 90-day period.`;
    else if (cityObj.growthPct < -5) growthLine = `${esc(c.city)} is <b>declining</b>: sessions are down ${pct1(Math.abs(cityObj.growthPct))} vs. the prior 90-day period.`;
    else growthLine = `${esc(c.city)}'s session trend is roughly flat (${pct1(cityObj.growthPct)}) vs. the prior 90-day period.`;
  } else {
    growthLine = 'Growth trend: Data unavailable (not enough prior-period session history for this city yet).';
  }
  const nearbyStoreLine = 'Nearby existing Lucira store: Data unavailable — no store-location master (a list of Lucira\'s own store addresses/coordinates) is connected to any source in this dashboard, so cannibalisation risk from an existing store nearby cannot be checked from this data.';
  const caratlaneLine = hasStore
    ? `CaratLane already operates <b>${cl.storeCount}</b> store(s) here${cl.status?` (status: ${esc(cl.status)})`:''}${cl.rating!=null?`, rated ${fmtNum(cl.rating,1)}/5`:''}${cl.catalogTotal?`, with a public catalog of ~${fmtInt(cl.catalogTotal)} listed items`:''} — this pin code is <b>contested</b>, not open ground.`
    : `No CaratLane store was found at this exact pin code in either capture we have — a possible <b>whitespace</b> opportunity, though that is not proof of zero competitor presence; verify on the ground.`;
  const tanishqLine = hasTanishq
    ? `Tanishq also runs <b>${tq.storeCount}</b> store(s) here (official store locator)${tq.stores[0]?.status?`, status: ${esc(tq.stores[0].status)}`:''} — a second organised-jewellery competitor already validating this market.`
    : `No Tanishq store was found at this exact pin code in the official store locator.`;

  let rec, recClass;
  if (declining || (heavyCompetition && c.deals<10)) { rec='Low-priority location'; recClass='crit'; }
  else if (checkoutLeak && c.deals<10) { rec='Demand exists but conversion is weak'; recClass='warn'; }
  else if (c.deals>=10 && demandFulfilGap && !heavyCompetition) { rec='Strong location — consider opening'; recClass='good'; }
  else if (c.deals>=5) { rec='Promising — validate with marketing/store-visit activity first'; recClass='warn'; }
  else { rec='Not enough evidence to open'; recClass=''; }

  const narrative = `Pin code ${esc(c.pincode)} (${cityState}) looks like a ${rec.startsWith('Strong')||rec.startsWith('Promising')?'notable':'mixed'} store-opening signal: it has generated <b>${fmtInt(c.deals)} real CRM deals</b> (${fmtInt(c.won)} won) with zero Lucira store nearby${sessionsTxt?`, alongside ${sessionsTxt} modelled sessions and ${usersTxt} distinct users allocated to it from ${esc(c.city)}'s real GA4 activity`:''} — demand exists, but only <b>${ordersTxt}</b> modelled orders have been fulfilled from here so far, and ${anyCompetitor?`${hasStore&&hasTanishq?'both CaratLane and Tanishq are':hasStore?'CaratLane is':'Tanishq is'} already on the ground`:'no organised-jewellery competitor has been confirmed on the ground'}.`;

  const why = `Real deal creation (${fmtInt(c.deals)}, ${fmtInt(c.won)} won) plus modelled digital interest${sessionsTxt?` (${sessionsTxt} sessions / ${usersTxt} users)`:''} together show this is not a cold pin code — people here are already engaging with Lucira online and by deal, without a store to walk into. ${growthLine} ${caratlaneLine} ${tanishqLine}`;

  const opportunity = `The gap between demand and fulfilment is the opportunity: ${sessionsTxt?`~${fmtInt(c.sessions)} modelled sessions produced only ${ordersTxt} modelled completed orders`:`real deal activity (${fmtInt(c.deals)}) has produced only ${ordersTxt} modelled completed orders`} — a physical presence (store or pop-up) closes the last-mile gap that a website alone hasn't.`;

  const benefit = `Opening here converts demand that already exists into revenue, rather than generating new demand from scratch: ${fmtInt(c.deals)} CRM deals (${fmtInt(c.won)} won)${sessionsTxt?` and ${sessionsTxt} modelled sessions`:''} from this exact pin code currently have nowhere local to convert into a walk-in sale — for jewellery, a considered, try-before-you-buy purchase, a nearby store typically converts a meaningfully higher share of that existing interest than the website alone. ${anyCompetitor
    ? `It also means Lucira would be competing for a market ${hasStore&&hasTanishq?'CaratLane and Tanishq have':hasStore?'CaratLane has':'Tanishq has'} already proven out here${hasStore?` (CaratLane: ${cl.storeCount} store${cl.storeCount>1?'s':''}${cl.rating!=null?`, rated ${fmtNum(cl.rating,1)}/5`:''}${cl.catalogTotal?`, ~${fmtInt(cl.catalogTotal)} catalog items`:''})`:''}${hasTanishq?` (Tanishq: ${tq.storeCount} store${tq.storeCount>1?'s':''})`:''} instead of ceding that proven demand to them by default.`
    : `Because no CaratLane or Tanishq presence was found at this exact pin code, Lucira would also be first to market here rather than following a competitor in.`}`;

  const action = `Run a pin-code-targeted local campaign — geo-fenced ads plus outreach (call/WhatsApp/SMS) to the ${fmtInt(c.deals)} existing CRM contacts here — inviting them into the nearest current Lucira store or a temporary pop-up, to prove digital demand converts to a physical visit before committing capital to a permanent store.${c.webengage?` <b>${fmtInt(c.webengage.webengage_contacts)}</b> of these contacts are already reachable on WebEngage (having received ${fmtInt(c.webengage.total_sent)} messages historically) — reuse that existing, already-permissioned list for the launch campaign instead of building a new one from scratch.`:''}${checkoutLeak?' Checkout*/ATC* conversion is unusually low here too, so also review the online checkout experience (payment options, delivery promise) for this region — part of the gap may be a website friction issue, not a store-need issue.':''}`;

  const plan1 = `Validate demand: 30-day local geo-targeted campaign + direct outreach to the ${fmtInt(c.deals)} existing CRM leads in this pin code; track store-visit/pop-up footfall as the primary metric, not sessions.`;
  const plan2 = `If footfall is positive, finalize a location and soft-launch with an offer targeted at this same pin code's existing lead list; track walk-ins and walk-in-to-sale conversion.`;
  const plan3 = `Push toward profitability: convert Month 1-2 walk-ins into repeat visits with a loyalty/referral offer, and reassess ${hasStore&&hasTanishq?"CaratLane's and Tanishq's":hasStore?"CaratLane's":hasTanishq?"Tanishq's":"the local competitive"} response (pricing/promotions) before scaling further.`;

  const riskParts = [];
  if (declining) riskParts.push(`${esc(c.city)}'s underlying session trend is declining — opening now risks entering a shrinking market.`);
  if (heavyCaratlane) riskParts.push(`CaratLane already runs ${cl.storeCount} store(s) here${cl.rating!=null?` (avg rating ${fmtNum(cl.rating,1)}/5)`:''} — this is a contested market, not whitespace.`);
  if (heavyTanishq) riskParts.push(`Tanishq already runs ${tq.storeCount} store(s) here (official store locator) — another established competitor already on the ground.`);
  if (c.deals<10) riskParts.push(`Real deal volume (${fmtInt(c.deals)}) is still a small sample — the modelled Sessions/Users/ATC/Checkout numbers derived from it are directional, not precise.`);
  riskParts.push(nearbyStoreLine);
  const risk = riskParts.join(' ');

  return `
  <div class="insight" style="margin-top:10px"><span class="ii">✦</span><div>
    <div style="font-weight:700;margin-bottom:4px">📍 ${esc(c.pincode)} — ${cityState}</div>
    <div style="margin-bottom:8px">${narrative}</div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">WHY:</b> ${why}</div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">OPPORTUNITY:</b> ${opportunity}</div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">BENEFIT:</b> ${benefit}</div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">ACTION:</b> ${action}</div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">3-MONTH PLAN:</b>
      <div style="margin-top:2px">Month 1 — ${plan1}</div>
      <div style="margin-top:2px">Month 2 — ${plan2}</div>
      <div style="margin-top:2px">Month 3 — ${plan3}</div>
    </div>
    <div style="margin-top:6px"><b style="color:var(--gold-2)">RISK:</b> ${risk}</div>
    <div style="margin-top:8px"><b style="color:var(--gold-2)">FINAL AI RECOMMENDATION:</b> <span class="chip ${recClass}">${esc(rec)}</span></div>
  </div></div>`;
}

PAGE_RENDERERS.pincode = function(){
  const rows = filteredZohoPincode().slice().sort(byDesc(r=>r.deals));
  const cov = STATE.D.coverage;

  // denominator for the allocation share = total REAL deals across pin codes known within that city
  // (not the city's full deal count, so shares sum to 1 across the pin codes we can actually show)
  const cityDealTotals = new Map();
  for(const r of rows){
    const c = normCity(r.city); if(!c) continue;
    cityDealTotals.set(c, (cityDealTotals.get(c)||0) + n(r.deals));
  }
  // date-filtered city totals -- NOT STATE.D.CITY (full-window, static) -- so Sessions*/PDP*/
  // Users*/ATC*/Checkout* actually change when the date range filter changes, same as Deals/Won.
  const cityByName = new Map(filteredCity().map(c=>[c.city, c]));

  const enriched = rows.map(r=>{
    const cityNorm = normCity(r.city);
    const cityObj = cityByName.get(cityNorm);
    const erp = erpCityRowFor(cityNorm);
    const cityDealTotal = cityDealTotals.get(cityNorm) || 0;
    const share = cityDealTotal>0 ? n(r.deals)/cityDealTotal : 0;
    const sessions = cityObj ? share*cityObj.sessions : null;
    const pdp = cityObj ? share*cityObj.pdp_views : null;
    const users = cityObj ? share*(cityObj.usersReal!=null?cityObj.usersReal:cityObj.sessions) : null;
    const atc = cityObj ? share*cityObj.add_to_cart : null;
    const chk = cityObj ? share*cityObj.begin_checkout : null;
    const orders = erp ? share*erp.orders : null;
    const caratlane = mergeCaratlane(r.pincode);
    const webengage = webengageAt(r.pincode);
    const tanishq = tanishqAt(r.pincode);
    return {...r, cityNorm, share, sessions, pdp, users, atc, chk, orders, caratlane, webengage, tanishq, cityObj, erp};
  });

  const pinsWithCaratlane = enriched.filter(r=>r.caratlane.available).length;
  const pinsWithWebengage = enriched.filter(r=>r.webengage).length;
  const pinsWithTanishq = enriched.filter(r=>r.tanishq).length;

  // store-opening candidates: enough real deal signal (5+), meaningful modelled demand,
  // but modelled order fulfilment still low relative to that demand — a demand/fulfilment gap.
  const candidates = enriched.filter(r=>r.deals>=5 && r.sessions!=null)
    .sort(byDesc(r=> r.sessions * (1/(1+(r.orders||0))) )).slice(0,5);

  // ---- FULL OUTER JOIN on Pincode (2026-08-10 spec, merged 2026-08-10): dashboard/session
  // pincodes (Zoho, `enriched` above) ∪ EVERY CaratLane pincode from BOTH captures (old
  // catalog dataset + new GBP store master — not just the new one, so the ~25 pincodes only
  // in the old dataset aren't silently dropped either). `rows`/`enriched`/`cov`/the KPIs above
  // and `candidates` are DELIBERATELY left untouched — they stay Zoho-only so "Pin Codes
  // Tracked" etc. keep meaning exactly what their label says. This join only feeds the Pin
  // Code Detail TABLE, so CaratLane-only pincodes (a store exists, Lucira has zero deals
  // there) are visible without inflating the real-data summary metrics.
  const zohoPins = new Set(enriched.map(r=> normPincode(r.pincode)).filter(Boolean));
  const allCaratlanePins = new Set();
  (STATE.D.RAW.caratlaneStores||[]).forEach(s=>{ const k=normPincode(s.pincode); if(k) allCaratlanePins.add(k); });
  (STATE.D.RAW.caratlaneStoreMaster||[]).forEach(s=>{ const k=normPincode(s.pincode); if(k) allCaratlanePins.add(k); });
  const storeOnlyRows = Array.from(allCaratlanePins)
    .filter(k=> !zohoPins.has(k))
    .map(pin=>{
      const caratlane = mergeCaratlane(pin);
      return {
        pincode: pin, area: null, city: caratlane.city || '—', state: '—',
        deals: 0, won: 0, share: 0, sessions: null, pdp: null, users: null, atc: null, chk: null, orders: null,
        caratlane, webengage: webengageAt(pin), tanishq: tanishqAt(pin), storeOnly: true,
      };
    });
  const fullOuterRows = enriched.concat(storeOnlyRows).sort(byDesc(r=>r.deals));

  const topAtc = enriched.filter(r=>r.atc!=null && r.atc>0).slice().sort(byDesc(r=>r.atc)).slice(0,15).map(r=>({label:r.pincode+' · '+(r.city||'—'), value:r.atc}));
  const topChk = enriched.filter(r=>r.chk!=null && r.chk>0).slice().sort(byDesc(r=>r.chk)).slice(0,15).map(r=>({label:r.pincode+' · '+(r.city||'—'), value:r.chk}));

  return `
  ${renderChipsRow()}
  <div class="sec-head"><div><h2>Pin Code Intelligence</h2><p>Pin Code, City, State and Deals Created are <b>real</b> (Zoho <code>Address_Zip</code>). Sessions, PDP, Users, ATC and Checkout are <b>modelled</b> — GA4's export carries no postal/pin-code field anywhere (confirmed against the raw event schema; the only shipping-related signal is an add_shipping_info event count, not an address), so these are allocated from that pin code's city-level GA4 totals <b>for the currently selected date range</b> (city sessions/pdp/etc. are tracked day-by-day, same as the pin code deals), weighted by its share of real deals within the city for that same range (marked * throughout) — narrowing to a single day changes both consistently. Known/Identified Users has no source at ANY grain and is never modelled — shown as N/A, not estimated. <b>The table below is a full outer join on Pincode</b> — every pincode from Zoho deals OR either of the two CaratLane captures (206-store catalog dataset + 308-pincode GBP store master, merged into one CaratLane view) is shown; pincodes with a store but no Lucira deals yet show 0/— for the deal/session columns rather than being hidden.</p></div>
    <span class="chip warn">○ ${fmtInt(rows.length)} pin codes tracked · ${cov.deals_with_city_pct}%-class Zoho coverage</span></div>

  <div class="card" style="margin-bottom:14px">
    <h3 style="font-size:13.5px;margin-bottom:6px">✦ Key Insights</h3>
    ${insightBox(`<b>Pin code capture gap</b>: only <b>${cov.deals_with_zip_pct}%</b> of all Zoho deals (${fmtInt(cov.deals_with_zip)} of ${fmtInt(cov.deals_total)}) have Address_Zip filled in — the other <b>${fmtInt(cov.deals_without_zip)}</b> deals are invisible to this entire page. Getting sales to capture pin code at deal creation is the single biggest unlock for everything below.`)}
    ${insightBox(`<b>CaratLane overlap</b>: CaratLane already has a store in <b>${pct1(safeDiv(pinsWithCaratlane,rows.length)*100)}</b> of tracked pin codes (${fmtInt(pinsWithCaratlane)} of ${fmtInt(rows.length)}) — plus <b>${fmtInt(storeOnlyRows.length)}</b> pin codes where CaratLane has a store but Lucira has zero deals yet (see Store-Only Pincodes).`)}
    ${insightBox(`<b>WebEngage reach</b>: WebEngage's own data has no pin code field at all, but matching its contacts to Zoho by mobile number reaches <b>${fmtInt(pinsWithWebengage)}</b> real pin codes (of ${fmtInt(WEBENGAGE_BY_PINCODE.size)} reachable network-wide) — a small but real, already-permissioned audience worth reusing for local campaigns before building a new one from scratch.`)}
    ${insightBox(`<b>Tanishq overlap</b>: Tanishq (official store locator, 541 stores) already has a store in <b>${pct1(safeDiv(pinsWithTanishq,rows.length)*100)}</b> of tracked pin codes (${fmtInt(pinsWithTanishq)} of ${fmtInt(rows.length)}) — check this alongside CaratLane presence above before treating a pin code as whitespace.`)}
  </div>

  <div class="grid kpi-grid" style="margin-bottom:4px">
    ${kpiCardText('Pin Codes Tracked', fmtInt(rows.length), 'real, from Zoho Address_Zip')}
    ${kpiCard({label:'Deals Created', value:sumBy(rows,r=>r.deals), fmt:fmtInt})}
    ${kpiCardText('All Zoho Deals — With Pin Code', fmtInt(cov.deals_with_zip)+' of '+fmtInt(cov.deals_total)+' ('+cov.deals_with_zip_pct+'%)', 'full connected window '+cov.min_date+' → '+cov.max_date+' — real, not date-filtered')}
    ${kpiCardText('All Zoho Deals — Without Pin Code', fmtInt(cov.deals_without_zip)+' of '+fmtInt(cov.deals_total)+' ('+fmtNum(100-cov.deals_with_zip_pct,1)+'%)', 'sales team left Address_Zip blank — this is why Deals Created above looks low vs. Zoho\'s real daily deal volume')}
    ${kpiCard({label:'Modelled Sessions (sum)', value:sumBy(enriched,r=>r.sessions||0), fmt:fmtInt})}
    ${kpiCard({label:'Modelled Users (sum)', value:sumBy(enriched,r=>r.users||0), fmt:fmtInt})}
    ${kpiCard({label:'Modelled PDP Views (sum)', value:sumBy(enriched,r=>r.pdp||0), fmt:fmtInt})}
    ${kpiCard({label:'Modelled Add to Cart (sum)', value:sumBy(enriched,r=>r.atc||0), fmt:fmtInt})}
    ${kpiCard({label:'Modelled Checkout (sum)', value:sumBy(enriched,r=>r.chk||0), fmt:fmtInt})}
    ${kpiCardText('Known Users', 'N/A', 'No identity key at any grain — see Identified Users page')}
    ${kpiCardText('CaratLane Present', fmtInt(pinsWithCaratlane)+' of '+fmtInt(rows.length), 'tracked pin codes matching EITHER CaratLane capture (merged), real exact pin-code match')}
    ${kpiCardText('CaratLane Pincodes (merged, both captures)', fmtInt(allCaratlanePins.size), 'union of the 206-store catalog dataset + the 308-pincode GBP store master')}
    ${kpiCardText('Store-Only Pincodes', fmtInt(storeOnlyRows.length), 'a CaratLane store exists here but Lucira has 0 deals — shown, not filtered out')}
    ${kpiCardText('WebEngage-Reachable Pin Codes', fmtInt(pinsWithWebengage)+' of '+fmtInt(rows.length), 'real, via mobile-number match to Zoho — WebEngage itself has no pin code field')}
    ${kpiCardText('Tanishq Present', fmtInt(pinsWithTanishq)+' of '+fmtInt(rows.length), 'real, official Tanishq store locator, exact pin-code match')}
  </div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card chart-card"><div class="hd"><h3>Top 15 Pin Codes — Add to Cart* ${chartInfo('Add to Cart by Pin Code','Modelled ATC allocated to each pin code by its share of real deals within its city, for the currently selected date range.','share × city ATC (same allocation as the table\'s ATC* column)','Shows where cart-building intent is concentrated at the pin-code level, not just city level.','A pin code high on ATC but low on Checkout is a conversion-drop-off signal worth investigating.','Cross-check against the Checkout* chart alongside it — a large gap between the two at the same pin code is where the funnel leaks.','','atc','Sales Ops','Daily')}</h3></div>${topAtc.length?barChart(topAtc,{horizontal:true,height:Math.max(220,topAtc.length*26)}):'<div class="empty-note">No pin code has modelled ATC &gt; 0 in the current date range.</div>'}</div>
    <div class="card chart-card"><div class="hd"><h3>Top 15 Pin Codes — Checkout*</h3></div>${topChk.length?barChart(topChk,{horizontal:true,height:Math.max(220,topChk.length*26)}):'<div class="empty-note">No pin code has modelled Checkout &gt; 0 in the current date range.</div>'}</div>
  </div>

  ${simpleTable('pincodeTbl', ['#','Pin Code','Area','City','State','Sessions*','PDP*','Users*','Known Users','ATC*','Checkout*','Deals Created','CaratLane Present','CaratLane Store(s)','Business Status','Rating','Total Catalog Items†']
      .concat(CARATLANE_CAT_KEYS.map(k=>'CL '+k+'†'))
      .concat(CARATLANE_PB_BANDS.map(b=>'CL '+b.label+'†'))
      .concat(['Tanishq Present','Tanishq Store(s)','Tanishq Store Type','Tanishq Status','Tanishq Rating']),
    fullOuterRows.map((r,i)=>{ const cl = r.caratlane; const tq = r.tanishq; return [
    [i+1,i+1], esc(r.pincode), esc(r.area||'—'), esc(r.city||'—'), esc(r.state||'—'),
    [r.sessions!=null?fmtInt(r.sessions):'—', r.sessions||0],
    [r.pdp!=null?fmtInt(r.pdp):'—', r.pdp||0],
    [r.users!=null?fmtInt(r.users):'—', r.users||0],
    'N/A',
    [r.atc!=null?fmtInt(r.atc):'—', r.atc||0],
    [r.chk!=null?fmtInt(r.chk):'—', r.chk||0],
    [r.storeOnly?`<span style="color:var(--muted)">0</span>`:fmtInt(r.deals), n(r.deals)],
    [cl.available?`<span class="chip good">● TRUE</span>`:`<span class="chip">— FALSE</span>`, cl.available?1:0],
    cl.storeCount ? esc(cl.storeNames.join('; ')) : '—',
    cl.status ? esc(cl.status) : '—',
    cl.rating!=null ? [fmtNum(cl.rating,1), cl.rating] : '—',
    [cl.catalogTotal?fmtInt(cl.catalogTotal):'—', cl.catalogTotal||0],
  ].concat(CARATLANE_CAT_KEYS.map(k=> [cl.cat[k]?fmtInt(cl.cat[k]):'—', cl.cat[k]||0]))
   .concat(CARATLANE_PB_BANDS.map(b=> [cl.pb[b.key]?fmtInt(cl.pb[b.key]):'—', cl.pb[b.key]||0]))
   .concat((()=>{
     if(!tq) return [[`<span class="chip">— FALSE</span>`,0], '—', '—', '—', '—'];
     const types = Array.from(new Set(tq.stores.map(s=>s.storeType).filter(Boolean)));
     const ratings = tq.stores.map(s=>s.rating).filter(v=>v!=null);
     const avgRating = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : null;
     return [
       [`<span class="chip good">● TRUE</span>`,1],
       esc(tq.stores.map(s=>s.name).filter(Boolean).join('; ')||'—'),
       types.length?esc(types.join('; ')):'—',
       tq.stores[0]?.status?esc(tq.stores[0].status):'—',
       avgRating!=null?[fmtNum(avgRating,1),avgRating]:'—',
     ];
   })()); }
  ), {title:'Pin Code Detail  ·  * = modelled (allocated from real city totals by deal-share, not directly measured)  ·  † = CaratLane public catalog listing count, not stock', searchable:true,
    hint:'Area = the locality/post-office name(s) served by that pin code, resolved from the public India Post pincode directory (api.postalpincode.in) — real reference data, not modelled from Lucira\'s own sources (no Pin→Area field exists in Zoho or GA4). Pin codes covering many post offices show the first few + a "+N more" count rather than picking one arbitrarily; "—" means the directory had no record for that (or a malformed) pin code. Modelled columns assume a pin code\'s share of its city\'s real GA4/ERP activity equals its share of real Zoho deals within that city — a reasonable proxy, not a measurement. Pin codes with very few deals (1-2) produce noisy modelled numbers; treat those directionally only, and lean on the Deals Created column (real) for anything decision-critical. <b>CaratLane columns are MERGED from two separate captures</b>: an older 206-store online-catalog dataset (gives Total Catalog Items† + the per-category/per-price-band CL…† columns — public assortment-depth proxy, not stock) and a newer 308-pincode Google-Business-Profile store directory (gives Business Status/Rating, and contributes extra names to CaratLane Store(s)). <b>CaratLane Present</b> is TRUE if EITHER capture has a match at that exact pincode; <b>CaratLane Store(s)</b> is the union of store names from both. Business Status/Rating are blank where only the older capture has a match (it never collected those fields), and Total Catalog Items†/CL…† columns are blank where only the newer capture has a match (it never collected catalog counts) — nothing is invented to fill either gap. <b>Tanishq columns are REAL</b>, from the official Tanishq store-locator export (541 stores, 509 pin codes) — Tanishq Present is an exact pin-code match, Tanishq Store(s)/Store Type/Status/Rating are pulled directly from that export with no allocation or estimation. Its SKU/inventory field is 100% "Not Available" at the source (WAF-blocked when collected) and is intentionally not shown anywhere on this page — no Tanishq equivalent of CaratLane\'s Total Catalog Items† exists. Click column headers to sort — e.g. sort by real Deals Created descending, then scan the CaratLane/Tanishq columns, to spot high-demand pin codes neither competitor has reached yet.'})}

  <div class="card" style="margin-top:16px">
    <h3 style="font-size:14px;margin-bottom:10px">🤖 AI Store-Opening Insights — Pin Code Level</h3>
    <div class="hint" style="margin-bottom:10px">For each pin code with enough real deal signal (5+ Zoho deals), the AI below connects real deals/won, GA4-modelled Sessions/PDP/Users/ATC/Checkout, ERP-modelled Orders, the city's real GA4 growth trend and merged CaratLane presence into a plain-English read — not a repeat of the numbers already in the table above. The FINAL AI RECOMMENDATION is a transparent rule over these same fields (shown in WHY/RISK), not a hidden score. Anything with no connected source in this dashboard (e.g. distance to an existing Lucira store) is marked "Data unavailable", never estimated.</div>
    ${candidates.length ? candidates.map(c=>aiStoreOpeningInsight(c)).join('') : '<div class="empty-note">No pin code currently has enough real deal volume (5+) to generate a store-opening insight confidently.</div>'}
  </div>
  `;
};

const CARATLANE_CATEGORY_KEYS = ['Rings','Earrings','Necklaces','Pendants','Bracelets','Bangles','Nose pin'];
const CARATLANE_PRICE_BANDS = [
  {key:'u5k', label:'Under ₹5,000'}, {key:'b5_10', label:'₹5,001–₹10,000'}, {key:'b10_15', label:'₹10,001–₹15,000'},
  {key:'b15_20', label:'₹15,001–₹20,000'}, {key:'b20_30', label:'₹20,001–₹30,000'}, {key:'b30_40', label:'₹30,001–₹40,000'},
];
PAGE_RENDERERS.caratlane = function(){
  const stores = (STATE.D.RAW.caratlaneStores||[]).map(s=>{
    const total = CARATLANE_CATEGORY_KEYS.reduce((a,k)=>a+((s.cat&&s.cat[k])||0),0);

  const cities = new Set(stores.map(s=>s.city)).size;
  const totalItems = sumBy(stores, s=>s.total);

  const catAgg = CARATLANE_CATEGORY_KEYS.map(k=>({label:k, value:sumBy(stores, s=>(s.cat&&s.cat[k])||0)})).filter(r=>r.value>0).sort(byDesc(r=>r.value));
  const pbAgg = CARATLANE_PRICE_BANDS.map(b=>({label:b.label, value:sumBy(stores, s=>(s.pb&&s.pb[b.key])||0)})).filter(r=>r.value>0);
  const cityAgg = Array.from(groupBy(stores, s=>s.city).entries())
    .map(([city,rows])=>({label:`${city} (${rows.length})`, value:sumBy(rows,s=>s.total)}))
    .sort(byDesc(r=>r.value)).slice(0,20);

  return `
  ${renderChipsRow()}
  <div class="sec-head"><div><h2>CaratLane Intelligence</h2><p>Competitor's public store footprint and online-catalog assortment mix, for benchmarking against Lucira's own network.</p></div></div>

  <div class="hint" style="margin-bottom:14px">⚠ <b>Read this before using the numbers.</b> CaratLane does not publish real per-store physical stock anywhere public — no retailer does. The "inventory" figures here are <b>online catalog listing counts</b> pulled from each store's own filter sidebar on caratlane.com (a public proxy for local assortment depth/mix), <b>not</b> audited warehouse or shelf stock. Every store page also lists more categories/price bands than captured — figures below are a floor, not the full catalog. Coverage is ${fmtInt(stores.length)} of an estimated ~230+ stores nationwide (7 metros alone list 148 on CaratLane's own city pages). "Diamond/Gold/Gemstone/Platinum" are material filters, not product categories, and are kept out of the totals to avoid double-counting. Collected via public web search + read of each store's own catalog page (no login, no ToS bypass) — not affiliated with or endorsed by CaratLane/Tata/Titan; for internal benchmarking only. This dataset is a one-time capture (Aug 2026), independent of the date filter above.</div>

  <div class="grid g4" style="margin-bottom:14px">
    ${kpiCardText('Stores Captured', fmtInt(stores.length), `across ${fmtInt(cities)} cities`)}
    ${kpiCardText('Cities Covered', fmtInt(cities), 'metro + tier-2/3 towns')}
    ${kpiCardText('Catalog Items Indexed', fmtInt(totalItems), 'across all product categories — a floor, not the full catalog')}
    ${kpiCardText('Avg Items / Store', fmtInt(safeDiv(totalItems,stores.length)), 'across captured categories')}
  </div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card chart-card"><div class="hd"><h3>Category Mix — catalog listings ${chartInfo('Category Mix','Sum of catalog listing counts per product category, across all captured stores.','SUM(cat[category]) across stores','Shows where CaratLane concentrates online assortment depth.','A category far ahead of the rest is where CaratLane is deepest — check Lucira\'s own depth there.','Benchmark Lucira\'s category assortment against the leader(s) here.','','category mix','Merchandising','One-time (Aug 2026)')}</h3></div>${barChart(catAgg,{horizontal:true})}</div>
    <div class="card chart-card"><div class="hd"><h3>Price-Band Mix — catalog listings</h3></div>${barChart(pbAgg,{horizontal:true})}
      <div class="hint" style="margin-top:8px">Bands beyond ₹30,000–40,000 exist on every store page but weren't reliably captured in this pass.</div>
    </div>
  </div>

  <div class="card chart-card" style="margin-bottom:14px"><div class="hd"><h3>By City — total catalog items (store count)</h3></div>${barChart(cityAgg,{horizontal:true,height:Math.max(220,cityAgg.length*26)})}</div>

  ${simpleTable('caratlaneTbl',
    ['Pincode','Store','City','Total','Address'].concat(CARATLANE_CATEGORY_KEYS.map(k=>'CL '+k)).concat(CARATLANE_PRICE_BANDS.map(b=>b.label)).concat(['Source']),
    stores.slice().sort(byDesc(s=>s.total)).map(s=>[
      esc(s.pincode||'—'), esc(s.store), esc(s.city), [fmtInt(s.total), s.total], esc(s.address||''),
      ...CARATLANE_CATEGORY_KEYS.map(k=> (s.cat&&s.cat[k]) ? [fmtInt(s.cat[k]), s.cat[k]] : '—'),
      ...CARATLANE_PRICE_BANDS.map(b=> (s.pb&&s.pb[b.key]) ? [fmtInt(s.pb[b.key]), s.pb[b.key]] : '—'),
      `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--gold-2)">view ↗</a>`,
    ]),
    {title:`Every CaratLane Store (${stores.length})`, searchable:true, hint:'Click a column header to sort. "CL" columns are CaratLane\'s own catalog-listing counts per category/price-band.'}
  )}
  `;
};

/* ============================== 28. AI CHAT ENGINE ============================== */
STATE.chatLog = [];
function findCityInText(q){
  const CITY = STATE.D.CITY;
  const ql = q.toLowerCase();
  return CITY.find(c=> ql.includes(c.city.toLowerCase()));
}
function answerQuestion(q){
  const ql = q.toLowerCase();
  const CITY = STATE.D.CITY.filter(c=>c.sessions>=200);
  const byRevenue = CITY.slice().sort(byDesc(c=>c.revenue));
  const byGrowth = CITY.filter(c=>c.growthPct!=null).sort(byDesc(c=>c.growthPct));
  const byConv = CITY.slice().sort(byDesc(c=>c.conv));
  const cityMax = { population: Math.max(1,...CITY.map(c=>c.population||0)), sessions: Math.max(1,...CITY.map(c=>c.sessions)), pdp_views:Math.max(1,...CITY.map(c=>c.pdp_views)), add_to_cart:Math.max(1,...CITY.map(c=>c.add_to_cart)), deals:Math.max(1,...CITY.map(c=>c.deals)), revenue:Math.max(1,...CITY.map(c=>c.revenue)), highValueOrders:Math.max(1,...CITY.map(c=>c.highValueOrders||0)), campaignResponseRate:Math.max(0.01,...CITY.map(c=>c.campaignResponseRate||0)) };

  if(/generate ppt|powerpoint/.test(ql)) return 'PowerPoint export needs a client-side deck library (e.g. pptxgenjs) that is not wired into this build yet. CSV, Excel and PDF (via Print) work today from the Export menu — I can prioritize PPT next if you need it.';
  if(/generate pdf/.test(ql)) return 'Use the Export menu (top right) → PDF — it prints the current page cleanly via the browser\'s print dialog (choose "Save as PDF").';
  if(/generate excel/.test(ql)) return 'Use the Export menu (top right) → Excel — it exports the current page\'s table as a formatted .xls workbook.';
  if(/ceo summary/.test(ql)) return buildCeoSummary().html.replace(/<\/?p>/g,'\n').trim();
  if(/weekly action plan|action plan/.test(ql)){
    const cards = buildActionCenter().slice(0,5);
    return 'Top 5 actions for next week:\n' + cards.map((c,i)=>`${i+1}. [${c.priority.toUpperCase()}] ${c.issue} → ${c.action}`).join('\n');
  }
  if(/predict/.test(ql)){
    const p = predictionsFor(STATE.D.RAW.nationalDaily, 'revenue');
    return `Statistical projection (linear trend on daily revenue, not a trained model): next week ≈ ${fmtMoney(p.nextWeek.horizonTotal)}, next month ≈ ${fmtMoney(p.nextMonth.horizonTotal)}, next quarter ≈ ${fmtMoney(p.nextQuarter.horizonTotal)}. Recent 7-day trend is ${p.nextWeek.trendPct>0?'up':'down'} ${Math.abs(p.nextWeek.trendPct).toFixed(1)}% vs the 7 days before.\n${byGrowth[0]?`Best-positioned city for next month by current momentum: ${byGrowth[0].city} (+${pct1(byGrowth[0].growthPct)}).`:''}`;
  }
  if(/compare/.test(ql)){
    const found = CITY.filter(c=> ql.includes(c.city.toLowerCase()));
    if(found.length>=2){
      const [a,b] = found;
      return `${a.city} vs ${b.city}:\nRevenue: ${fmtMoney(a.revenue)} vs ${fmtMoney(b.revenue)}\nSessions: ${fmtInt(a.sessions)} vs ${fmtInt(b.sessions)}\nConversion: ${pct1(a.conv)} vs ${pct1(b.conv)}\nGrowth: ${a.growthPct!=null?pct1(a.growthPct):'—'} vs ${b.growthPct!=null?pct1(b.growthPct):'—'}\nDeals (city-known subset): ${a.deals} vs ${b.deals}`;
    }
    return 'Name two cities to compare, e.g. "Compare Mumbai vs Ahmedabad".';
  }
  if(/returning users?/.test(ql)){
    const byRet = CITY.filter(c=>c.hasFact && c.usersReal>=100).sort(byDesc(c=>c.returningSharePct));
    if(!byRet.length) return 'No city has enough real distinct-user volume (100+) to rank returning-user share confidently.';
    return `${byRet[0].city} has the highest returning-user share: ${pct1(byRet[0].returningSharePct)} of ${fmtInt(byRet[0].usersReal)} distinct users (last 90 days). Runner-up: ${byRet[1]?byRet[1].city+' ('+pct1(byRet[1].returningSharePct)+')':'—'}.`;
  }
  if(/today.?s? users?|today.?s? traffic/.test(ql)){
    const daily = STATE.D.RAW.nationalDaily||[]; const latest = daily[daily.length-1];
    if(!latest) return 'No daily data loaded.';
    return `Most recent available day is ${latest.d} (GA4 export lags real-time by ~1-2 days, so this is not literally "today"): ${fmtInt(n(latest.users))} users, ${fmtInt(n(latest.sessions))} sessions, ${fmtInt(n(latest.purchases))} purchases, ${fmtMoney(n(latest.revenue))} revenue. See the Today's Users page for the full KPI set.`;
  }
  if(/identified users?|why.*not available|why.*gated|pin ?code.*not available|area.*not available|webengage.*not available|session.?to.?sale/.test(ql)){
    if(/identified/.test(ql)) return GATE_REASONS.identified;
    if(/pin ?code/.test(ql)) return 'Pin Code Performance IS partially available (real Zoho Address_Zip deal counts) — see that page. ' + GATE_REASONS.area;
    if(/area/.test(ql)) return GATE_REASONS.area;
    if(/webengage/.test(ql)) return GATE_REASONS.webengage;
    if(/session.?to.?sale/.test(ql)) return GATE_REASONS.attribution;
    return 'Ask about a specific gated section — Identified Users, Area, Pin Code, WebEngage, or Session-to-Sale Attribution — and I\'ll give the exact reason it\'s not available yet.';
  }
  if(/luxury/.test(ql)){
    const byLux = CITY.filter(c=>c.luxuryShare!=null).sort(byDesc(c=>c.luxuryShare));
    if(!byLux.length) return 'No luxury-share data available for the current filter.';
    return `Highest luxury demand (share of revenue from High-margin products): ${byLux[0].city} at ${pct1(byLux[0].luxuryShare)}, followed by ${byLux[1]?byLux[1].city+' ('+pct1(byLux[1].luxuryShare)+')':'—'}.`;
  }
  if(/view products but never|pdp but never|browse but never|no deals|never create deals/.test(ql)){
    const gap = CITY.filter(c=>c.pdp_views>1000 && (!c.hasZoho || c.deals===0)).sort(byDesc(c=>c.pdp_views)).slice(0,5);
    if(!gap.length) return 'Every high-PDP city in the current filter has at least one matched CRM deal — though remember only 15.9% of all deals carry a city, so this is likely an attribution gap, not truly zero interest.';
    return 'Cities with strong product interest but no matched CRM deal:\n'+gap.map(c=>`• ${c.city}: ${fmtInt(c.pdp_views)} PDP views, 0 matched deals`).join('\n')+'\n\nCaveat: this may reflect the CRM\'s 15.9% city-coverage gap rather than true zero demand.';
  }
  if(/stock.*in ([a-z ]+)|stocked in/.test(ql)){
    const city = findCityInText(q);
    if(!city) return 'Which city? e.g. "Which products should be stocked in Surat?"';
    const rows = (STATE.D.RAW.products||[]).filter(p=>normCity(p.city)===city.city).sort(byDesc(r=>r.revenue)).slice(0,3);
    if(!rows.length) return `No product-level data for ${city.city} in the current filter.`;
    return `Top revenue combinations to stock in ${city.city}:\n`+rows.map(r=>`• ${r.product_type||'—'} / ${r.collection||'—'} / ${r.material_type||'—'} (${r.price_range||'—'}) — ${fmtMoney(r.revenue)}`).join('\n');
  }
  if(/campaign works best in|best campaign in/.test(ql)){
    const city = findCityInText(q);
    if(!city) return 'Which city? e.g. "Which campaign works best in Mumbai?"';
    const rows = filteredCampaigns().filter(r=>normCity(r.city)===city.city && n(r.sessions)>=30).map(r=>({...r,conv:safeDiv(n(r.purchase),n(r.sessions))*100})).sort(byDesc(r=>r.conv));
    if(!rows.length) return `No campaign with enough volume in ${city.city} in the current filter.`;
    const top = rows[0];
    return `Best-converting campaign in ${city.city}: ${top.source}/${top.medium}${top.campaign_name!=='(not set)'?'/'+top.campaign_name:''} at ${pct1(top.conv)} conversion on ${fmtInt(top.sessions)} sessions.`;
  }
  if(/why is ([a-z ]+) conversion falling|conversion falling/.test(ql)){
    const city = findCityInText(q);
    if(!city) return 'Which city? e.g. "Why is Delhi conversion falling?"';
    const dir = city.growthPct!=null && city.growthPct<0 ? `Sessions in ${city.city} are down ${pct1(Math.abs(city.growthPct))} — a smaller, likely more qualified audience can shift conversion in either direction; check whether a specific campaign/source declined.` : `${city.city}'s sessions aren't declining — check checkout funnel steps (ATC→Checkout→Purchase rates) on the Customer Behaviour page for a stage-specific leak instead.`;
    return `${city.city} conversion is currently ${pct1(city.conv)}. ${dir}`;
  }
  if(/next store|open our next|where should we open/.test(ql)){
    const scored = CITY.map(c=>({city:c.city, ...storeOpportunityScore(c,cityMax)})).sort(byDesc(s=>s.score));
    return `Top store-expansion candidate: ${scored[0].city} (score ${scored[0].score}/100, recommendation: ${scored[0].verdict}). Runner-up: ${scored[1]?scored[1].city+' (score '+scored[1].score+')':'—'}. See the Store Expansion page for the full ranking and the signals each score is missing.`;
  }
  if(/budget|marketing spend|more budget/.test(ql)){
    if(byGrowth[0]) return `${byGrowth[0].city} — sessions grew ${pct1(byGrowth[0].growthPct)} last 90 days vs the prior 90, and it's not yet the top-spend city by volume. Increasing budget there tends to compound existing momentum.`;
    return 'Not enough growth history in the current filter to recommend a city confidently.';
  }
  if(/pdp.*poor conversion|high pdp.*low conversion|high engagement.*low conversion/.test(ql)){
    const medConv = CITY.slice().sort(byAsc(c=>c.conv))[Math.floor(CITY.length/2)]?.conv||0;
    const gap = CITY.filter(c=>c.conv<medConv*0.6).sort(byDesc(c=>c.pdp_views))[0];
    return gap ? `${gap.city}: ${fmtInt(gap.pdp_views)} PDP views but only ${pct1(gap.conv)} conversion (median is ${pct1(medConv)}) — likely a checkout/follow-up issue, not a demand issue.` : 'No city currently shows this pattern in the filtered data.';
  }
  // fallback: try to find a named city and give a general profile
  const city = findCityInText(q);
  if(city) return `${city.city} profile: Revenue ${fmtMoney(city.revenue)}, Sessions ${fmtInt(city.sessions)}, Conversion ${pct1(city.conv)}, Growth ${city.growthPct!=null?pct1(city.growthPct):'—'}, Deals (city-known subset) ${city.deals}, Lead Quality ${city.leadQuality!=null?Math.round(city.leadQuality):'n/a'}.`;
  return `I can answer questions about city revenue/conversion/growth, store expansion, campaigns, products to stock, and generate summaries/action plans — try one of the suggested questions below, or name a specific city.`;
}

   Rendering below uses THIS app's own card/table/chart components (not the

const SP_CONFIG = {
  SNAPSHOT_URL: "https://storage.googleapis.com/lucira-dashboards/sales/latest.json",
  GST_DIVISOR: 1.03,
  MIN_ORDERS_TO_RANK: 3,
};
const SP_CITY_ALIAS = {
  'bangalore urban':'Bangalore','bangalore rural':'Bangalore','bengaluru':'Bangalore','bengaluru urban':'Bangalore','bengaluru rural':'Bangalore',
  'hadapsar pune':'Pune','pune division':'Pune','pune district':'Pune','pune city':'Pune',
  'mumbai suburban':'Mumbai','mumbai city':'Mumbai','greater mumbai':'Mumbai',
  'east delhi':'Delhi','west delhi':'Delhi','north delhi':'Delhi','south delhi':'Delhi','new delhi':'Delhi','delhi division':'Delhi','north west delhi':'Delhi','south west delhi':'Delhi',
  'gurugram':'Gurgaon',

function SP_canonicalCity(raw){ const c=(raw||'').trim(); if(!c) return null; return SP_CITY_ALIAS[c.toLowerCase()]||c; }
function SP_growth(cur,prev){ if(!prev) return cur>0?100:0; return (cur-prev)/Math.abs(prev)*100; }
function SP_distinct(items,f){ return new Set(items.map(f).filter(Boolean)).size; }
function SP_rank(arr,key){ return [...arr].sort((a,b)=>b[key]-a[key]); }

const SP_SAMPLE_CITIES=[
  {c:'Mumbai',w:26,base:1.35},{c:'Pune',w:20,base:1.15},{c:'Delhi',w:15,base:0.95},{c:'Bangalore',w:12,base:1.05},
  {c:'Hyderabad',w:8,base:0.8},{c:'Chennai',w:7,base:0.75},{c:'Kolkata',w:6,base:0.65},{c:'Ahmedabad',w:4,base:0.6},{c:'Jaipur',w:2,base:0.55},
];
const SP_SAMPLE_CATS=[{cat:'Rings',prods:['Solitaire Ring','Cocktail Ring','Eternity Band']},{cat:'Necklaces',prods:['Diamond Necklace','Gold Chain','Temple Necklace']},
  {cat:'Earrings',prods:['Stud Earrings','Jhumka','Drop Earrings']},{cat:'Bangles',prods:['Gold Bangle','Diamond Bangle']},{cat:'Pendants',prods:['Solitaire Pendant','Mangalsutra Pendant']}];
function SP_mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let SP_RNG = SP_mulberry32(20260722);
function SP_rnd(){ return SP_RNG(); }
function SP_pick(arr){ return arr[Math.floor(SP_rnd()*arr.length)]; }
function SP_pickW(arr,w){ let s=w.reduce((a,b)=>a+b,0)*SP_rnd(); for(let i=0;i<arr.length;i++){ s-=w[i]; if(s<=0) return arr[i]; } return arr[arr.length-1]; }
function SP_gauss(mean,sd){ let u=0,v=0; while(!u)u=SP_rnd(); while(!v)v=SP_rnd(); return mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function SP_ymd(d){ return d? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : null; }
function SP_addDays(d,nn){ const x=new Date(d); x.setDate(x.getDate()+nn); return x; }

function SP_buildSample(){
  SP_RNG = SP_mulberry32(20260722);
  const today=new Date('2026-07-27'); today.setHours(0,0,0,0);
  const N=420; const items=[]; let docn=500000;
  const custPool=[]; for(let i=0;i<1400;i++) custPool.push('SC-'+(70000+i));
  const custCity=new Map(); const custFirst=new Map(); const custOrders=new Map(); const custNet=new Map();
  for(let k=N-1;k>=0;k--){
    const d=SP_addDays(today,-k); const dk=SP_ymd(d); const dow=d.getDay(); const isWknd=(dow===0||dow===6);
    const seas=(1+0.15*Math.sin(k/29))*(isWknd?1.3:1)*(1+0.35*((N-k)/N));
    const nOrders=Math.max(0,Math.round(SP_gauss(9*seas,2.4)));
    for(let o=0;o<nOrders;o++){
      docn++; const cityDef=SP_pickW(SP_SAMPLE_CITIES,SP_SAMPLE_CITIES.map(x=>x.w));
      const cust=SP_pick(custPool); if(!custCity.has(cust)) custCity.set(cust,cityDef.c);
      const city=custCity.get(cust);
      const catDef=SP_pick(SP_SAMPLE_CATS); const prod=SP_pick(catDef.prods);
      const saleType=SP_pickW(['RTS','MTO','Return'],[62,32,6]);
      const doc='INV-'+docn;
      const baseVal=(cityDef.base)*SP_gauss(48000,16000);
      let gross=Math.max(3000,Math.round(baseVal)); if(saleType==='Return') gross=-Math.abs(gross)*0.6;
      const net=gross/SP_CONFIG.GST_DIVISOR; const discount=Math.round(Math.abs(gross)*SP_pickW([0,0.04,0.08,0.12],[45,25,20,10]));
      items.push({date:dk,document_no:doc,customer_id:cust,city,category:catDef.cat,product_name:prod,sale_type:saleType,qty:1,gross,net,discount});
      if(!custFirst.has(cust)||dk<custFirst.get(cust)) custFirst.set(cust,dk);
      custOrders.set(cust,(custOrders.get(cust)||0)+1); custNet.set(cust,(custNet.get(cust)||0)+net);
    }
  }
  const custRef=new Map(); custPool.forEach(c=>{ if(custFirst.has(c)) custRef.set(c,{customer_id:c,first_order_date:custFirst.get(c),lifetime_orders:custOrders.get(c)||0,lifetime_net:custNet.get(c)||0}); });
  return {items,custRef};
}

const SP_STATE = { allItems:[], custRef:new Map(), asOf:null, source:'sample', items:[], prevItems:[], cities:[], cov:null, loaded:false };
function SP_ingest(j, source){
  SP_STATE.source = source;
  const items = (j.items||[]).map(it=>({
    date:it.date, document_no:it.document_no, customer_id:it.customer_id,
    cityRaw:it.city||'', cityKey:SP_canonicalCity(it.city),
    category:it.category||'—', product_name:it.product_name||it.style||'—',
    sale_type:it.sale_type||'Other', qty:it.qty||0,
    gross:it.gross||0, net:(it.net!=null?it.net:(it.gross||0)/SP_CONFIG.GST_DIVISOR), discount:it.discount||0,
  })).filter(it=>it.date);
  SP_STATE.allItems = items;
  SP_STATE.custRef = new Map((j.customerRef||j.custRef||[]).map(c=>[c.customer_id,c]));
  let maxD=null,minD=null; items.forEach(it=>{ if(!maxD||it.date>maxD)maxD=it.date; if(!minD||it.date<minD)minD=it.date; });
  SP_STATE.asOf = j.asOf||maxD; SP_STATE.minDate = minD;
}
async function SP_loadData(){
  if(SP_CONFIG.SNAPSHOT_URL){
    try{
      const res = await fetch(SP_CONFIG.SNAPSHOT_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json(); if(j.error) throw new Error(j.detail||j.error);
      SP_ingest(j,'live'); SP_recompute(); SP_STATE.loaded = true;
      if(STATE.currentPage==='salesorders') renderActivePage();
      return;
    }catch(e){ console.warn('SP live snapshot unavailable, staying on sample:', e.message); }
  }
}
function SP_groupAgg(items, keyFn){
  const m = new Map();
  for(const it of items){ const k=keyFn(it); if(k==null||k==='') continue;
    let g=m.get(k); if(!g){ g={key:k,net:0,gross:0,units:0,orders:new Set(),cust:new Set(),ret:0}; m.set(k,g); }
    g.net+=it.net; g.gross+=it.gross; g.units+=Math.abs(it.qty); g.orders.add(it.document_no);
    if(it.customer_id) g.cust.add(it.customer_id); if(it.sale_type==='Return') g.ret++;
  }
  return [...m.values()].map(g=>({...g, orders:g.orders.size, customers:g.cust.size, aov:g.orders.size?g.net/g.orders.size:0}));
}
function SP_cityStats(){
  const prevMap = new Map(SP_groupAgg(SP_STATE.prevItems, i=>i.cityKey).map(g=>[g.key,g]));
  const curG = SP_groupAgg(SP_STATE.items, i=>i.cityKey);
  const cr = SP_STATE.custRef;
  let rows = curG.map(c=>{
    const p = prevMap.get(c.key); const g = p ? SP_growth(c.net,p.net) : (c.net>0?100:0);
    const cityItems = SP_STATE.items.filter(i=>i.cityKey===c.key);
    const custIds = new Set(cityItems.map(i=>i.customer_id));
    let repeat=0; custIds.forEach(id=>{ const r=cr.get(id); if(r&&r.lifetime_orders>1) repeat++; });
    const repPct = custIds.size? repeat/custIds.size*100 : 0;
    const topCategories = SP_rank(SP_groupAgg(cityItems,i=>i.category),'net').slice(0,3);
    const topProducts = SP_rank(SP_groupAgg(cityItems,i=>i.product_name),'net').slice(0,3);
    const retOrders = SP_distinct(cityItems.filter(i=>i.sale_type==='Return'), i=>i.document_no);
    const returnPct = c.orders? retOrders/c.orders*100 : 0;
    return {...c, g, repPct, repeatCustomers:repeat, returnPct, topCategories, topProducts};
  });
  rows = SP_rank(rows,'net');
  const mxNet = Math.max(1, ...rows.map(r=>r.net));
  rows.forEach(r=>{
    r.businessScore = Math.round(clamp((r.net/mxNet)*40 + clamp(r.g+20,0,40)/40*25 + clamp(r.repPct,0,60)/60*20 + (100-clamp(r.returnPct*5,0,100))/100*15, 0,100));
    r.opportunityScore = Math.round(clamp((r.net/mxNet)*50 + clamp(r.g,0,40)/40*50, 0,100));
    r.riskScore = Math.round(clamp(clamp(r.returnPct*6,0,60) + clamp(-r.g,0,40), 0,100));
  });
  return rows;
}
function SP_coverage(){
  const total = sumBy(SP_STATE.items,i=>i.net)||0; const mapped = sumBy(SP_STATE.items.filter(i=>i.cityKey),i=>i.net)||0;
  const totalOrders = SP_distinct(SP_STATE.items,i=>i.document_no); const mappedOrders = SP_distinct(SP_STATE.items.filter(i=>i.cityKey),i=>i.document_no);
  return {total, mapped, pct: total?clamp(mapped/total*100,0,100):0, totalOrders, mappedOrders, orderPct: totalOrders?clamp(mappedOrders/totalOrders*100,0,100):0};
}
function SP_citySeries(cityKey){
  const items = SP_STATE.allItems.filter(i=>i.cityKey===cityKey);
  const map = new Map();
  for(const it of items){ map.set(it.date, (map.get(it.date)||0)+it.net); }
  const keys = [...map.keys()].sort();
  return keys.map(k=>map.get(k));

function SP_recompute(){
  SP_STATE.items = SP_STATE.allItems; // no separate date window UI in the merged view — full snapshot, consistent with this app's own date filter living in the drawer
  SP_STATE.prevItems = [];
  SP_STATE.cities = SP_cityStats();
  SP_STATE.cov = SP_coverage();
}
function SP_ensureSample(){
  if(SP_STATE.allItems.length) return;
  const s = SP_buildSample();
  SP_ingest({items:s.items, customerRef:[...s.custRef.values()], asOf:s.items.length?s.items[s.items.length-1].date:SP_ymd(new Date('2026-07-27'))}, 'sample');
  SP_recompute();
}

PAGE_RENDERERS.salesorders = function(){
  SP_ensureSample();
  if(STATE.subRoute) return SP_renderCityDetail(STATE.subRoute);
  return SP_renderOverview();
};

    <span class="chip ${SP_STATE.source==='live'?'good':'warn'}">${SP_STATE.source==='live'?'● Live ERP snapshot':'○ Sample — reads lucira-dashboards/sales/latest.json'}</span></div>

  <div class="hint" style="margin-bottom:12px">ⓘ <b>Data coverage:</b> ${pct1(cov.pct)} of net revenue (${pct1(cov.orderPct)} of orders) carries a customer-derived city — the rest has no address city and is excluded from ranking, never guessed. This is a genuinely different, independently-sourced revenue number from the GA4-attributed revenue used elsewhere in this dashboard (real completed orders vs. online-session attribution) — the two won't match exactly, by design.</div>

  <div class="grid g4" style="margin-bottom:14px">
    ${kpiCardText('Cities Tracked', cities.length, '')}
    ${kpiCardText('Top City', top?top.key:'—', top?fmtMoney(top.net):'')}
    ${kpiCardText('Most Improved', mostImproved?mostImproved.key:'—', mostImproved?('+'+pct1(mostImproved.g)):'')}
    ${kpiCardText('Highest Risk', (highestRisk&&highestRisk.riskScore>=35)?highestRisk.key:'None', highestRisk?('risk '+highestRisk.riskScore+'/100'):'')}
  </div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card chart-card"><div class="hd"><h3>Top 5 by Business Score</h3></div>${barChart(SP_rank(cities,'businessScore').slice(0,5).map(c=>({label:c.key,value:c.businessScore})),{fmt:v=>v,color:'var(--good)'})}</div>
    <div class="card chart-card"><div class="hd"><h3>Bottom 5 by Business Score</h3></div>${barChart([...cities].sort((a,b)=>a.businessScore-b.businessScore).slice(0,5).map(c=>({label:c.key,value:c.businessScore})),{fmt:v=>v,color:'var(--crit)'})}</div>
  </div>

  <div class="card flush">
    <div style="padding:16px 17px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><h3 style="font-size:13.5px">City Leaderboard ${chartInfo('ERP City Leaderboard','Every city with a known customer address on completed orders, ranked by net revenue.','SUM(net) per customer-address city; Business/Opportunity/Risk = weighted composites of revenue share, growth, repeat rate and return rate','The most reliable revenue signal in this dashboard — actual completed orders, not attribution.','Business Score blends size+growth+loyalty+quality; Risk flags high returns or a negative trend.','Click a city to open its full profile.','','revenue','Sales Ops','Daily (once automated)')}</h3><div class="searchbox"><span>🔎</span><input placeholder="Search…" data-table="spTbl"></div></div>
    <div class="tbl-wrap" style="padding:12px 17px 17px">
      <table class="dt" id="spTbl"><thead><tr>
        <th>#</th><th>City</th><th>Revenue (Net)</th><th>Growth</th><th>Orders</th><th>Customers</th><th>Repeat %</th><th>AOV</th><th>Top Category</th><th>Biz Score</th><th>Opportunity</th><th>Risk</th>
      </tr></thead><tbody>
        ${shown.map((c,i)=>`<tr style="cursor:pointer" onclick="location.hash='#salesorders/'+encodeURIComponent('${esc(c.key).replace(/'/g,"\\'")}')">
          <td><span class="rankpill ${i<3?'top':''}">${i+1}</span></td>
          <td class="strong" style="color:var(--gold-2)">${esc(c.key)}</td>
          <td data-v="${c.net}" class="strong">${fmtMoney(c.net)}</td>
          <td data-v="${c.g}" style="color:${c.g>=0?'var(--good)':'var(--crit)'}">${c.g>=0?'+':''}${pct1(c.g)}</td>
          <td data-v="${c.orders}">${fmtInt(c.orders)}</td>
          <td data-v="${c.customers}">${fmtInt(c.customers)}</td>

    <div class="hint" style="padding:0 17px 16px">${hidden>0?`+${hidden} more localities with fewer than ${SP_CONFIG.MIN_ORDERS_TO_RANK} orders in this window — not shown individually, too little volume to rank meaningfully.`:''}</div>

}
function SP_renderCityDetail(cityKey){
  const cities = SP_STATE.cities; const c = cities.find(x=>x.key===cityKey);
  const crumb = `<div class="hint" style="margin-bottom:10px"><a href="#salesorders" style="color:var(--gold-2)">← All Cities</a> / <b>${esc(cityKey)}</b></div>`;
  if(!c) return crumb+`<div class="empty-note">No ERP order data for ${esc(cityKey)} in the current snapshot.</div>`;
  const rankIdx = cities.indexOf(c)+1;
  const series = SP_citySeries(cityKey);
  const GATED = [
    ['Web & App Behaviour (needs GA4)', ['Users','New/Returning Users','Sessions','PDP Views','Add to Cart','Checkout Starts','Conversion Rate'], 'See City Overview / Customer Behaviour pages for the GA4 version of these.'],
    ['CRM Pipeline (needs Zoho CRM)', ['Leads','Deals','Calls','Won/Lost Deals'], 'See City Overview / Sales Funnel pages for the Zoho version of these.'],
  ];
  return `
  ${crumb}
  <div class="sec-head"><div><h2>${esc(cityKey)}</h2><p>Rank #${rankIdx} of ${cities.length} by net ERP revenue. ${fmtMoney(c.net)} from ${fmtInt(c.orders)} orders and ${fmtInt(c.customers)} customers, ${c.g>=0?'growing':'declining'} ${pct1(Math.abs(c.g))} vs. the comparison period. ${c.repPct>=30?'Healthy repeat base at '+pct1(c.repPct)+'.':'Repeat rate is only '+pct1(c.repPct)+' — loyalty upside here.'}</p></div></div>

  <div class="grid g3" style="margin-bottom:14px">
    ${kpiCardText('Business Score', c.businessScore+'/100', '')}
    ${kpiCardText('Opportunity Score', c.opportunityScore+'/100', '')}
    ${kpiCardText('Risk Score', c.riskScore+'/100', c.riskScore>=50?'elevated returns and/or negative trend':'')}
  </div>

  <div class="grid g2">
    <div class="card">
      <h3 style="font-size:13.5px;margin-bottom:10px">Full Parameter Profile</h3>
      <table class="dt"><tbody>
        <tr><td>Revenue (Net)</td><td class="strong">${fmtMoney(c.net)}</td></tr>
        <tr><td>Orders</td><td>${fmtInt(c.orders)}</td></tr>
        <tr><td>AOV</td><td>${fmtMoney(c.aov)}</td></tr>
        <tr><td>Growth</td><td style="color:${c.g>=0?'var(--good)':'var(--crit)'}">${c.g>=0?'+':''}${pct1(c.g)}</td></tr>
        <tr><td>Active Customers</td><td>${fmtInt(c.customers)}</td></tr>
        <tr><td>Repeat Customers</td><td>${fmtInt(c.repeatCustomers)} (${pct1(c.repPct)})</td></tr>
        ${GATED.flatMap(([grp,fields])=>fields.map(f=>`<tr><td>${esc(f)}</td><td><span class="tagbadge warn">🔒 not available — ${esc(grp)}</span></td></tr>`)).join('')}
      </tbody></table>
    </div>
    <div class="card chart-card"><div class="hd"><h3>Revenue Trend (full history)</h3></div>${lineAreaChart([{label:'Net Revenue',color:'#d4af37',points:series.map((v,i)=>({x:String(i),y:v}))}],{area:true,fmt:fmtMoney})}</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card chart-card"><div class="hd"><h3>Top Products</h3></div>${c.topProducts.length?barChart(c.topProducts.map(p=>({label:p.key,value:p.net})),{fmt:fmtMoney,horizontal:true}):'<div class="empty-note">No product data.</div>'}</div>
    <div class="card chart-card"><div class="hd"><h3>Top Categories</h3></div>${c.topCategories.length?donutChart(c.topCategories.map((g,i)=>({label:g.key,value:g.net,color:PALETTE[i%PALETTE.length]})),{fmt:fmtMoney}):'<div class="empty-note">No category data.</div>'}
      <div class="legend">${c.topCategories.map((g,i)=>`<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(g.key)}</span>`).join('')}</div>
    </div>
  </div>
  `;
}

/* ============================== 90. EXPORTS ============================== */
function currentPageTable(){ return $('#pg-'+STATE.currentPage+' table.dt'); }
function tableToRows(table){
  const heads = $$('thead th', table).map(th=>th.textContent.trim());
  const rows = $$('tbody tr', table).filter(tr=>tr.style.display!=='none').map(tr=> $$('td',tr).map(td=>td.textContent.trim()));
  return {heads, rows};
}
function doExport(kind){
  if(kind==='pdf'){ window.print(); return; }
  if(kind==='png'){ toast('PNG export needs a rendering library (e.g. html2canvas) that is not wired yet — use PDF/Print for now.'); return; }
  const table = currentPageTable();
  if(!table){ toast('No table on this page to export — open a page with a data table.'); return; }
  const {heads, rows} = tableToRows(table);
  const fname = `lucira-geo-intel-${STATE.currentPage}-${(STATE.filters.dateRange&&STATE.filters.dateRange.end)||'export'}`;
  if(kind==='csv') downloadBlob(csvFromRows(heads,rows), fname+'.csv', 'text/csv');
  if(kind==='xls') downloadBlob(xlsFromRows(PAGE_META[STATE.currentPage].t, heads, rows), fname+'.xls', 'application/vnd.ms-excel');
  toast('Exported '+kind.toUpperCase());
}

/* ============================== 99. BOOT ============================== */
function initChrome(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  $('#themeBtn').textContent = STATE.theme==='dark' ? '☾' : '☀';
  $('#themeBtn').addEventListener('click', ()=>{
    STATE.theme = STATE.theme==='dark' ? 'light' : 'dark';
    localStorage.setItem('cityIntelTheme', STATE.theme);
    document.documentElement.setAttribute('data-theme', STATE.theme);
    $('#themeBtn').textContent = STATE.theme==='dark' ? '☾' : '☀';
  });
  $('#navCollapseBtn').addEventListener('click', ()=>{
    STATE.navCollapsed = !STATE.navCollapsed;
    $('#navEl').classList.toggle('collapsed', STATE.navCollapsed);
    $('#navCollapseBtn').textContent = STATE.navCollapsed ? '›' : '‹ Collapse';
  });
  $('#btnFilters').addEventListener('click', openDrawer);
  $('#dateRangeChip').addEventListener('click', openDrawer);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', closeDrawer);
  $('#btnApplyFilters').addEventListener('click', applyFiltersFromDrawer);
  $('#btnApplyFiltersTop').addEventListener('click', applyFiltersFromDrawer);
  $('#btnResetFilters').addEventListener('click', resetFilters);
  $('#btnExport').addEventListener('click', (e)=>{ e.stopPropagation(); $('#exportMenu').classList.toggle('on'); });
  $$('#exportMenu button').forEach(b=> b.addEventListener('click', ()=>{ doExport(b.dataset.x); $('#exportMenu').classList.remove('on'); }));
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.menu-wrap')) $('#exportMenu').classList.remove('on'); });
  $('#popClose').addEventListener('click', ()=> $('#popOverlay').classList.remove('on'));
  $('#popOverlay').addEventListener('click', (e)=>{ if(e.target.id==='popOverlay') $('#popOverlay').classList.remove('on'); });
  const dot = $('#srcDot');
  dot.classList.toggle('live', STATE.live);
  $('#srcDotLbl').textContent = STATE.live ? 'Live BigQuery snapshot' : 'Sample data';
  dot.setAttribute('data-tip', STATE.live ? `Snapshot generated ${new Date(STATE.D.RAW.meta.generated_at).toLocaleString()}<br>GA4 fact window: ${STATE.D.RAW.meta.ga4_fact_window?.min||''} → ${STATE.D.RAW.meta.ga4_fact_window?.max||''}` : 'window.GEO_INTEL_DATA not found — using a small built-in sample so the UI still renders. Run etl/build_geo_intel.ps1 to generate the real snapshot.');
}
function boot(){
  buildData();
  SP_ensureSample();
  renderNav();
  initChrome();
  onRoute();
  $('#loader').classList.add('done');
  $('#app').classList.add('ready');
  SP_loadData(); // fire-and-forget: sample already rendered; swaps to live + re-renders if reachable
}
function runSelfTest(){
  const results = [];
  for(const id in PAGE_RENDERERS){
    try{
      const html = PAGE_RENDERERS[id]();
      const undef = (html.match(/undefined/g)||[]).length;
      const nanc = (html.match(/NaN/g)||[]).length;
      results.push({id, ok:true, len:html.length, undef, nanc});
    }catch(err){
      results.push({id, ok:false, error: err.message, stack:(err.stack||'').split('\n').slice(0,4).join(' >> ')});
    }
  }
  let spDetailErr = null;
  try{
    SP_ensureSample();
    const html = SP_renderCityDetail(SP_STATE.cities[0] ? SP_STATE.cities[0].key : 'Mumbai');
    if((html.match(/undefined/g)||[]).length) spDetailErr = 'contains "undefined"';
  }catch(e){ spDetailErr = e.message; }
  const chatResults = [];
  for(const q of CHAT_SUGGESTIONS){
    try{ const a = answerQuestion(q); chatResults.push({q, ok:true, undef:(a.match(/undefined/g)||[]).length}); }
    catch(err){ chatResults.push({q, ok:false, error:err.message}); }
  }
  let filterErr = null, exportErr = null;
  try{ openDrawer(); closeDrawer(); }catch(e){ filterErr = e.message; }
  try{ const c = csvFromRows(['a','b'],[[1,2]]); if(!c) throw new Error('empty csv'); }catch(e){ exportErr = e.message; }
  const pre = document.createElement('pre');
  pre.id = 'selftestOut'; pre.style.cssText='position:fixed;top:0;left:0;background:#000;color:#0f0;font-size:11px;z-index:99999;padding:10px;max-width:100vw;overflow:auto;white-space:pre-wrap;max-height:100vh';
  pre.textContent = JSON.stringify({pages:results, chat:chatResults, filterErr, exportErr, spDetailErr}, null, 2);
  document.body.appendChild(pre);
}
document.addEventListener('DOMContentLoaded', ()=>{
  boot();
  if(new URLSearchParams(location.search).get('selftest')) runSelfTest();
});
</script>
