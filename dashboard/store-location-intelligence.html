<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Lucira · Store Location Intelligence</title>
<meta name="description" content="Lucira Store Location Intelligence & Campaign Demand — where should we open our next physical store, and why. Pincode-first digital demand vs real store coverage.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238b6f56'/%3E%3Ctext x='50' y='70' font-family='Georgia,serif' font-size='58' font-weight='700' text-anchor='middle' fill='%23fff8f0'%3EL%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gold:#d4af37; --gold-2:#f2d888; --gold-deep:#b8860b; --gold-soft:rgba(212,175,55,.14);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --info:#4d96ff;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.65);
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --brand-brown:#8b6f56; --brand-brown-dark:#6e5744; --brand-mauve:#a05a64; --brand-mauve-light:#d9b8b4; --brand-cream:#fff8f0;
}
html[data-theme=dark]{
  --bg:#08080a; --bg-2:#0d0d10; --surface:#141418; --surface-2:#1b1b21; --surface-3:#22222a;
  --glass:rgba(26,26,32,.62); --glass-brd:rgba(212,175,55,.16); --hair:rgba(255,255,255,.07);
  --ink:#f4f1ea; --ink-2:#b9b6ad; --muted:#7d7a72; --grid:rgba(255,255,255,.06); --axis:rgba(255,255,255,.14);
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(212,175,55,.10),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(43,120,214,.08),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  --good:#0ca30c; --warn:#fab219; --crit:#e66767;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
}
html[data-theme=light]{
  --bg:#efece5; --bg-2:#f6f4ef; --surface:#fcfcfb; --surface-2:#faf8f3; --surface-3:#f1ede3;
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(184,134,11,.22); --hair:rgba(20,15,5,.09);
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --grid:rgba(20,15,5,.08); --axis:rgba(20,15,5,.2);
  --gold:#b8860b; --gold-2:#c99a26;
  --sheen:radial-gradient(120% 120% at 0% 0%,rgba(184,134,11,.10),transparent 46%),radial-gradient(120% 120% at 100% 0%,rgba(43,120,214,.06),transparent 50%);
  --card-grad:linear-gradient(158deg,rgba(255,255,255,.9),rgba(250,247,240,.55));
  --shadow:0 18px 44px -22px rgba(80,60,10,.28);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;background-image:var(--sheen);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.2px;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;border:2px solid transparent;background-clip:content-box}
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s var(--ease),visibility .7s}
#loader.done{opacity:0;visibility:hidden;display:none}
.load-mark{width:100px;height:100px;position:relative;display:grid;place-items:center}
.load-mark svg{width:100%;height:100%}
.load-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--glass-brd);border-top-color:var(--gold);animation:spin 1.15s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-word{font-family:var(--serif);font-size:30px;letter-spacing:6px;color:var(--brand-mauve);padding-left:6px}
.load-sub{font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:4px}
.dotless{position:relative;display:inline-block;font-style:normal}
.dotless::before{content:'';position:absolute;top:-.6em;left:50%;width:4px;height:4px;background:var(--brand-mauve-light);transform:translateX(-50%) rotate(45deg)}
.load-bar{width:180px;height:2px;background:var(--hair);border-radius:2px;overflow:hidden}
.load-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.1s var(--ease) infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.brand{display:flex;align-items:center;gap:12px}
.brand .mono{width:36px;height:36px;border-radius:50%/42%;flex:0 0 auto;background:var(--brand-cream);border:1.5px solid var(--brand-mauve);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);position:relative}
.brand .mono svg{width:22px;height:22px}
.brand .mono::after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;background:var(--brand-mauve);transform:translateX(-50%) rotate(45deg)}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:3px;color:var(--brand-cream)}
.brand .wm span{font-size:8px;letter-spacing:3px;text-transform:uppercase;margin-top:3px;font-weight:600;color:rgba(255,248,240,.72)}
#app{opacity:0;transition:opacity .6s var(--ease)}
#app.ready{opacity:1}
header.top{position:relative;z-index:60;background:var(--brand-brown);border-bottom:2px solid var(--brand-brown-dark);padding:11px clamp(14px,3vw,30px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .spacer{flex:1}
.src-dot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--brand-cream);padding:5px 11px;border:1px solid rgba(255,255,255,.28);border-radius:20px;background:rgba(255,255,255,.12)}
.src-dot i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.src-dot.live i{background:var(--good);box-shadow:0 0 8px var(--good)}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);display:grid;place-items:center;color:var(--brand-cream);transition:.2s var(--ease);font-size:15px}
.iconbtn:hover{color:#fff;border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
.btn{padding:8px 15px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.2s var(--ease)}
.btn:hover{border-color:var(--glass-brd);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(120deg,var(--gold),var(--gold-deep));color:#160f00;border:none;font-weight:600;box-shadow:0 8px 20px -8px var(--gold-deep)}
nav.tabs{position:relative;z-index:55;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding:9px clamp(14px,3vw,30px);backdrop-filter:blur(18px);background:linear-gradient(180deg,var(--glass),transparent);border-bottom:1px solid var(--hair)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:10px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:.18s var(--ease);border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.active{color:var(--gold);background:var(--gold-soft);border-color:var(--glass-brd)}
main{padding:clamp(16px,3vw,30px);max-width:1560px;margin:0 auto}
.view{display:none;animation:fade .5s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.sec-head h2{font-size:clamp(20px,2.4vw,27px)}
.sec-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:80ch}
.eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600}
.card{background:var(--card-grad),var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-lg);backdrop-filter:blur(14px);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:16px}
.card>.pad{padding:18px}
.card .ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card .ct h3{font-size:15.5px;letter-spacing:.3px}
.card .ct .ct-r{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.card .ct .hint{font-size:11px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(4,1fr)}.g-5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1180px){.g-4,.g-5{grid-template-columns:repeat(3,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g-2,.g-3,.g-4,.g-5{grid-template-columns:1fr}}
.kpi{background:var(--card-grad),var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-md);padding:14px 15px 12px;position:relative;overflow:hidden;transition:.25s var(--ease)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.75}
.kpi:hover{transform:translateY(-3px);box-shadow:0 22px 44px -24px rgba(0,0,0,.7)}
.kpi.warn::before{background:var(--warn)}.kpi.crit::before{background:var(--crit)}.kpi.ok::before{background:var(--good)}
.kpi .lab{font-size:10.5px;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--serif);font-size:24px;font-weight:600;margin:5px 0 2px;letter-spacing:.3px;line-height:1}
.kpi .sub2{font-size:10.5px;color:var(--muted)}
.pill{font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-block}
.pill.g{color:var(--gold);border-color:var(--glass-brd);background:var(--gold-soft)}
.pill.ok{color:var(--good);border-color:rgba(12,163,12,.3);background:rgba(12,163,12,.1)}
.pill.bad{color:var(--crit);border-color:rgba(208,59,59,.3);background:rgba(208,59,59,.1)}
.pill.warn{color:var(--warn);border-color:rgba(250,178,25,.35);background:rgba(250,178,25,.12)}
select.inp,input.inp{background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;color:var(--ink);padding:7px 10px;font-size:12px;outline:none;transition:.15s;width:100%}
select.inp:focus,input.inp:focus{border-color:var(--gold)}
table.dt{width:100%;border-collapse:collapse;font-size:12.3px}
table.dt th{text-align:left;padding:9px 10px;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--hair);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.dt th.num,table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt th:hover{color:var(--ink-2)}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:var(--r-sm)}
.tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbl-tools input.inp{max-width:240px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:11.5px;color:var(--muted)}
.rank{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.rank.r1{background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));color:#160f00}
.rank.r2{background:linear-gradient(135deg,#e6e6ea,#a9adb5);color:#161616}
.rank.r3{background:linear-gradient(135deg,#e0a899,#b06a52);color:#160f00}
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.tip{position:fixed;z-index:200;background:var(--surface-3);border:1px solid var(--glass-brd);border-radius:9px;padding:8px 11px;font-size:11.5px;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow);max-width:280px;line-height:1.5}
.tip.on{opacity:1}
.info-btn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);font-size:10px;font-style:normal;font-family:Georgia,serif;line-height:1;cursor:pointer;user-select:none;transition:.16s;vertical-align:middle}
.info-btn:hover{color:var(--gold);border-color:var(--gold)}
.info-pop{position:fixed;z-index:240;width:min(400px,92vw);max-height:min(72vh,540px);overflow-y:auto;background:var(--surface);border:1px solid var(--glass-brd);border-radius:15px;box-shadow:0 20px 55px rgba(0,0,0,.55);padding:16px 17px;opacity:0;transform:translateY(7px) scale(.985);pointer-events:none;transition:opacity .19s,transform .19s}
.info-pop.on{opacity:1;transform:none;pointer-events:auto}
.info-pop h4{font-family:var(--serif);font-size:15px;margin:0 0 8px}
.info-pop .t{font-size:12px;color:var(--ink-2);line-height:1.6}
.insight{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--surface-2);margin-bottom:9px}
.insight .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:14px;background:var(--gold-soft);color:var(--gold)}
.insight.sev-warn .ic{background:rgba(250,178,25,.16);color:var(--warn)}
.insight.sev-crit .ic{background:rgba(208,59,59,.14);color:var(--crit)}
.insight p{font-size:12.3px;color:var(--ink-2);line-height:1.55}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters-row .fld{min-width:150px;flex:1}
.filters-row label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
.attr-tag{font-size:9.5px;padding:1px 7px;border-radius:8px;font-weight:700;letter-spacing:.3px}
.attr-tag.exact{background:rgba(12,163,12,.16);color:var(--good)}
.attr-tag.proxy{background:rgba(250,178,25,.18);color:var(--warn)}
/* Visually separates real, pincode/customer-exact columns from city-level estimate columns in any
   table -- so "why is this number tiny next to that huge one" reads as two different measurements,
   not a broken one. th gets a colored underline; td gets a faint tint of the same color. */
th.col-exact{box-shadow:inset 0 -2px 0 var(--good)}
td.col-exact{background:rgba(12,163,12,.05)}
th.col-proxy{box-shadow:inset 0 -2px 0 var(--warn)}
td.col-proxy{background:rgba(250,178,25,.05)}
.scroll-x{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700}
.badge.High{background:rgba(12,163,12,.16);color:var(--good)}
.badge.Medium{background:rgba(250,178,25,.18);color:var(--warn)}
.badge.Low{background:rgba(77,150,255,.16);color:var(--info)}
.badge.Watch{background:var(--surface-3);color:var(--muted)}
.badge.HIGH{background:rgba(208,59,59,.16);color:var(--crit)}
.badge.MEDIUM{background:rgba(250,178,25,.18);color:var(--warn)}
.badge.LOW{background:rgba(12,163,12,.14);color:var(--good)}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:12.5px}
details.cov{border:1px solid var(--hair);border-radius:var(--r-md);background:var(--surface-2);padding:12px 15px;margin-bottom:12px}
details.cov summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none}
details.cov summary::-webkit-details-marker{display:none}
details.cov summary::before{content:"▸ ";color:var(--gold)}
details.cov[open] summary::before{content:"▾ "}
details.cov .body{margin-top:10px;font-size:12.3px;color:var(--ink-2);line-height:1.65}
.reco-card{border:1px solid var(--hair);border-radius:var(--r-md);padding:16px;background:var(--card-grad),var(--glass);margin-bottom:12px}
.reco-card .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.reco-card .top h4{font-family:var(--sans);font-size:14.5px;font-weight:700;flex:1}
.reco-card .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 16px;font-size:11.8px;margin-bottom:10px}
.reco-card .kv b{color:var(--muted);font-weight:600;display:block;font-size:9.8px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.reco-card .reason{font-size:12.3px;color:var(--ink-2);border-top:1px dashed var(--hair);padding-top:9px;line-height:1.55}
#map-svg{width:100%;height:auto;background:var(--surface-2);border-radius:var(--r-md)}
@media print{header.top,nav.tabs,.no-print{display:none!important}.view{display:block!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

<div id="loader">
  <div class="load-mark"><div class="load-ring"></div><svg viewBox="0 0 100 100"><text x="50" y="72" font-family="Georgia,serif" font-size="66" font-weight="700" text-anchor="middle" fill="#a05a64">L</text></svg></div>
  <div><div class="load-word">Luc<span class="dotless">ı</span>rá</div><div class="load-sub">Store Location Intelligence</div></div>
  <div class="load-bar"><i></i></div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mono"><svg viewBox="0 0 100 100"><text x="50" y="68" font-family="Georgia,serif" font-size="62" font-weight="700" text-anchor="middle" fill="#8b6f56">L</text></svg></div>
      <div class="wm"><b>Luc<span class="dotless">ı</span>rá</b><span>Store Location Intel</span></div>
    </div>
    <div class="src-dot" id="srcDot"><i></i><span id="srcTxt">Loading…</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnTheme" title="Toggle theme">◐</button>
    <button class="iconbtn" id="btnPrint" title="Print / Save as PDF">⎙</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<div class="tip" id="tip"></div>
<div class="info-pop" id="infoPop"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   LUCIRA STORE LOCATION INTELLIGENCE & CAMPAIGN DEMAND — engine
   Source: etl/out/store_location_intel.json (built by
   etl/build_store_location_intel_v2.js from dashboard/sql/store_location_app_events_pull.sql +
   dashboard/sql/store_location_store_master.sql).
   GA4 (ga4_data.ga4_data) has ZERO dependency as of 2026-09-01 — every behavioral metric is
   sourced from test-webengage.11b56595a_shared.application_view_v1 (events, primary) and
   user_profile_view_v3 (profile Users count + pincode geo enrichment). PINCODE-FIRST: events with
   a valid mobile match to a real pincode are tagged 'pincode_exact'; everything else attached to a
   pincode row for context is a CITY-LEVEL PROXY from the SAME table (suffixed _cityProxy) — never
   presented as pincode-exact. See the Methodology and Data Quality tabs for the full disclosure.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  SNAPSHOT_URL: "https://storage.googleapis.com/lucira-dashboards/store-location/latest.json", // static snapshot — no live refresh pipeline yet, see Data Quality tab
  LOCAL_FALLBACK: "store_location_intel.json",
  // Pincode-Level Customer Intelligence — separate ~8.6MB snapshot, fetched lazily on first visit
  // to that tab only (not needed by any other tab, no reason to block initial page load on it).
  // Built by etl/build_pincode_customer_intelligence.js from the SQL in
  // dashboard/sql/pincode_customer_intelligence_pull.sql + _sales_pull.sql.
  PCI_URL: "pincode_customer_intelligence.json"
};

// Reuses the exact same city-alias table the merge script used to build D.cities (shipped in
// D.dataLineage.cityAliasMap), so a City-row drill-down matches the SAME pincodes that were
// summed into that city's totals -- not a separate, potentially-inconsistent text match.
function clientNormCity(s){
  if(!s) return '';
  const c = String(s).trim().toLowerCase();
  const aliases = (STATE.data && STATE.data.dataLineage && STATE.data.dataLineage.cityAliasMap) || {};
  return aliases[c] || c;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtInt(n){ return (n==null||isNaN(n))?'—':Math.round(n).toLocaleString('en-IN'); }
function fmtMoney(n){ return (n==null||isNaN(n))?'—':'₹'+Math.round(n).toLocaleString('en-IN'); }
function pctStr(x,dp){ return (x==null||isNaN(x)||!isFinite(x))?'—':x.toFixed(dp==null?1:dp)+'%'; }
function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; }
function downloadBlob(content,filename,mime){ if(mime==='text/csv' && content.charCodeAt(0)!==0xFEFF) content='﻿'+content;
  const blob=new Blob([content],{type:mime+';charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
function csvOf(rows){ return rows.map(r=>r.map(v=>{ v=(v==null?'':''+v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n'); }

async function loadData(){
  try{
    const res = await fetch(CONFIG.SNAPSHOT_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    STATE.data = j; STATE.source = 'live';
    return;
  }catch(e){
    console.warn('Public snapshot load failed, trying local fallback:', e.message);
  }
  try{
    const res = await fetch(CONFIG.LOCAL_FALLBACK, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    STATE.data = j; STATE.source = 'local';
  }catch(e){
    console.error('Local fallback load failed:', e.message);
    STATE.source = 'error';
  }
}

/* ── generic sortable/paginated/searchable table ─────────────────────── */
function renderTable(opts){
  // opts: {id, columns:[{key,label,num,fmt,attr}], rows, defaultSort, pageSize, csvName, searchKeys}
  const id = opts.id;
  if(!STATE.tableSort[id]) STATE.tableSort[id] = opts.defaultSort || {key:opts.columns[0].key, dir:-1};
  if(!STATE.tablePage[id]) STATE.tablePage[id] = 0;
  const pageSize = opts.pageSize || 25;
  return { html: tableShell(id, opts), mount: () => mountTable(id, opts, pageSize) };
}
function tableShell(id, opts){
  return `<div class="tbl-tools">
    <input class="inp" id="${id}-search" placeholder="Search…" style="max-width:220px">
    <span class="hint" id="${id}-count" style="font-size:11px;color:var(--muted)"></span>
    <span style="flex:1"></span>
    <button class="btn" id="${id}-csv">⬇ CSV</button>
  </div>
  <div class="tbl-wrap"><table class="dt" id="${id}-table">
    <thead><tr>${opts.columns.map(c=>`<th class="${c.num?'num':''} ${c.tone?'col-'+c.tone:''}" data-key="${c.key}">${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody id="${id}-tbody"></tbody>
  </table></div>
  <div class="pager" id="${id}-pager"></div>`;
}
function mountTable(id, opts, pageSize){
  const searchEl = document.getElementById(id+'-search');
  const csvBtn = document.getElementById(id+'-csv');
  const theadRow = document.querySelector('#'+id+'-table thead tr');
  theadRow.querySelectorAll('th').forEach(th=>{
    th.onclick = () => { const k=th.getAttribute('data-key'); const s=STATE.tableSort[id];
      s.dir = (s.key===k) ? -s.dir : -1; s.key=k; STATE.tablePage[id]=0; draw(); };
  });
  searchEl.oninput = () => { STATE.tablePage[id]=0; draw(); };
  csvBtn.onclick = () => {
    const rows = filteredSorted();
    const head = opts.columns.map(c=>c.label);
    const body = rows.map(r=>opts.columns.map(c=>r[c.key]==null?'':r[c.key]));
    downloadBlob(csvOf([head,...body]), (opts.csvName||id)+'.csv', 'text/csv');
  };
  function filteredSorted(){
    let rows = opts.rows;
    const q = (searchEl.value||'').toLowerCase().trim();
    if(q){ const keys = opts.searchKeys || opts.columns.map(c=>c.key);
      rows = rows.filter(r => keys.some(k => String(r[k]==null?'':r[k]).toLowerCase().includes(q))); }
    const s = STATE.tableSort[id];
    rows = [...rows].sort((a,b)=>{ const av=a[s.key], bv=b[s.key];
      if(av==null && bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
      if(typeof av==='number') return (av-bv)*s.dir; return String(av).localeCompare(String(bv))*s.dir; });
    return rows;
  }
  function draw(){
    const rows = filteredSorted();
    document.getElementById(id+'-count').textContent = rows.length.toLocaleString('en-IN')+' rows';
    const page = STATE.tablePage[id];
    const start = page*pageSize, slice = rows.slice(start, start+pageSize);
    const tbody = document.getElementById(id+'-tbody');
    tbody.innerHTML = slice.length ? slice.map(r => `<tr>${opts.columns.map(c=>{
      let v = r[c.key];
      let disp = c.fmt ? c.fmt(v, r) : (v==null ? '—' : v);
      return `<td class="${c.num?'num':''} ${c.tone?'col-'+c.tone:''}">${disp}</td>`;
    }).join('')}</tr>`).join('') : `<tr><td colspan="${opts.columns.length}"><div class="empty">No rows match.</div></td></tr>`;
    const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
    document.getElementById(id+'-pager').innerHTML = `
      <button class="btn" id="${id}-prev" ${page<=0?'disabled':''}>‹ Prev</button>
      <span>Page ${page+1} / ${totalPages}</span>
      <button class="btn" id="${id}-next" ${page>=totalPages-1?'disabled':''}>Next ›</button>`;
    const prevBtn=document.getElementById(id+'-prev'), nextBtn=document.getElementById(id+'-next');
    if(prevBtn) prevBtn.onclick=()=>{ if(STATE.tablePage[id]>0){ STATE.tablePage[id]--; draw(); } };
    if(nextBtn) nextBtn.onclick=()=>{ if(STATE.tablePage[id]<totalPages-1){ STATE.tablePage[id]++; draw(); } };
  }
  draw();
}

function drillToCompetitor(pincode){

}
// Generic global-filter applier so every tab's table respects the same State/City/Priority/Search
// controls. City matching is a case-insensitive, BIDIRECTIONAL substring check (not exact equality)
// because "City" text differs by source across this dashboard's own tables -- the filter dropdown's
// options come from real India-Post district names (e.g. "MUMBAI SUBURBAN"), while WebEngage's own
// city rollup uses free-text like "mumbai" -- exact equality would silently return zero rows for
// real matches. State matching is case-insensitive exact (state names are consistent enums here).
function applyGeoFilters(rows, opts){
  const F = STATE.filters; opts = opts||{};
  const norm = s => String(s||'').trim().toLowerCase();
  const fState = norm(F.state), fCity = norm(F.city), fQ = norm(F.q);
  return rows.filter(r=>{
    if(F.state && opts.stateKey && norm(r[opts.stateKey])!==fState) return false;
    if(F.city && opts.cityKey){ const rc=norm(r[opts.cityKey]); if(!(rc.includes(fCity)||fCity.includes(rc))) return false; }
    if(F.priority && opts.priorityKey && r[opts.priorityKey]!==F.priority) return false;
    if(F.q){
      const hay = [opts.pincodeKey&&r[opts.pincodeKey], opts.cityKey&&r[opts.cityKey], opts.stateKey&&r[opts.stateKey]]
        .filter(Boolean).map(norm).join(' ');
      if(!hay.includes(fQ)) return false;
    }
    return true;
  });
}

/* ── Date Range filter -- real WebEngage application_view_v1 daily data, Executive + Campaign
   tabs only ──────────────────────────────────────────────────────────────────────────────────
   user_profile_view_v3 is a profile snapshot, not a session log -- it has no per-day breakdown,
   so this filter never touches WebEngage-PROFILE-native fields (Users, Campaign Users profile,
   Opportunity Score, Priority). City/State/Pincode/Product/Price-Band/Store-Gap/Recommendation
   tabs stay all-time -- date-ranging those would need the same city-text matching the all-time
   numbers already use, re-derived per arbitrary date range, which is real complexity not yet
   built -- ask if that's wanted. */
function dateBoundsFromPreset(){
  const F = STATE.filters; const maxDate = STATE.data.meta.dailyDateRange.max;
  if(!F.dateRange || F.dateRange==='all') return null;
  if(F.dateRange==='custom') return (F.dateFrom && F.dateTo) ? {from:F.dateFrom, to:F.dateTo} : null;
  const days = {'7d':7,'30d':30,'90d':90,'180d':180}[F.dateRange] || 30;
  const to = new Date(maxDate+'T00:00:00');
  const from = new Date(to); from.setDate(from.getDate()-(days-1));
  const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return {from: ymd(from), to: ymd(to)};
}
function sumDailyCityInRange(bounds){
  const t = {pdpViews:0,addToCart:0,checkout:0,purchase:0,totalEvents:0};
  STATE.data.dailyCity.forEach(r=>{ if(!bounds || (r.date>=bounds.from && r.date<=bounds.to)){
    t.pdpViews+=r.pdpViews; t.addToCart+=r.addToCart; t.checkout+=r.checkout; t.purchase+=r.purchase; t.totalEvents+=r.totalEvents; } });
  return t;
}
function dailyCampaignSumsInRange(bounds){
  const m = new Map();
  STATE.data.dailyCampaign.forEach(r=>{ if(!bounds || (r.date>=bounds.from && r.date<=bounds.to)){
    const cur = m.get(r.campaignKey) || {pdpViews:0,addToCart:0,checkout:0,purchase:0,totalEvents:0};
    cur.pdpViews+=r.pdpViews; cur.addToCart+=r.addToCart; cur.checkout+=r.checkout; cur.purchase+=r.purchase; cur.totalEvents+=r.totalEvents;
    m.set(r.campaignKey, cur);
  }});
  return m;
}
function renderDateFilter(){
  const F = STATE.filters; const dr = STATE.data.meta.dailyDateRange;
  const opts = [['all','All time'],['7d','Last 7 days'],['30d','Last 30 days'],['90d','Last 90 days'],['180d','Last 180 days'],['custom','Custom range']];

      <select class="inp" id="f-daterange">${opts.map(([v,l])=>`<option value="${v}" ${F.dateRange===v?'selected':''}>${l}</option>`).join('')}</select>

}
function mountDateFilter(){
  const dre = document.getElementById('f-daterange'), fe = document.getElementById('f-datefrom'), te = document.getElementById('f-dateto');
  if(dre) dre.onchange = () => { STATE.filters.dateRange = dre.value; render(); };

// City-proxy WebEngage values are identical for every pincode sharing the same district (by
// construction -- see build_store_location_intel_v2.js). Summing across pincode rows without deduping would
// double/triple/N-count a city's total once per real pincode inside it (471 of 586 districts have
// >1 real pincode, up to 40) -- always dedupe by district FIRST. Shared by the Executive KPIs and
// the Business Q&A tab so both report the same real number.
// Sums the (City Est.) columns straight across every real pincode, no de-dup needed. Each pincode
// now carries its own ALLOCATED SHARE of its city's total (weighted by that pincode's share of the
// city's real profile Users -- see build_store_location_intel_v2.js) rather than the city's full
// total repeated on every row, so summing all pincodes reconstructs the real city total exactly.
// (Named cityDedupTotals for backward-compat with existing call sites -- no dedup happens anymore.)
function cityDedupTotals(pincodesArr){
  const t = {pdp:0,atc:0,checkout:0,purchase:0,revenue:0};
  pincodesArr.forEach(p=>{
    t.pdp+=p.pdpViews_cityProxy||0; t.atc+=p.addToCart_cityProxy||0; t.checkout+=p.checkout_cityProxy||0;
    t.purchase+=p.purchase_cityProxy||0; t.revenue+=p.revenue_cityProxy||0; });
  return t;
}

let PENDING_MOUNTS = [];
function tabExec(){
  const D = STATE.data; const pc = filteredPincodes();
  const dateBounds = dateBoundsFromPreset();
  // When a date range is active, the totals below come from real DAILY application_view_v1 data
  // (Top 80 cities, national sum) instead of the all-time per-pincode city-proxy dedup -- see
  // dateBoundsFromPreset() header comment for why City/State/Pincode-level rows don't get this
  // same date-ranging yet.
  const dedup = dateBounds ? sumDailyCityInRange(dateBounds) : cityDedupTotals(pc);
  const totalPdp = dateBounds?dedup.pdpViews:dedup.pdp, totalAtc = dateBounds?dedup.addToCart:dedup.atc,
    totalCheckout = dedup.checkout, totalPurchase = dedup.purchase;

  return `<div class="card"><div class="pad">

function tabMap(){
  const D = STATE.data; const pc = filteredPincodes();
  const LAT_MIN=6, LAT_MAX=38, LON_MIN=68, LON_MAX=98, W=980, H=980*(LAT_MAX-LAT_MIN)/(LON_MAX-LON_MIN);
  const x = lon => ((lon-LON_MIN)/(LON_MAX-LON_MIN))*W;
  const y = lat => ((LAT_MAX-lat)/(LAT_MAX-LAT_MIN))*H;
  const flagColor = f => f==='EXISTING STORE' ? 'var(--info)' : f==='HIGH OPPORTUNITY' ? 'var(--good)' : f==='MEDIUM OPPORTUNITY' ? 'var(--warn)' : 'var(--muted)';
  const withGeo = pc.filter(p=>p.lat && p.lon);
  const maxSessions = Math.max(1, ...withGeo.map(p=>p.sessions_exact||0));
  const rFor = s => 3 + Math.sqrt((s||0)/maxSessions)*16; // area-proportional, min 3px so zero-session pincodes are still visible
  const pincodeDots = withGeo.map(p=>{
    const tip = `<b>${esc(p.pincode)}</b> · ${esc(p.district)}, ${esc(p.state)}<br>Unique Customers: ${fmtInt(p.uniqueCustomers_exact)} · Sessions: ${fmtInt(p.sessions_exact)}<br>PDP: ${fmtInt(p.pdpViews_exact)} · Opportunity: ${p.scores.opportunityScore.toFixed(1)} · ${esc(p.opportunityFlag)}`;
    return `<circle class="map-pin" data-pincode="${esc(p.pincode)}" cx="${x(p.lon).toFixed(1)}" cy="${y(p.lat).toFixed(1)}" r="${rFor(p.sessions_exact).toFixed(1)}" fill="${flagColor(p.opportunityFlag)}" fill-opacity="${p.sessions_exact>0?0.85:0.35}" stroke="var(--bg)" stroke-width="0.6" data-tip="${tip.replace(/"/g,'&quot;')}" style="cursor:pointer"></circle>`;
  }).join('');
  const storeDots = (D.stores||[]).filter(s=>s.lat&&s.lon).map(s=>
    `<path class="map-store" transform="translate(${x(s.lon).toFixed(1)},${y(s.lat).toFixed(1)}) rotate(45)" d="M-7,-7 L7,-7 L7,7 L-7,7 Z" fill="var(--gold)" stroke="var(--bg)" stroke-width="1" data-tip="<b>${esc(s.storeName)}</b><br>${esc(s.address||'')}" style="cursor:pointer"></path>`
  ).join('');
  // Competitor markers -- matched by pincode, so plotted at that pincode's own lat/lon (no separate
  // store-address geocoding exists for these). Small triangles, distinct colors per brand.
  const tanishqDots = withGeo.filter(p=>p.tanishqStoreCount>0).map(p=>
    `<path class="map-competitor" transform="translate(${x(p.lon).toFixed(1)},${(y(p.lat)-6).toFixed(1)})" d="M0,-5 L5,4 L-5,4 Z" fill="#c0392b" stroke="var(--bg)" stroke-width="0.8" data-tip="<b>Tanishq</b> · ${p.tanishqStoreCount} store(s) in ${esc(p.pincode)}<br>${p.tanishqStores.slice(0,3).map(esc).join('<br>')}" style="cursor:default"></path>`
  ).join('');
  const caratlaneDots = withGeo.filter(p=>p.caratlaneStoreCount>0).map(p=>
    `<path class="map-competitor" transform="translate(${x(p.lon).toFixed(1)},${(y(p.lat)+6).toFixed(1)})" d="M0,5 L5,-4 L-5,-4 Z" fill="#2980b9" stroke="var(--bg)" stroke-width="0.8" data-tip="<b>CaratLane</b> · ${p.caratlaneStoreCount} store(s) in ${esc(p.pincode)}<br>${p.caratlaneStores.slice(0,3).map(esc).join('<br>')}" style="cursor:default"></path>`
  ).join('');
  const sessionCount = withGeo.filter(p=>p.sessions_exact>0).length;
  const tanishqCount = withGeo.filter(p=>p.tanishqStoreCount>0).length, caratlaneCount = withGeo.filter(p=>p.caratlaneStoreCount>0).length;
  PENDING_MOUNTS.push(() => {
    document.getElementById('map-svg').addEventListener('click', e=>{
      const c = e.target.closest('.map-pin'); if(!c) return; drillToCustomers(c.getAttribute('data-pincode'));
    });
  });
  return secHead('Map','Real Pincodes by Location — Bubble Size = Real Sessions, Color = Opportunity Flag', `${fmtInt(withGeo.length)} real pincodes plotted at their real lat/lon (India Post master). ${fmtInt(sessionCount)} have real, mobile-matched sessions (bubble size); the rest show as small dots for geographic context. Gold diamonds are the ${(D.stores||[]).length} real existing stores. ${fmtInt(tanishqCount)} pincodes have a real Tanishq store (red triangle), ${fmtInt(caratlaneCount)} have a real CaratLane store (blue triangle) — one-time public capture, not live, see Data Quality. Click a pincode bubble to see its customers.`) +
    renderGlobalFilters() +
    card('India Map', `
      <div class="legend" style="margin-bottom:10px">
        <span><i style="background:var(--info);border-radius:50%"></i> Existing Store nearby</span>
        <span><i style="background:var(--good);border-radius:50%"></i> High Opportunity</span>
        <span><i style="background:var(--warn);border-radius:50%"></i> Medium Opportunity</span>
        <span><i style="background:var(--muted);border-radius:50%"></i> Low Opportunity</span>
        <span><i style="background:var(--gold);transform:rotate(45deg)"></i> Real Store</span>
        <span><i style="background:#c0392b;clip-path:polygon(50% 0,100% 100%,0 100%)"></i> Tanishq</span>
        <span><i style="background:#2980b9;clip-path:polygon(50% 0,100% 100%,0 100%)"></i> CaratLane</span>
      </div>
      <svg id="map-svg" viewBox="0 0 ${W} ${H.toFixed(0)}" style="max-height:74vh">${pincodeDots}${tanishqDots}${caratlaneDots}${storeDots}</svg>
    `);
}

/* ══════════════════════════════════════════════════════════════════════
   Pincode-Level Customer Intelligence — new section (spec-driven build).
   Sources: application_view_v1 + user_profile_view_v3 (WebEngage, joined on
   normalized_cuid = RIGHT(TRIM(CAST(cuid AS STRING)),10) -- a MANDATED, looser rule than the
   regex-validated mobile normalization the rest of this dashboard uses, kept deliberately
   separate) + india_pincode/pincode_geo_lookup (real pincode master) + store_location_store_master
   + marketing_sale (matched via normalized Cus_mobile against the same key space) + company.
   Snapshot built by etl/build_pincode_customer_intelligence.js, fetched lazily below (separate
   ~8.6MB file, not needed by any other tab). See PCI.data.dataQuality for every validation number
   in spec Section 12 -- rendered in the Data Quality card at the bottom of this tab, not hidden.
   ══════════════════════════════════════════════════════════════════════ */
const PCI = {
  data: null, status: 'idle', error: null,
  filters: { state:'', city:'', pincode:'', q:'', campaign:'', channel:'', category:'', company:'', onlyActivity:false, dateFrom:'', dateTo:'' },
  focusPincode: null
};
async function loadPCI(){
  if (PCI.status === 'loading' || PCI.status === 'loaded') return;
  PCI.status = 'loading';
  try{
    const res = await fetch(CONFIG.PCI_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    PCI.data = await res.json();
    PCI.status = 'loaded';
  }catch(e){
    PCI.status = 'error'; PCI.error = e.message;
  }
  render();
}
function pciNorm(s){ return String(s||'').trim().toLowerCase(); }
function pciFiltersActive(){
  const f = PCI.filters;
  return !!(f.state||f.city||f.pincode||f.q||f.campaign||f.channel||f.category||f.company||f.onlyActivity||f.dateFrom||f.dateTo);
}
// Applies every active filter to the SHIPPED customer-level array (real-pincode customers only --
// see dataQuality.customersOmittedUnknownBucket for why the 211k "no matched pincode" customers
// aren't individually filterable; they ARE included in the unfiltered headline KPIs below, which
// come straight from the build script's own totals, not a client-side recompute).
function pciFilteredCustomers(){
  const D = PCI.data; const f = PCI.filters;
  return D.customers.filter(c=>{
    if(f.state && pciNorm(c.state)!==pciNorm(f.state)) return false;
    if(f.city && !pciNorm(c.city).includes(pciNorm(f.city))) return false;
    if(f.pincode && c.pincode!==f.pincode) return false;
    if(f.campaign && pciNorm(c.campaignId)!==pciNorm(f.campaign)) return false;
    if(f.channel && !pciNorm(c.channels).includes(pciNorm(f.channel))) return false;
    if(f.category && !pciNorm(c.productCategories).includes(pciNorm(f.category))) return false;
    if(f.company && !pciNorm(c.companyCodes).includes(pciNorm(f.company))) return false;
    if(f.onlyActivity && !(c.pdpViews||c.atcEvents||c.checkoutEvents||c.orderEvents||c.salesOrders)) return false;
    if(f.q){
      const hay = `${c.pincode} ${c.city||''} ${c.fullName||''} ${c.normalizedCuid}`.toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    if(f.dateFrom || f.dateTo){
      const last = c.lastActivity || c.lastOrderDate;
      if(!last) return false;
      const d = String(last).slice(0,10);
      if(f.dateFrom && d < f.dateFrom) return false;
      if(f.dateTo && d > f.dateTo) return false;
    }
    return true;
  });
}
// Re-derives the pincode-level rollup from a (possibly filtered) customer set -- same formulas as
// the build script's Layer E, so a filtered view and the unfiltered snapshot are always consistent.
function pciAggregateByPincode(customers, geoByPincode){
  const byPin = new Map();
  customers.forEach(c=>{ if(!byPin.has(c.pincode)) byPin.set(c.pincode, []); byPin.get(c.pincode).push(c); });
  const rows = [];
  byPin.forEach((custs, pin)=>{
    const geo = geoByPincode.get(pin) || {};
    const sum = k => custs.reduce((s,c)=>s+(c[k]||0),0);
    const uniq = k => custs.filter(c=>c[k]>0).length;
    const totalPdp=sum('pdpViews'), totalAtc=sum('atcEvents'), totalCheckout=sum('checkoutEvents'), totalOrderEvt=sum('orderEvents');
    const salesCust = custs.filter(c=>c.hasSale);
    const totalNetSales = sum('netSales');
    rows.push({
      pincode: pin, district: geo.district||null, state: geo.state||null,
      uniqueCustomers: custs.length,
      totalPdpViews: totalPdp, uniquePdpCustomers: uniq('pdpViews'),
      totalAtc: totalAtc, uniqueAtcCustomers: uniq('atcEvents'),
      totalCheckout: totalCheckout, uniqueCheckoutCustomers: uniq('checkoutEvents'),
      totalOrderEvents: totalOrderEvt, uniqueOrderEventCustomers: uniq('orderEvents'),
      salesOrders: sum('salesOrders'), uniqueSalesCustomers: salesCust.length,
      netSales: Math.round(totalNetSales*100)/100,
      avgSalesPerCustomer: salesCust.length ? Math.round((totalNetSales/salesCust.length)*100)/100 : null,
      pdpToAtcPct: totalPdp>0 ? Math.round((totalAtc/totalPdp)*1000)/10 : null,
      atcToCheckoutPct: totalAtc>0 ? Math.round((totalCheckout/totalAtc)*1000)/10 : null,
      checkoutToOrderPct: totalCheckout>0 ? Math.round((totalOrderEvt/totalCheckout)*1000)/10 : null,
    });
  });
  return rows;
}
function pciKpisFromCustomers(customers){
  return {
    totalUniqueCustomers: customers.length,
    totalPincodes: new Set(customers.map(c=>c.pincode)).size,
    totalPdpViews: customers.reduce((s,c)=>s+c.pdpViews,0),
    totalUniquePdpCustomers: customers.filter(c=>c.pdpViews>0).length,
    totalAtc: customers.reduce((s,c)=>s+c.atcEvents,0),
    totalUniqueAtcCustomers: customers.filter(c=>c.atcEvents>0).length,
    totalCheckout: customers.reduce((s,c)=>s+c.checkoutEvents,0),
    totalUniqueCheckoutCustomers: customers.filter(c=>c.checkoutEvents>0).length,
    totalOrderEvents: customers.reduce((s,c)=>s+c.orderEvents,0),
    totalUniqueOrderEventCustomers: customers.filter(c=>c.orderEvents>0).length,
    totalSalesOrders: customers.reduce((s,c)=>s+c.salesOrders,0),
    totalUniqueSalesCustomers: customers.filter(c=>c.hasSale).length,
    totalNetSales: Math.round(customers.reduce((s,c)=>s+c.netSales,0)*100)/100,
  };
}

function pciFunnelChart(k){
  const steps = [
    ['Unique Customers', k.totalUniqueCustomers, null],
    ['PDP Views (customers)', k.totalUniquePdpCustomers, k.totalUniqueCustomers],
    ['Add to Cart (customers)', k.totalUniqueAtcCustomers, k.totalUniquePdpCustomers],
    ['Checkout (customers)', k.totalUniqueCheckoutCustomers, k.totalUniqueAtcCustomers],
    ['Order Event (customers)', k.totalUniqueOrderEventCustomers, k.totalUniqueCheckoutCustomers],
  ];
  const max = Math.max(1, ...steps.map(s=>s[1]));
  return steps.map(([label,val,prev])=>{
    const pct = Math.max(2,(val/max)*100);

    return `<div style="margin:8px 0">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:3px">
        <span>${esc(label)}</span><span>${fmtInt(val)} ${conv?`<span style="color:var(--muted)">(${conv} of prior step)</span>`:''}</span>
      </div>
      <div style="background:var(--surface-3);border-radius:5px;height:18px;overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold-deep))"></div></div>
    </div>`;
  }).join('');
}
function pciScatterSvg(pincodeRows){
  const rows = pincodeRows.filter(p=>p.uniqueCustomers>0).slice(0,80);
  if(!rows.length) return '<p style="font-size:11px;color:var(--muted)">No pincode rows to plot.</p>';
  const W=560,H=220,PAD=36;
  const maxX = Math.max(1,...rows.map(r=>r.uniqueCustomers));
  const maxY = Math.max(1,...rows.map(r=>r.netSales||0));
  const x = v => PAD + (v/maxX)*(W-PAD*1.5);
  const y = v => H-PAD - (v/(maxY||1))*(H-PAD*1.5);
  const pts = rows.map(r=>`<circle cx="${x(r.uniqueCustomers).toFixed(1)}" cy="${y(r.netSales||0).toFixed(1)}" r="4" fill="var(--gold)" fill-opacity="0.75" data-tip="<b>${esc(r.pincode)}</b><br>${fmtInt(r.uniqueCustomers)} customers<br>${fmtMoney(r.netSales||0)} sales"></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:240px">
    <line x1="${PAD}" y1="${H-PAD}" x2="${W-8}" y2="${H-PAD}" stroke="var(--hair)"/>
    <line x1="${PAD}" y1="${H-PAD}" x2="${PAD}" y2="10" stroke="var(--hair)"/>
    <text x="${PAD}" y="${H-10}" font-size="9.5" fill="var(--muted)">0</text>
    <text x="${W-40}" y="${H-10}" font-size="9.5" fill="var(--muted)">${fmtInt(maxX)} customers</text>
    <text x="4" y="18" font-size="9.5" fill="var(--muted)">${fmtMoney(maxY)}</text>
    ${pts}
  </svg>`;
}

      {key:'netSales',label:'Sales Amount',num:1,fmt:v=>v?fmtMoney(v):'—'},
      {key:'firstActivity',label:'First Activity',fmt:v=>v?String(v).slice(0,10):'—'},
      {key:'lastActivity',label:'Last Activity',fmt:v=>v?String(v).slice(0,10):'—'},
    ];
    const dt = renderTable({id:'pci-drill-tbl', columns:dcols, rows:custs, defaultSort:{key:'pdpViews',dir:-1}, csvName:'pincode_'+PCI.focusPincode+'_customers', pageSize:20, searchKeys:['normalizedCuid','fullName','city']});
    PENDING_MOUNTS.push(()=>dt.mount());
    drill = card(`Customers in Pincode ${esc(PCI.focusPincode)} (${custs.length.toLocaleString('en-IN')})`, dt.html, {hint:'Click a different pincode to switch'});
  }

  PENDING_MOUNTS.push(() => { t.mount();
    document.getElementById('pci-tbl-tbody').addEventListener('click', e=>{
      const a = e.target.closest('a.pci-drill'); if(!a) return; e.preventDefault(); pciDrillToPincode(a.getAttribute('data-pincode'));
    });
    mountPciFilters();
  });

  const top = (key) => [...pincodeRows].sort((a,b)=>(b[key]||0)-(a[key]||0)).slice(0,10);
  const dq = D.dataQuality;

  return secHead('Pincode-Level Customer Intelligence','Pincode Par Kitne Unique Customers — Aur Unhone Kitne PDP Views, ATC, Checkout Aur Orders Kiye', `
    Customer identity here is <b>normalized_cuid = RIGHT(TRIM(CAST(cuid AS STRING)),10)</b> — a
    looser, spec-mandated rule (not the regex-validated mobile check used elsewhere in this
    dashboard), joined across <code>application_view_v1</code> (events) and
    <code>user_profile_view_v3</code> (pincode/profile), with <code>marketing_sale</code> matched
    in separately via normalized <code>Cus_mobile</code>. Of ${fmtInt(dq.distinctNormCuidCustomers)}
    distinct customers, only ${fmtInt(dq.customersWithRealPincode)} (${pctStr(dq.customersWithRealPincode/dq.distinctNormCuidCustomers*100,1)})
    sit on a pincode that matches the real India Post master — the rest appear in the
    <span class="pill warn">UNKNOWN pincode</span> bucket below, included in every headline KPI,
    never dropped. ${filtersOn ? '<b>Filters are active — KPIs and the table below reflect the filtered, known-pincode customer set only (the KPI cards show the true unfiltered totals when no filter is set).</b>' : ''}
  `) +
    card('Filters', renderPciFilters()) +
    `<div class="grid g-4" style="margin-bottom:16px">
      ${kpi('Total Unique Customers', fmtInt(k.totalUniqueCustomers))}
      ${kpi('Total Pincodes', fmtInt(k.totalPincodes))}
      ${kpi('Total PDP Views', fmtInt(k.totalPdpViews))}
      ${kpi('Unique PDP Customers', fmtInt(k.totalUniquePdpCustomers))}
      ${kpi('Total ATC', fmtInt(k.totalAtc))}
      ${kpi('Unique ATC Customers', fmtInt(k.totalUniqueAtcCustomers))}
      ${kpi('Total Checkout', fmtInt(k.totalCheckout))}
      ${kpi('Unique Checkout Customers', fmtInt(k.totalUniqueCheckoutCustomers))}
      ${kpi('Order Events (WebEngage)', fmtInt(k.totalOrderEvents))}
      ${kpi('Unique Order-Event Customers', fmtInt(k.totalUniqueOrderEventCustomers))}
      ${kpi('Sales Orders (real, marketing_sale)', fmtInt(k.totalSalesOrders), null, 'ok')}
      ${kpi('Total Sales (real)', fmtMoney(k.totalNetSales), null, 'ok')}
    </div>` +
    drill +
    card('Pincode-Level Table', t.html, {hint:'Click a Pincode to see its customers below · sortable · searchable · CSV export'}) +
    `<div class="grid g-2" style="margin-bottom:16px">
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by Unique Customers', top('uniqueCustomers'), 'uniqueCustomers', r=>r.pincode, fmtInt)}</div></div>
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by PDP Views', top('totalPdpViews'), 'totalPdpViews', r=>r.pincode, fmtInt, 'var(--info)')}</div></div>
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by Add to Cart', top('totalAtc'), 'totalAtc', r=>r.pincode, fmtInt, 'var(--warn)')}</div></div>
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by Checkout', top('totalCheckout'), 'totalCheckout', r=>r.pincode, fmtInt, 'var(--good)')}</div></div>
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by Sales Orders', top('salesOrders'), 'salesOrders', r=>r.pincode, fmtInt, 'var(--gold-deep)')}</div></div>
      <div class="card"><div class="pad">${pciBarChart('Top Pincodes by Sales Amount', top('netSales'), 'netSales', r=>r.pincode, fmtMoney, 'var(--gold-deep)')}</div></div>
    </div>` +
    card('Customer Funnel (unique customers at each step, national)', pciFunnelChart(k)) +
    card('Customer Count vs. Sales — Top 80 Active Pincodes', pciScatterSvg(pincodeRows), {hint:'Each dot = one pincode; x = unique customers, y = sales amount'}) +
    card('Data Validation (Section 12)', `<div class="grid g-4">
      ${kpi('Distinct Normalized CUIDs — Events', fmtInt(dq.eventRowsPulled))}
      ${kpi('Distinct Normalized CUIDs — Profile', fmtInt(dq.profileRowsPulled))}
      ${kpi('Distinct Customers (union)', fmtInt(dq.distinctNormCuidCustomers))}
      ${kpi('Malformed/Rejected CUIDs', fmtInt(dq.malformedNormCuidProfile+dq.malformedNormCuidEvent+dq.malformedNormMobileSales), 'e.g. source-corrupted scientific-notation cuid values — excluded, not guessed', 'warn')}
      ${kpi('Customers — Real Pincode', fmtInt(dq.customersWithRealPincode))}
      ${kpi('Customers — Unknown/Missing Pincode', fmtInt(dq.customersWithMissingPincode), 'included in every KPI above, never dropped', 'warn')}
      ${kpi('Customers — Claimed but Invalid Pincode', fmtInt(dq.customersWithClaimedButInvalidPincode), '6-digit-shaped but not a real India Post pincode')}
      ${kpi('Duplicate Customer Rows Found', fmtInt(dq.duplicateCustomerRows), dq.duplicateCustomerRows===0?'zero — de-dup verified':'', dq.duplicateCustomerRows===0?'ok':'crit')}
      ${kpi('Sales — Matched to a WebEngage Customer', fmtInt(dq.salesMatchedCuids), pctStr(dq.salesMatchedCuids/(dq.salesMatchedCuids+dq.salesUnmatchedCustomers)*100,1)+' of distinct sales customers')}
      ${kpi('Sales — Unmatched Customers', fmtInt(dq.salesUnmatchedCustomers), fmtMoney(dq.salesUnmatchedNetSales)+' kept OUT of pincode totals, not invented', 'warn')}
      ${kpi('Sales Net — Before Join (all of marketing_sale)', fmtMoney(dq.salesTotalNetSalesRaw))}
      ${kpi('Sales Net — After Join (matched only)', fmtMoney(dq.salesTotalNetSalesMatched))}
      ${kpi('Event Rows — Before Join', fmtInt(dq.eventTotalRowsRaw))}
      ${kpi('Event Rows — After Join', fmtInt(dq.eventTotalRowsAfterJoin), dq.eventTotalRowsRaw===dq.eventTotalRowsAfterJoin?'exact match — no fan-out':'', dq.eventTotalRowsRaw===dq.eventTotalRowsAfterJoin?'ok':'crit')}
      ${kpi('Customer Rows Shipped for Drill-down', fmtInt(dq.customersShippedForDrilldown), fmtInt(dq.customersOmittedUnknownBucket)+' UNKNOWN-bucket customers omitted from this file for size — see note above', 'warn')}
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6">Scope note: "Excel-style column filters" here means the dropdown/text filters above (State, City, Pincode, Campaign, Channel, Company, Product Category, Date Range, Search) plus every table column's own sort — a true per-numeric-column range-filter grid was not built this pass to keep the shared table component (reused by every other tab in this dashboard) unchanged; ask if per-column numeric filters are wanted specifically here.</p>`);
}

/* ── Deals & Sales by Pincode (added 2026-10-19) ───────────────────────────────────────────
   Store-opening view: per pincode / city, how many Zoho deals were CREATED and how much was SOLD
   (marketing_sale, placed on the sale's OWN ERP pincode). Respects the global State/City/Search
   filters. Only rows with at least one deal or one sale are listed. */
function tabDealsSales(){
  const D = STATE.data; const sm = D.dataQuality.salesMapping || {}; const zq = D.dataQuality.zohoDeals || {};
  const pc = filteredPincodes().filter(p => (p.zohoDeals||0) > 0 || (p.salesOrders||0) > 0);
  const sum = k => pc.reduce((a,p)=>a+(p[k]||0),0);
  const v = zq.validationBySource || {}; const vd = v.dealZip || {}, vc = v.contactZip || {};
  const ch = sm.byChannel || [];
  const chOnline = ch.find(c=>c.channel==='Online')||{}, chStore = ch.find(c=>c.channel==='Store')||{};
  const own = sm.atStoreOwnPincode || {};
  const F = STATE.filters;
  const filtered = !!(F.state||F.city||F.cityKey||F.q||F.priority);
  const kpis = `<div class="grid g-4" style="margin-bottom:16px">
    ${kpi('Zoho Deals Created (all)', fmtInt(zq.totalDeals), esc(zq.minDate||'')+' → '+esc(zq.maxDate||'')+' · '+fmtInt(zq.deals30)+' in last 30d')}
    ${kpi('Deals with a Real Pincode', fmtInt(zq.dealsWithRealPincode), pctStr((zq.dealsWithRealPincode||0)/(zq.totalDeals||1)*100)+' of deals · '+fmtInt(zq.pincodesWithDeals)+' pincodes', 'warn')}
    ${kpi('Total Sales (marketing_sale)', fmtMoney(sm.totalNetSales), esc(sm.minDate||'')+' → '+esc(sm.maxDate||'')+' · all channels')}
    ${kpi('Sales on the Sale Pincode', fmtMoney(sm.mappedNetSales), pctStr((sm.mappedNetSales||0)/(sm.totalNetSales||1)*100)+' of all sales', 'ok')}
    ${kpi('Online Sales Mapped', fmtMoney(chOnline.mappedNetSales), pctStr((chOnline.mappedNetSales||0)/(chOnline.netSales||1)*100)+' of '+fmtMoney(chOnline.netSales)+' · '+fmtInt(chOnline.mappedOrders)+' orders')}
    ${kpi('Store Sales Mapped', fmtMoney(chStore.mappedNetSales), pctStr((chStore.mappedNetSales||0)/(chStore.netSales||1)*100)+' of '+fmtMoney(chStore.netSales)+' · '+fmtInt(chStore.mappedOrders)+' orders')}
    ${kpi('Unmapped Sales', fmtMoney(sm.unmappedNetSales), 'no pincode anywhere, or Amazon / Mgmt / TAH ('+fmtMoney(sm.unmappedNonRetailNetSales||0)+')', 'crit')}
    ${kpi(filtered?'In Current Filter':'Pincodes with Deals or Sales', fmtInt(pc.length), fmtInt(sum('zohoDeals'))+' deals · '+fmtMoney(sum('netSales'))+' sales')}
  </div>`;
  const insights = [
    insightBox(`<b>Sales are placed on the buyer's own pincode.</b> Order of sources: marketing_sale.Pin_code → ERP invoice shipping pincode → ERP customer master (party) → the customer's typed CRM / Shopify record. <b>${fmtInt(own.lineItems)}</b> store line items (${fmtMoney(own.netSales)}) land on the selling store's own pincode — real local buyers or a store pincode typed at billing, so read that one pincode per store with care.`, 'ok'),
    insightBox(`<b>Zoho deal pincodes are approximate.</b> Checked live against the same buyer's ERP sale pincode: deal Address_Zip matched exactly for <b>${fmtInt(vd.exactPincodeMatch)} of ${fmtInt(vd.buyersCompared)}</b> (${fmtInt(vd.sameDistrict)} same district, median ${fmtInt(vd.medianKmApart)} km apart); Contact Mailing_Zip <b>${fmtInt(vc.exactPincodeMatch)} of ${fmtInt(vc.buyersCompared)}</b>. Deal COUNTS are real; read their location at <b>city / state</b> level and use Sales for pincode-level decisions.`, 'warn'),
    insightBox(`<b>Online sales far from a store</b> are the cleanest "demand without a store" signal — sort by <b>Online Sales</b> and check Distance KM. Store sales show the catchment of the stores you already have.`)
  ].join('');
  const cols = [
    {key:'pincode',label:'Pincode'},{key:'district',label:'City'},{key:'state',label:'State'},
    {key:'zohoDeals',label:'Deals Created',num:1,tone:'proxy',fmt:fmtInt},
    {key:'zohoDealCustomers',label:'Deal Customers',num:1,tone:'proxy',fmt:fmtInt},
    {key:'weCustomers',label:'WebEngage Customers',num:1,fmt:fmtInt},
    {key:'totalUniqueCustomers',label:'Total Customers (unique)',num:1,fmt:fmtInt},
    {key:'repeatDealPct',label:'Repeat Deal %',num:1,fmt:v=>v==null?'—':v.toFixed(1)+'%'},
    {key:'zohoDeals30',label:'Deals 30d',num:1,tone:'proxy',fmt:fmtInt},
    {key:'zohoDeals_dealZip',label:'Deals (deal zip)',num:1,tone:'proxy',fmt:fmtInt},
    {key:'zohoWon',label:'Deals Won',num:1,tone:'proxy',fmt:fmtInt},
    {key:'salesOrders',label:'Sale Orders',num:1,tone:'exact',fmt:fmtInt},
    {key:'netSales',label:'Sale Value',num:1,tone:'exact',fmt:fmtMoney},
    {key:'salesCustomers',label:'Buyers',num:1,tone:'exact',fmt:fmtInt},
    {key:'aov',label:'AOV',num:1,tone:'exact',fmt:v=>v==null?'—':fmtMoney(v)},
    {key:'netSales_online',label:'Online Sales',num:1,tone:'exact',fmt:v=>v?fmtMoney(v):'—'},
    {key:'salesOrders_online',label:'Online Orders',num:1,tone:'exact',fmt:v=>v?fmtInt(v):'—'},
    {key:'netSales_store',label:'Store Sales',num:1,tone:'exact',fmt:v=>v?fmtMoney(v):'—'},
    {key:'salesOrders_store',label:'Store Orders',num:1,tone:'exact',fmt:v=>v?fmtInt(v):'—'},
    {key:'netSales_zohoApprox',label:'Sales (Zoho approx.)',num:1,tone:'proxy',fmt:v=>v?fmtMoney(v):'—'},
    {key:'_nearestStoreName',label:'Nearest Store'},
    {key:'_distanceKm',label:'Distance KM',num:1,fmt:v=>v==null?'—':v}
  ];
  const rows = pc.map(p=>({
    pincode:p.pincode, district:p.district, state:p.state,
    zohoDeals:p.zohoDeals||0, zohoDeals30:p.zohoDeals30||0, zohoDeals_dealZip:p.zohoDeals_dealZip||0, zohoWon:p.zohoWon||0,
    zohoDealCustomers:p.zohoDealCustomers||0, weCustomers:p.weCustomers||0, totalUniqueCustomers:p.totalUniqueCustomers||0, repeatDealPct:p.repeatDealPct==null?null:p.repeatDealPct,
    salesOrders:p.salesOrders||0, netSales:p.netSales||0, salesCustomers:p.salesCustomers||0, aov:p.aov,
    netSales_online:p.netSales_online||0, salesOrders_online:p.salesOrders_online||0,
    netSales_store:p.netSales_store||0, salesOrders_store:p.salesOrders_store||0,
    netSales_zohoApprox:p.netSales_zohoApprox||0,
    _nearestStoreName:p.nearestStore?p.nearestStore.storeName:null, _distanceKm:p.nearestStore?p.nearestStore.distanceKm:null
  }));
  const t = renderTable({id:'ds-pin-tbl', columns:cols, rows, defaultSort:{key:'netSales',dir:-1}, csvName:'deals_sales_by_pincode', searchKeys:['pincode','district','state']});
  // City rows are grouped from the SAME filtered pincode rows (district + state), so the City table
  // always sums exactly to the Pincode table above (D.cities uses WebEngage city text and drops some districts).
  const storeCount = new Map(); (D.stores||[]).forEach(st=>{ const k=(st.district||'')+'|'+(st.state||''); storeCount.set(k,(storeCount.get(k)||0)+1); });
  const cityMap = new Map();
  for(const p of pc){ const k=(p.district||'')+'|'+(p.state||''); const c = cityMap.get(k) || {city:p.district, state:p.state, pincodes:0, zohoDeals:0, zohoDeals30:0, zohoWon:0, salesOrders:0, netSales:0, salesCustomers:0, netSales_online:0, netSales_store:0, existingStores:storeCount.get(k)||0};
    c.pincodes++; c.zohoDeals+=p.zohoDeals||0; c.zohoDeals30+=p.zohoDeals30||0; c.zohoWon+=p.zohoWon||0; c.salesOrders+=p.salesOrders||0; c.netSales+=p.netSales||0;
    c.salesCustomers+=p.salesCustomers||0; c.netSales_online+=p.netSales_online||0; c.netSales_store+=p.netSales_store||0; cityMap.set(k,c); }
  const cityRows = [...cityMap.values()];
  const ct = renderTable({id:'ds-city-tbl', columns:[
    {key:'city',label:'City (district)'},{key:'state',label:'State'},{key:'pincodes',label:'Pincodes',num:1,fmt:fmtInt},
    {key:'zohoDeals',label:'Deals Created',num:1,fmt:fmtInt},{key:'zohoDeals30',label:'Deals 30d',num:1,fmt:fmtInt},{key:'zohoWon',label:'Deals Won',num:1,fmt:fmtInt},
    {key:'salesOrders',label:'Sale Orders',num:1,fmt:fmtInt},{key:'netSales',label:'Sale Value',num:1,fmt:fmtMoney},{key:'salesCustomers',label:'Buyers',num:1,fmt:fmtInt},
    {key:'netSales_online',label:'Online Sales',num:1,fmt:v=>v?fmtMoney(v):'—'},{key:'netSales_store',label:'Store Sales',num:1,fmt:v=>v?fmtMoney(v):'—'},
    {key:'existingStores',label:'Our Stores',num:1,fmt:fmtInt}
  ], rows:cityRows, defaultSort:{key:'netSales',dir:-1}, csvName:'deals_sales_by_city', searchKeys:['city','state'], pageSize:15});
  const chRows = ch.map(c=>({...c, unmapped:c.netSales-c.mappedNetSales, pct:c.netSales?c.mappedNetSales/c.netSales*100:null}));
  const cht = renderTable({id:'ds-ch-tbl', columns:[
    {key:'channel',label:'Channel'},{key:'orders',label:'Orders',num:1,fmt:fmtInt},{key:'netSales',label:'Net Sales',num:1,fmt:fmtMoney},
    {key:'mappedOrders',label:'Orders on a Pincode',num:1,fmt:fmtInt},{key:'mappedNetSales',label:'Sales on a Pincode',num:1,fmt:fmtMoney},
    {key:'pct',label:'% Mapped',num:1,fmt:v=>pctStr(v)},{key:'unmapped',label:'Unmapped',num:1,fmt:fmtMoney}
  ], rows:chRows, defaultSort:{key:'netSales',dir:-1}, csvName:'sales_by_channel_mapping', pageSize:10});
  PENDING_MOUNTS.push(() => { t.mount(); ct.mount(); cht.mount(); });
  return secHead('Deals & Sales','Where Are Deals Created and Where Do We Actually Sell? — by Pincode and City',
    `Deals = every Zoho CRM deal created (zoho_crm.cdc_deals, ${esc(zq.minDate||'')} → ${esc(zq.maxDate||'')}). Sales = every line of <b>ds_imputed_reporting.marketing_sale</b> (${esc(sm.minDate||'')} → ${esc(sm.maxDate||'')}), placed on the <b>sale's own pincode</b>. Green columns are pincode-accurate; amber columns (Zoho) are approximate. Respects the State / City / Search filters.`) +
    renderGlobalFilters() + kpis + `<div style="display:grid;gap:10px;margin-bottom:16px">${insights}</div>` +
    card('Pincode — Deals Created vs Sales (sorted by Sale Value)', t.html) +
    card('City — Deals Created vs Sales', ct.html) +
    card('Sales Reconciliation by Channel — every rupee of marketing_sale accounted for', cht.html);
}

/* ── render dispatcher ─────────────────────────────────────────────── */
const TAB_FNS = { exec:tabExec, dealsales:tabDealsSales, qa:tabQA, pincode:tabPincode, pciTab:tabPincodeCustomerIntel, city:tabCity, state:tabState, map:tabMap, competitor:tabCompetitor, fakepincode:tabFakePincode, campaign:tabCampaign,
  campaignPincode:tabCampaignPincode, product:tabProduct, priceband:tabPriceband, storegap:tabStoreGap,
  recommend:tabRecommend, customer:tabCustomer, dataquality:tabDataQuality, methodology:tabMethodology,
  lineage:tabLineage };
function render(){
  if(!STATE.data){ document.getElementById('main').innerHTML = `<div class="empty">${STATE.source==='error' ? 'Could not load the data snapshot. Serve this folder over HTTP (e.g. <code>python -m http.server</code>) so the fetch to store_location_intel.json succeeds — file:// fetches are blocked by the browser.' : 'Loading…'}</div>`; return; }
  buildNav();
  PENDING_MOUNTS = [];
  const fn = TAB_FNS[STATE.tab] || tabExec;
  document.getElementById('main').innerHTML = fn();
  PENDING_MOUNTS.forEach(m=>m());
  mountGlobalFilters();
  mountDateFilter();
}
window.addEventListener('DOMContentLoaded', boot);
async function boot(){
  await loadData();
  const dot=document.getElementById('srcDot'), txt=document.getElementById('srcTxt');
  if(STATE.data){ dot.classList.add('live'); txt.textContent='Live snapshot · '+ (STATE.data.pincodes?STATE.data.pincodes.length.toLocaleString('en-IN'):'0') +' real pincodes'; }
  else { txt.textContent='Snapshot unavailable'; }
  STATE.tab = (location.hash||'#exec').slice(1);
  if(!TABS.some(t=>t[0]===STATE.tab)) STATE.tab='exec';
  render();
  document.getElementById('loader').classList.add('done');
  document.getElementById('app').classList.add('ready');
  document.getElementById('btnTheme').onclick = () => { const h=document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); render(); };
  document.getElementById('btnPrint').onclick = () => window.print();
}
</script>
