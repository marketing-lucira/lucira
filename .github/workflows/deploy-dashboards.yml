name: Deploy Dashboards to Pages

# Publishes Lucira dashboards to GitHub Pages as ONE site (a repo can host
# only one Pages site, so each dashboard gets a subpath):
#   /                   → dashboard/ga4-geo-intelligence-dashboard.html (+ its bundled data files)
#   /sku-intelligence/  → dashboard/ga4-sku-intelligence.html + gsi.js (reads its BigQuery
#                         export directly from a public GCS bucket URL baked into gsi.js —
#                         no secrets/API keys involved, nothing to inject here)
#
# Only these specific files are published — never the repo root as a whole — so
# the rest of this monorepo (CRM data, backend functions, any secrets) is NOT
# exposed. The dashboards read pre-built static snapshot data (no live API keys
# or credentials embedded).
#
# One-time setup required before this can go live: repo Settings → Pages →
# "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "dashboard/ga4-geo-intelligence-dashboard.html"
      - "dashboard/geo_intel_data.js"
      - "dashboard/caratlane_intel_data.js"
      - "dashboard/ga4-sku-intelligence.html"
      - "dashboard/gsi.js"
      - ".github/workflows/deploy-dashboards.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site _site/sku-intelligence
          touch _site/.nojekyll

          test -f dashboard/ga4-geo-intelligence-dashboard.html || { echo "::error::geo dashboard not found"; exit 1; }
          test -f dashboard/geo_intel_data.js || { echo "::error::geo_intel_data.js not found"; exit 1; }
          test -f dashboard/caratlane_intel_data.js || { echo "::error::caratlane_intel_data.js not found"; exit 1; }
          test -f dashboard/ga4-sku-intelligence.html || { echo "::error::sku intelligence dashboard not found"; exit 1; }
          test -f dashboard/gsi.js || { echo "::error::gsi.js not found"; exit 1; }

          cp dashboard/ga4-geo-intelligence-dashboard.html _site/index.html
          cp dashboard/geo_intel_data.js _site/geo_intel_data.js
          cp dashboard/caratlane_intel_data.js _site/caratlane_intel_data.js
          cp dashboard/ga4-sku-intelligence.html _site/sku-intelligence/index.html
          cp dashboard/gsi.js _site/sku-intelligence/gsi.js

          grep -q "Geo Intelligence" _site/index.html || { echo "::error::dashboard content missing"; exit 1; }
          grep -q "GA4 SKU Intelligence" _site/sku-intelligence/index.html || { echo "::error::sku intelligence content missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
