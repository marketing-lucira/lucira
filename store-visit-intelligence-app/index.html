<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Journey Intelligence — Lucira</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b6f56'/%3E%3Ctext x='16' y='22' font-family='Inter,sans-serif' font-size='17' font-weight='700' fill='%23fff8f0' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --card:#ffffff; --card2:#f8f7f4; --line:#e4e2dc; --line2:#eeece7;
  --tx:#141414; --tx2:#52514e; --tx3:#8a8983;
  --series-1:#2a78d6; --series-1-soft:#cde2fb;
  --good:#16833a; --good-bg:#e5f4ea; --warn:#a86b00; --warn-bg:#fdf3dc; --bad:#c62828; --bad-bg:#fde8e8;
  --brand:#8b6f56; --brand-dark:#6e5744; --brand-cream:#fff8f0;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --card:#1b1b1a; --card2:#222220; --line:#33332f; --line2:#2a2a27;
    --tx:#f4f4f2; --tx2:#c3c2b7; --tx3:#8f8e86;
    --series-1:#3987e5; --series-1-soft:#1c3a5e;
    --good:#4cc26f; --good-bg:#15301f; --warn:#e0a53a; --warn-bg:#342913; --bad:#f06a6a; --bad-bg:#3a1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --card:#1b1b1a; --card2:#222220; --line:#33332f; --line2:#2a2a27;
  --tx:#f4f4f2; --tx2:#c3c2b7; --tx3:#8f8e86;
  --series-1:#3987e5; --series-1-soft:#1c3a5e;
  --good:#4cc26f; --good-bg:#15301f; --warn:#e0a53a; --warn-bg:#342913; --bad:#f06a6a; --bad-bg:#3a1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px 60px}
button,select,input{font:inherit;color:inherit}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--tx3)}
.small{font-size:12px}

header.top{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;border-bottom:2px solid var(--brand-dark)}
.top .bar{max-width:1560px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{width:36px;height:36px;border-radius:10px;background:var(--brand-cream);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:12px;opacity:.85}
.top .spacer{flex:1}
.top .refresh{font-size:12.5px;text-align:right;line-height:1.35}
.top .refresh b{font-weight:700}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn:disabled{opacity:.5;cursor:default}
nav.tabs{max-width:1560px;margin:0 auto;padding:10px 20px 0;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:9px 16px;border-radius:9px 9px 0 0;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
nav.tabs button.on{background:var(--bg);color:var(--tx)}

.health{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;border:1px solid var(--line);background:var(--card)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.ok .dot{background:var(--good)} .pill.stale .dot{background:var(--warn)} .pill.err .dot{background:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--tx)}
.banner.err{background:var(--bad-bg);border-color:var(--bad);color:var(--tx)}
.banner b{font-weight:700}

.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;box-shadow:var(--shadow)}
.filters .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:130px}
.fld label{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.fld select,.fld input{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:210px}
.datebadge{display:inline-block;background:var(--series-1-soft);color:var(--tx);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;margin-bottom:8px}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--card2);border-radius:7px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.presets button.on{background:var(--series-1);border-color:var(--series-1);color:#fff}
.linkbtn{background:none;border:0;color:var(--series-1);cursor:pointer;font-size:12.5px;padding:6px 4px;font-weight:600}
.scope{font-size:12.5px;color:var(--tx2);margin-top:8px}

h2.sec{font-size:15px;margin:22px 0 10px;font-weight:700}
h2.sec .muted{font-weight:500;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--tx2);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .s{font-size:11.5px;color:var(--tx3);margin-top:1px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14px}
.card .desc{font-size:12px;color:var(--tx3);margin-bottom:10px}

.hbar{display:grid;grid-template-columns:160px 1fr 120px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hbar .track{height:18px;position:relative}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar .lab{color:var(--tx2)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums}
.hbar .val b{font-weight:700}
.hbar:hover .fill{filter:brightness(1.1)}

.trend svg{width:100%;height:220px;display:block}
.trend .axis text{fill:var(--tx3);font-size:10.5px}
.trend .grid line{stroke:var(--line2)}
.trend rect.bar{fill:var(--series-1)}
.trend rect.hit{fill:transparent;cursor:crosshair}
.trend rect.hit:hover + rect.bar,.trend g.b:hover rect.bar{filter:brightness(1.15)}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:none;min-width:150px}
#tip b{font-weight:700}

.breakdowns .tabsm{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabsm button{border:1px solid var(--line);background:var(--card2);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.tabsm button.on{background:var(--tx);color:var(--card);border-color:var(--tx)}

.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:640px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:var(--card2);text-align:left;font-weight:700;color:var(--tx2);padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.t th.num{text-align:right}
table.t th .arr{color:var(--series-1);margin-left:3px}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.t tbody tr:hover td{background:var(--card2)}
table.t tbody tr.click{cursor:pointer}
table.t tfoot td{font-weight:700;background:var(--card2);border-top:1px solid var(--line)}
.tbltools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbltools input{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:260px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--series-1)}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}

.st{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--card2)}
.st.s-sale{background:var(--good-bg);border-color:var(--good);color:var(--tx)}
.st.s-walk{background:var(--series-1-soft);border-color:var(--series-1);color:var(--tx)}
.st.s-conn,.st.s-call{background:var(--card2)}
.st.s-none{color:var(--tx3)}
.st.s-na{background:var(--warn-bg);border-color:var(--warn)}
.yes{color:var(--good);font-weight:700}
.no{color:var(--tx3)}

/* drawer */
#drawerBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:100;box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .2s;overflow:auto}
#drawer.open{transform:none}
#drawer .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:flex-start}
#drawer .dh h3{margin:0;font-size:16px}
#drawer .db{padding:14px 18px 40px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card2)}
.step h4{margin:0 0 6px;font-size:13.5px;letter-spacing:.3px;text-transform:uppercase}
.step .kv{display:grid;grid-template-columns:170px 1fr;gap:3px 10px;font-size:12.5px}
.step .kv div:nth-child(odd){color:var(--tx3)}
.arrow{text-align:center;color:var(--tx3);font-size:18px;margin:4px 0}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.mini td,.mini th{border-top:1px solid var(--line);padding:4px 6px;text-align:left}
.mini th{color:var(--tx3);font-weight:600}

/* help */
.help{max-width:980px}
.help h2{font-size:17px;margin:26px 0 8px}
.help h3{font-size:14px;margin:16px 0 6px}
.help p,.help li{color:var(--tx2);line-height:1.6}
.help code{background:var(--card2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
.help table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.help td,.help th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.help th{background:var(--card2)}

#boot{padding:60px 20px;text-align:center;color:var(--tx2)}
@media (max-width:640px){
  header.top{position:static}
  .top h1{font-size:15px}
  .wrap{padding:0 16px 60px}
  .fld{min-width:calc(50% - 5px)} .fld select,.fld input{max-width:none}
  .top .refresh{text-align:left}
  .hbar{grid-template-columns:100px 1fr 90px}
  .tbltools input{min-width:0;width:100%}
  .step .kv{grid-template-columns:120px 1fr}
}
.help .callout{border:1px solid var(--warn);background:var(--warn-bg);color:var(--tx);
  border-radius:10px;padding:12px 14px;margin:12px 0;line-height:1.55}
.help .callout b{color:var(--tx)}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brandmark">L</div>
    <div>
      <h1>Meeting → Call → Walk-in → Sale Intelligence</h1>
      <div class="sub">Zoho CRM meetings, tracked from the moment they are created · all times IST</div>
    </div>
    <div class="spacer"></div>
    <div class="refresh" id="refreshInfo">Loading live data…</div>
    <button class="hbtn" id="btnRefresh" title="Re-query BigQuery now (at most once a minute)">↻ Refresh</button>
    <button class="hbtn" id="btnTheme" title="Toggle light / dark">◐</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="created" class="on">1 · Created Time</button>
    <button data-tab="from">2 · From Date / Today</button>
    <button data-tab="help">3 · Help / Logic</button>
  </nav>
</header>

<div class="wrap">
  <div class="health" id="health"></div>
  <div id="banners"></div>
  <div id="boot">Loading live data from BigQuery…</div>
  <section id="tab-created" hidden></section>
  <section id="tab-from" hidden></section>
  <section id="tab-help" hidden></section>
</div>

<div id="tip"></div>
<div id="drawerBg"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh"><div style="flex:1"><h3 id="dTitle">Customer journey</h3><div class="small muted" id="dSub"></div></div><button class="btn" id="dClose">✕ Close</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script src="journey.js"></script>
</body>
</html>
